---
# Every NN-<app>/ directory next to this file is a stack. The NN- prefix is
# ordering only; renaming a directory deletes and recreates its stack.
working_dir: ./docker/nas
auto_discovery:
  depth: 1
  enabled: true
  delete: true
reconciliation:
  interval: 3600
  enabled: true
reference: refs/heads/main
webhook_filter: ^refs/heads/main$

# Compose-level secrets, once a stack needs one: add an `external_secrets:` map of
# `VAR: op://homelab/<item>/<field>` and consume it as ${VAR} in the compose file.
external_secrets:
  CF_API_TOKEN: op://homelab/doco-cd/CF_API_TOKEN
  HERMES_API_SERVER_KEY: op://homelab/hermes/API_SERVER_KEY
  HERMES_DASHBOARD_PASSWORD: op://homelab/hermes/DASHBOARD_PASSWORD
  HERMES_DASHBOARD_SECRET: op://homelab/hermes/DASHBOARD_SECRET
  HERMES_DASHBOARD_USERNAME: op://homelab/hermes/DASHBOARD_USERNAME
  UNIFI_API_KEY: op://homelab/unifi/API_KEY

force_recreate: false

# Set `enabled: true` to remove every stack below, with its images and volumes.
destroy:
  enabled: false
  remove_images: true
  remove_volumes: true

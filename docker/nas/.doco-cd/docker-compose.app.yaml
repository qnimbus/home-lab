---
# This file is not managed by doco-cd because it can't manage itself

secrets:
  op_token:
    file: /home/truenas_admin/.config/doco-cd/op_token
  api_keys:
    file: /home/truenas_admin/.config/doco-cd/api_keys
  webhook_secret:
    file: /home/truenas_admin/.config/doco-cd/webhook_secret
services:
  app:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.136.0@sha256:fa55a3a431e479163a06dd42b8d59ceb90483e958056fd8f325b304aaf3d2a97
    restart: unless-stopped
    environment:
      # A YAML list of keys, each with a role; read only at startup
      API_KEYS_FILE: /run/secrets/api_keys
      DEPLOY_CONFIG_BASE_DIR: ./docker/nas/
      HTTP_PORT: 8880
      LOG_LEVEL: info
      POLL_CONFIG: |
        - url: https://github.com/qnimbus/home-lab.git
          reference: refs/heads/main
          interval: 3600
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/op_token
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      TZ: Europe/Amsterdam
    ports:
      - 8880:8880
      - 9120:9120
    secrets:
      - op_token
      - api_keys
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
volumes:
  data: {}

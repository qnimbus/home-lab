---
name: dexd
services:
  dexd:
    container_name: dexd
    environment:
      DEFAULT_TARGET: docker.vwn.app
      TXT_PREFIX: dkr.
      UNIFI_API_KEY: ${UNIFI_API_KEY}
      UNIFI_HOST: https://gateway.lan.home.vwn.io
    image: ghcr.io/ishioni/dexd:0.4.5@sha256:f1e793713645dfe1aa2f7c85ee89814e5e96741d83c2a927a25700f910c5db21
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

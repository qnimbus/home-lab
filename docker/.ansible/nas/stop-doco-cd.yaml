---
- name: Stop Doco-CD
  hosts: nas
  become: true
  gather_facts: false
  vars:
    ansible_user: truenas_admin
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping: {}

    # `restart: unless-stopped` keeps it stopped across reboots; `just bootstrap nas` starts it again
    - name: doco-cd | Stop
      ansible.builtin.command: docker stop doco-cd
      changed_when: true
      when: not ansible_check_mode

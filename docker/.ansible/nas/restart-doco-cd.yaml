---
- name: Restart Doco-CD
  hosts: nas
  become: true
  gather_facts: false
  vars:
    ansible_user: truenas_admin
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping: {}

    - name: doco-cd
      block:
        # The container as it is: doco-cd deploys its own stack (docker/nas/99-doco-cd), so
        # nothing here applies a compose file
        - name: doco-cd | Restart
          ansible.builtin.command: docker restart doco-cd
          changed_when: true
          when: not ansible_check_mode

        - name: doco-cd | Wait for healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

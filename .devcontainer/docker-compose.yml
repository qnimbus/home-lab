services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:latest
    volumes:
      - type: bind
        source: ..
        target: /workspaces/home-lab
        consistency: cached
      - claude-home:/home/vscode/.claude
      - home-local:/home/vscode/.local
      - home-kub:/home/vscode/.kube

  meshcommander:
    build:
      context: .
      dockerfile: Dockerfile.meshcommander
    restart: unless-stopped

volumes:
  claude-home:
  home-local:
  home-kub:

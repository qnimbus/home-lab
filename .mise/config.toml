[env]
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
FLATE_PATH = "{{config_root}}/kubernetes/clusters/main"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"

[settings]
pypi.uvx = true

[plugins]
# krew = "https://github.com/soupglasses/mise-krew"
krew = "https://github.com/soupglasses/mise-krew#a1da38e9253d3714ebe1f3ca6c4a7a132c112147" # Temp pin for view-secret fix: https://github.com/soupglasses/mise-krew/pull/15

[tools]
"cloudflared" = "2026.10.5"
"etcd" = "3.6.14"
"flux-operator" = "0.62.1"
"flux-operator-mcp" = "0.62.1"
"flux2" = "2.10.0"
"gh" = "2.103.3"
"github:fluxcd/flux-schema" = "v0.17.0"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "3.0.4"
"go" = "1.27.3"
"gum" = "2.0.2"
"helm" = "4.3.1"
"helmfile" = "1.8.2"
"jactionlint" = "v2.3.0"
"jq" = "1.8.2"
"just" = "1.59.0"
"k9s" = "0.51.0"
"krew:view-secret" = "v0.16.0"
"kubecolor" = "0.8.0"
"kubeconform" = "0.8.0"
"kubectl" = "1.37.2"
"kustomize" = "5.8.3"
"lefthook" = "2.2.2"
"node" = "26.10.0"
"oxfmt" = "0.75.0"
"pypi:ansible" = "14.5.0"
"pypi:ansible-core" = "2.21.5"
"python" = "3.14.10"
"shellcheck" = "0.11.0"
"stern" = "1.35.0"
"talos" = "1.14.5"
"uv" = "0.13.6"
"yamlfmt" = "0.21.0"
"yamllint" = "1.38.0"
"yq" = "4.54.1"
"zizmor" = "1.31.1"

[hooks]
postinstall = [
  "lefthook install",
  "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]

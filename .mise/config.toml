[env]
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"

[settings]
pipx.uvx = true

[plugins]
# krew = "https://github.com/soupglasses/mise-krew"
krew = "https://github.com/soupglasses/mise-krew#a1da38e9253d3714ebe1f3ca6c4a7a132c112147" # Temporary pin for view-secret fix: https://github.com/soupglasses/mise-krew/pull/15

[tools]
"1password-cli" = "2.39.0"
"actionlint" = "1.7.12"
"age" = "1.3.2"
"cloudflared" = "2026.9.1"
"etcd" = "3.6.14"
"flux-operator" = "0.60.0"
"flux-operator-mcp" = "0.60.0"
"flux2" = "2.9.5"
"gh" = "2.101.0"
"github:fluxcd/flux-schema" = "0.13.0"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "2.24.0"
"go" = "1.27.1"
"gum" = "2.0.2"
"helm" = "4.3.0"
"helmfile" = "1.8.0"
"jq" = "1.8.2"
"just" = "1.58.0"
"k9s" = "0.51.0"
"krew:view-secret" = "v0.16.0"
"kubecolor" = "0.7.1"
"kubeconform" = "0.8.0"
"kubectl" = "1.37.1"
"kustomize" = "5.8.1"
"lefthook" = "2.1.14"
"node" = "26.10.0"
"oxfmt" = "0.67.0"
"pipx:ansible" = "14.4.0"
"pipx:ansible-core" = "2.21.4"
"shellcheck" = "0.11.0"
"sops" = "3.13.3"
"stern" = "1.34.0"
"talos" = "1.14.0"
"uv" = "0.12.18"
"yamlfmt" = "0.21.0"
"yamllint" = "1.38.0"
"yq" = "4.53.6"
"zizmor" = "1.30.1"

[hooks]
postinstall = [
  "lefthook install",
  "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml",
]

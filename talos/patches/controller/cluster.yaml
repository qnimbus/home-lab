cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
      # Enable MutatingAdmissionPolicy (alpha gate)
      runtime-config: admissionregistration.k8s.io/v1alpha1=true
      feature-gates: MutatingAdmissionPolicy=true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true   # replaced by Cilium's DNS proxy / external CoreDNS HelmRelease
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - "10.60.0.0/24"   # nodeSubnet in talenv.yaml — keep etcd traffic on LAN
  proxy:
    disabled: true   # replaced by Cilium kube-proxy replacement
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0

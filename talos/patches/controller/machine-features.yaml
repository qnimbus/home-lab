machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - system-upgrade         # used by tuppr for Talos/k8s upgrades
        - actions-runner-system  # home-lab runner's Talos ServiceAccount (talosctl, e.g. image pre-pull CI)

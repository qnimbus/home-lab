---
# yaml-language-server: $schema=https://schemas.clustrs.dev/core/secret_v1.json
# GitRepository pull credentials for flux-instance (instance.sync.pullSecret).
# Flux takes it over via flux-instance's own ExternalSecret once running.
apiVersion: v1
kind: Secret
metadata:
  name: flux-github-app
  namespace: flux-system
stringData:
  githubAppID: op://homelab/GitHub App/githubAppID
  githubAppInstallationID: op://homelab/GitHub App/githubAppInstallationID
  githubAppPrivateKey: |
    op://homelab/GitHub App/githubAppPrivateKey

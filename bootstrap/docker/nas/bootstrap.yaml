---
- name: Bootstrap TrueNAS
  hosts: nas
  become: true
  gather_facts: false
  vars:
    ansible_user: truenas_admin
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping: {}

    - name: Read secrets from 1Password
      ansible.builtin.shell: "op read 'op://{{ item.key }}' < /dev/null"
      delegate_to: localhost
      become: false
      vars:
        # Runs locally: interpreter discovery would pick the first python3.x on PATH, which
        # can be a mise shim for a version this repo doesn't pin, and that fails.
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      loop:
        - key: homelab/doco-cd/OP_SERVICE_ACCOUNT_TOKEN
          var: doco_op_service_account_token
        - key: homelab/doco-cd/WEBHOOK_SECRET
          var: doco_webhook_secret
        - key: homelab/doco-cd/API_SECRET
          var: doco_api_key
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_op_service_account_token: "{{ secrets_raw.results[0].stdout }}"
        doco_webhook_secret: "{{ secrets_raw.results[1].stdout }}"
        doco_api_key: "{{ secrets_raw.results[2].stdout }}"
      no_log: true

    - name: doco-cd
      vars:
        dococd_config_dir: /home/truenas_admin/.config/doco-cd
        # The stack's directory under docker/nas/: doco-cd uses it as the project name
        dococd_project: 99-doco-cd
      block:
        - name: doco-cd | Create directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: truenas_admin
            group: truenas_admin
            mode: "0700"

        # Only used to start doco-cd when none is running; after that doco-cd deploys its
        # stack from its own checkout.
        - name: doco-cd | Copy docker-compose file
          ansible.builtin.copy:
            src: ../../../docker/nas/99-doco-cd/docker-compose.yaml
            dest: "{{ dococd_config_dir }}/docker-compose.yaml"
            owner: truenas_admin
            group: truenas_admin
            mode: "0644"

        # root-owned: doco-cd runs with cap_drop ALL, so root in the container
        # can't read files owned by anyone else (no DAC_OVERRIDE).
        - name: doco-cd | Create secrets
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: |
              {{ item.content }}
            owner: root
            group: root
            mode: "0600"
          no_log: true
          register: dococd_secrets
          loop:
            - name: op_token
              content: "{{ doco_op_service_account_token }}"
            - name: webhook_secret
              content: "{{ doco_webhook_secret }}"
            # doco-cd's API_KEYS_FILE. `write` covers every docker/mod.just recipe:
            # listing and inspecting projects, stopping them, poll runs and run lookups.
            # Not `full`, which adds deleting projects.
            - name: api_keys
              content: "{{ [{'key': doco_api_key, 'role': 'write'}] | to_nice_yaml }}"

        - name: doco-cd | Create shared apps network
          community.docker.docker_network:
            name: apps
            driver: bridge
            driver_options:
              com.docker.network.bridge.name: br-apps
            ipam_config:
              - subnet: 172.16.8.0/24
                gateway: 172.16.8.1
                iprange: 172.16.8.128/25
            state: present

        - name: doco-cd | Create data volume
          community.docker.docker_volume:
            name: doco-cd_data
            state: present

        - name: doco-cd | Inspect the doco-cd container
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_container

        - name: doco-cd | Find its Compose project
          ansible.builtin.set_fact:
            dococd_container_project: "{{ dococd_container.container.Config.Labels['com.docker.compose.project'] | default('') if dococd_container.exists else '' }}"

        # A doco-cd from any other Compose project (the `doco-cd` project from before it
        # managed itself) holds the container name; doco-cd wouldn't see it as itself.
        - name: doco-cd | Remove doco-cd from another project
          when:
            - dococd_container.exists
            - dococd_container_project != dococd_project
            - not ansible_check_mode
          block:
            - name: doco-cd | Remove the container
              community.docker.docker_container:
                name: doco-cd
                state: absent

            - name: doco-cd | Remove its project network
              community.docker.docker_network:
                name: "{{ dococd_container_project }}_default"
                state: absent
              when: dococd_container_project | length > 0

        # Once doco-cd runs from its own project it deploys itself: starting it again here
        # would undo or race a self-update.
        - name: doco-cd | Start
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            project_name: "{{ dococd_project }}"
            files:
              - docker-compose.yaml
            pull: always
            state: present
          when:
            - dococd_container_project != dococd_project
            - not ansible_check_mode

        # Secret files are read only at startup. A stopped container (`just docker
        # stop-doco-cd`) is started as it is, without applying this checkout's compose file.
        - name: doco-cd | Start or restart its own container
          ansible.builtin.command: docker {{ 'restart' if dococd_container.container.State.Running else 'start' }} doco-cd
          changed_when: true
          when:
            - dococd_container_project == dococd_project
            - dococd_secrets.changed or not dococd_container.container.State.Running
            - not ansible_check_mode

        - name: doco-cd | Wait for healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

---
- name: Bootstrap TrueNAS
  hosts: nas
  become: true
  gather_facts: false
  vars:
    ansible_user: truenas_admin
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping: {}

    - name: Read secrets from 1Password
      ansible.builtin.shell: "op read 'op://{{ item.key }}' < /dev/null"
      delegate_to: localhost
      become: false
      loop:
        - key: homelab/doco-cd/OP_SERVICE_ACCOUNT_TOKEN
          var: doco_op_service_account_token
        - key: homelab/doco-cd/WEBHOOK_SECRET
          var: doco_webhook_secret
        - key: homelab/doco-cd/API_SECRET
          var: doco_api_secret
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_op_service_account_token: "{{ secrets_raw.results[0].stdout }}"
        doco_webhook_secret: "{{ secrets_raw.results[1].stdout }}"
        doco_api_secret: "{{ secrets_raw.results[2].stdout }}"
      no_log: true

    - name: Docker | Create shared apps network
      community.docker.docker_network:
        name: apps
        driver: bridge
        driver_options:
          com.docker.network.bridge.name: br-apps
        ipam_config:
          - subnet: 172.16.8.0/24
            gateway: 172.16.8.1
        state: present

    - name: doco-cd
      vars:
        dococd_config_dir: /home/truenas_admin/.config/doco-cd
      block:
        - name: doco-cd | Create directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: truenas_admin
            group: truenas_admin
            mode: "0700"

        - name: doco-cd | Copy docker-compose app file
          ansible.builtin.copy:
            src: ../../../docker/nas/.doco-cd/docker-compose.app.yaml
            dest: "{{ dococd_config_dir }}/docker-compose.yaml"
            owner: truenas_admin
            group: truenas_admin
            mode: "0644"
          register: compose_file

        # root-owned: doco-cd runs with cap_drop ALL, so root in the container
        # can't read files owned by anyone else (no DAC_OVERRIDE).
        - name: doco-cd | Create secrets
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: |
              {{ item.content }}
            owner: root
            group: root
            mode: "0600"
          no_log: true
          loop:
            - name: op_token
              content: "{{ doco_op_service_account_token }}"
            - name: webhook_secret
              content: "{{ doco_webhook_secret }}"
            - name: api_secret
              content: "{{ doco_api_secret }}"

        - name: doco-cd | Run docker-compose
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            files:
              - docker-compose.yaml
            pull: always
            state: present
          when: not ansible_check_mode

        - name: doco-cd | Wait for healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

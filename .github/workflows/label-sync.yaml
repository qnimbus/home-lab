---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Label Sync

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/labels.yaml
  schedule:
    - cron: "10 1 * * *"
      timezone: "Europe/Amsterdam"

permissions:
  contents: read

jobs:
  main:
    name: Label Sync - Sync Labels
    runs-on: ${{ vars.RUNNER || 'home-lab' }} # RUNNER=ubuntu-24.04 falls back to GitHub-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/labels.yaml

      - name: Sync Labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yaml # labels not in the file are deleted (skip-delete defaults to false)

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

# Self-hosted Renovate running as the github-bot App (1Password → App token, as in labeler.yaml).
# `env:` below is Renovate global config; repository config lives in .renovaterc.json5.
# Runs on the in-cluster runner; set the repo variable RUNNER=ubuntu-24.04 to fall back to
# GitHub-hosted (e.g. while the cluster is down).

on:
  push:
    branches:
      - main
    paths: # config change → immediate run
      - .renovaterc.json5
      - .github/workflows/renovate.yaml
  schedule:
    - cron: "50 * * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (RENOVATE_DRY_RUN=full — extract, lookup, log, write nothing)
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log level
        type: choice
        default: info
        options:
          - info
          - debug
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ${{ vars.RUNNER || 'home-lab' }}
    timeout-minutes: 20 # App token lives 60 min; a normal run takes a few
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://GitHub/github-bot/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://GitHub/github-bot/GITHUB_BOT_APP_PRIVATE_KEY

      # Scoped down from the App's installed permissions.
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # dependency dashboard
          permission-workflows: write # else branches touching .github/workflows/ are rejected
          permission-checks: read # branch status for internalChecksFilter / dashboard
          permission-statuses: write # posts renovate/stability-days; read alone 403s the whole run

      # No actions/checkout: Renovate clones the repository itself with the token.
      # A container step, not renovatebot/github-action: that action shells out to `docker run`,
      # and the home-lab runner (Kubernetes container mode) has no Docker — the runner's
      # container hook starts this step as its own pod instead. Only this step runs in the image;
      # the steps above stay on the runner, whose user owns the step-output files they write.
      - name: Run Renovate
        uses: docker://ghcr.io/renovatebot/renovate:44.65.5@sha256:4e10f76a79f1c597f427f83c788a9f5b14a6295784c4cb68307b89b0a954abce
        env:
          # The runner points HOME at /github/home, owned by the runner's user rather than the
          # image's (uid 12021); restore the image's own home, where containerbase keeps tools.
          HOME: /home/ubuntu
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }} # empty unless dispatched with dryRun
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled # commits via the API, signed as the App
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}

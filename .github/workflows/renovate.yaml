---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

# Self-hosted Renovate running as the github-bot App (1Password → App token, as in labeler.yaml).
# `env:` below is Renovate global config; repository config lives in .renovaterc.json5.
# Always GitHub-hosted, so it keeps running while the cluster is down.

on:
  push:
    branches:
      - main
    paths: # config change → immediate run
      - .renovaterc.json5
      - .github/workflows/renovate.yaml
  schedule:
    # `timezone: "Europe/Amsterdam"` is off while testing whether it is why GitHub
    # creates only ~5 of the 24 hourly runs a day (bykaj's cron without it gets
    # all 24). Dropping it changes nothing here: Amsterdam's offset is whole hours
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (RENOVATE_DRY_RUN=full — extract, lookup, log, write nothing)
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log level
        type: choice
        default: info
        options:
          - info
          - debug
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-26.04
    timeout-minutes: 20 # App token lives 60 min; a normal run takes a few
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://GitHub/github-bot/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://GitHub/github-bot/GITHUB_BOT_APP_PRIVATE_KEY

      # Scoped down from the App's installed permissions.
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # dependency dashboard
          permission-workflows: write # else branches touching .github/workflows/ are rejected
          permission-checks: read # branch status for internalChecksFilter / dashboard
          permission-statuses: write # posts renovate/stability-days; read alone 403s the whole run

      # No actions/checkout: Renovate clones the repository itself with the token.
      # renovate-version is the ghcr.io/renovatebot/renovate image tag; Renovate tracks it
      # in the renovate group, next to the npm pin in .lefthook.yaml.
      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }} # empty unless dispatched with dryRun
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled # commits via the API, signed as the App
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          renovate-version: 44.190.1
          token: ${{ steps.app-token.outputs.token }}

---
name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool versions come from .mise/config.toml.
      - name: Install flux, flux-schema, kustomize, lefthook + uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: flux2 github:fluxcd/flux-schema kustomize lefthook uv
          # Soak window on the mise binary itself: mise.jdx.dev/VERSION can advertise a release
          # before its GitHub assets exist (2026-09-08: every run failed on `curl: (22)`).
          # Preferred over a hard `version` pin that nothing would keep up to date.
          minimum_release_age: "24h"

      # Vendored flux-schema script (online catalog). -E fills Flux ${VAR}s with placeholders so
      # pattern-checked fields pass; the excluded dirs aren't Kubernetes manifests.
      - name: Validate Kubernetes manifests
        run: |
          bash .agents/skills/gitops-repo-audit/scripts/validate.sh \
            -d kubernetes \
            -E .github/validate.env \
            -e kubernetes/talos

      # Offline: fixtures stand in for git, Konflate and Jev.
      - name: Test PR risk classifier
        run: uv run --no-project --python 3.13 -m unittest discover .github/scripts/pr-risk/tests

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      # Same command as the pre-commit hook, so the version pin lives only in .lefthook.yaml.
      - name: Validate Renovate config
        run: lefthook run pre-commit --all-files --command validate-renovate

---
name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        env:
          YQ_VERSION: "4.53.2"
          KUSTOMIZE_VERSION: "5.8.1"
          KUBECONFORM_VERSION: "0.7.0"
        run: |
          curl -sSL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq

          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin

          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Validate Kubernetes manifests
        # Scoped to kubernetes/ to avoid false positives from Taskfile.yaml and talos patches.
        # ops/bootstrap/ (Helmfile, not Kubernetes resources) lives outside kubernetes/, so no exclude needed.
        run: |
          bash scripts/validate.sh \
            -d kubernetes

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Validate Renovate config
        run: bash scripts/validate-renovate.sh

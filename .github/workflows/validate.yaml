---
name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A lockfile can only have been broken by a change under .mise/, so only those runs are
      # strict about it. Everywhere else an unusable lockfile is a warning: a new mise release
      # that rejects an old entry must not turn unrelated runs red. If the comparison fails
      # (a force-push can orphan `before`), assume .mise/ changed.
      - name: Did this change touch .mise/?
        id: mise-changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" \
            --jq '[.files[].filename | select(startswith(".mise/"))] | length > 0') || changed=true
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      # Tool versions come from .mise/config.toml.
      - name: Install flux, flux-schema, kustomize, lefthook + uv
        uses: $/.github/actions/setup-mise
        with:
          tools: flux2 github:fluxcd/flux-schema kustomize lefthook uv
          strict: ${{ steps.mise-changed.outputs.changed }}

      # Vendored flux-schema script (online catalog). -E fills Flux ${VAR}s with placeholders so
      # pattern-checked fields pass; the excluded dirs aren't Kubernetes manifests.
      - name: Validate Kubernetes manifests
        run: |
          bash .agents/skills/gitops-repo-audit/scripts/validate.sh \
            -d kubernetes \
            -E .github/validate.env \
            -e kubernetes/talos

      # Offline: fixtures stand in for git, Konflate and Jev.
      - name: Test PR risk classifier
        run: uv run --no-project --python 3.13 -m unittest discover .github/scripts/pr-risk/tests

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Same command as the pre-commit hook, so the version pin lives only in .lefthook.yaml.
      - name: Validate Renovate config
        run: lefthook run pre-commit --all-files --command validate-renovate

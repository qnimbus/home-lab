---
name: Validate Manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tool versions come from .mise/config.toml; see flux-render.yaml for why
      # minimum_release_age is set instead of pinning the mise version.
      - name: Install flux, flux-schema, kustomize + lefthook
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: flux2 github:fluxcd/flux-schema kustomize lefthook
          minimum_release_age: "24h"

      # validate.sh is vendored by the gitops-repo-audit skill (fluxcd/flux-schema
      # upstream) and validates against the online schema catalog — no local
      # schemas. -E renders Flux ${VAR} substitutions with placeholder values so
      # hostname/IP fields pass their schema patterns. Excluded dirs aren't
      # Kubernetes manifests (Talos config, a
      # kustomize replacements list).
      - name: Validate Kubernetes manifests
        run: |
          bash .agents/skills/gitops-repo-audit/scripts/validate.sh \
            -d kubernetes \
            -E .github/validate.env \
            -e kubernetes/components/replacements \
            -e kubernetes/talos

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      # Runs the pre-commit hook's command so the validator and its version pin
      # live in one place (.lefthook.yaml); --all-files feeds it .renovaterc.json5.
      - name: Validate Renovate config
        run: lefthook run pre-commit --all-files --command validate-renovate

---
name: Auto-review Renovate PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Cancel any in-progress review for the same PR when a new commit is pushed.
concurrency:
  group: renovate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor == 'renovate[bot]'
    runs-on: home-lab-readonly
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 30
        with:
          # ANTHROPIC_API_KEY is a GitHub Actions secret (Settings → Secrets and
          # variables → Actions). GitHub auto-masks secrets.* everywhere in logs,
          # including the action's own "Post Run" step that echoes its env: block —
          # which is how the key leaked on 2026-06-23 when it was sourced from a
          # Kubernetes-injected env var that GitHub had no way to know to scrub.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'renovate' # Or '*' to allow all bots
          claude_args: |
            --allowedTools "Read,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} using the
            pr-upgrade-reviewer agent. Assess upgrade risk, breaking changes,
            and whether it is safe to merge. Post your findings as a PR comment.

---
name: Auto-review Renovate PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Cancel any in-progress review for the same PR when a new commit is pushed.
concurrency:
  group: renovate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor == 'renovate[bot]'
    runs-on: home-lab-readonly
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 30
        with:
          # ANTHROPIC_API_KEY is a GitHub Actions secret (Settings → Secrets and
          # variables → Actions). GitHub auto-masks secrets.* everywhere in logs,
          # including the action's own "Post Run" step that echoes its env: block —
          # which is how the key leaked on 2026-06-23 when it was sourced from a
          # Kubernetes-injected env var that GitHub had no way to know to scrub.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'renovate' # Or '*' to allow all bots
          # Task: required to delegate to the pr-upgrade-reviewer subagent (its own
          # disallowedTools denylist + pr-reviewer-bash-guard.sh hook are the security
          # boundary). WebFetch/WebSearch: the agent's core job is fetching upstream
          # release notes/changelogs — these were removed earlier only because the
          # (now-reverted) CiliumNetworkPolicy would have blocked them; restored here.
          # --model pins the Claude Code session model. PR review (read diff +
          # release notes, assess upgrade risk) doesn't need Opus-tier; Sonnet 4.6
          # is ~60% the cost ($3/$15 vs $5/$25 per 1M tok) at ample capability.
          # Drop this flag to fall back to the action's Opus default.
          claude_args: |
            --model claude-sonnet-4-6 --allowedTools "Read,WebFetch,WebSearch,Task,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} using the
            pr-upgrade-reviewer agent. Assess upgrade risk, breaking changes,
            and whether it is safe to merge. Post your findings as a PR comment.

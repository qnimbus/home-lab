---
name: Auto-review Renovate PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Cancel any in-progress review for the same PR when a new commit is pushed.
concurrency:
  group: renovate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.actor == 'renovate[bot]'
    runs-on: home-lab
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Export Kubernetes-injected secrets to GitHub env context
        # ${{ env.* }} expressions only read from the Actions env context, not
        # from OS-level env vars injected by Kubernetes. This step bridges the gap.
        run: echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> $GITHUB_ENV

      - name: Check ANTHROPIC_API_KEY present
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ERROR: ANTHROPIC_API_KEY is not present in the runner environment"
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 30
        with:
          # ANTHROPIC_API_KEY is injected into the runner pod via ExternalSecret →
          # Kubernetes Secret → runner env; read from env rather than GitHub secrets.
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'renovate' # Or '*' to allow all bots
          claude_args: |
            --allowedTools "Read,WebFetch,WebSearch,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} using the
            pr-upgrade-reviewer agent. Assess upgrade risk, breaking changes,
            and whether it is safe to merge. Post your findings as a PR comment.

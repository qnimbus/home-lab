---
name: Auto-review Renovate PRs

on:
  pull_request:
    # synchronize deliberately excluded: Renovate rebases long-lived PRs repeatedly
    # (e.g. 7 pushes to a single major-bump PR within 5 hours has been observed),
    # and each push would otherwise re-run the full paid Claude review from scratch
    # with no dedup against "did the actual dependency version change". A rebase
    # alone doesn't need a fresh review; trigger one manually via workflow_dispatch
    # if the PR content meaningfully changed.
    types: [opened, reopened, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to review. Manual runs bypass the Renovate-only and
          type/major|minor label gates below — workflow_dispatch is itself
          already restricted by GitHub to users with write access to this
          repo, so there's nothing left to additionally gate on.
        required: true
        type: number

# Cancel any in-progress review for the same PR if opened/reopened/labeled fires again
# (e.g. the labeled-after-opened race below) before the first run finishes.
concurrency:
  group: renovate-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Automatic runs (pull_request event) are gated to genuine Renovate PRs only.
    # Gate on the PR's actual creator (pull_request.user.login), not github.actor —
    # actor reflects whoever triggered THIS event, which flips to a human on
    # `synchronize` if anyone other than Renovate ever pushes to the branch, and that
    # would wrongly skip a legitimate Renovate PR. head.repo check rejects any PR whose
    # branch lives outside this repo (fork) as defense-in-depth against a third party
    # somehow triggering this with secrets in scope — Renovate runs under our bot App
    # (.github/workflows/renovate.yaml) and always pushes branches directly into this
    # repo, so a fork head here is never genuine.
    # Manual runs (workflow_dispatch) skip both checks — see the input description above.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.login == 'qnimbus-homelab-assistant[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: home-lab
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Gate on update type
        id: gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Renovate labels every PR with the type/* tier(s) it touched (see
          # renovate.json5's "Labels" packageRules). Skip the paid Claude review for
          # PRs that are patch-only or carry no type/* label at all (e.g. a pure
          # digest bump) — those are either auto-merged outright already or low-risk
          # enough that Renovate's own changelog link in the PR body is sufficient.
          # Reads labels live via the API rather than trusting this event's label
          # snapshot: Renovate adds labels in a follow-up call after creating the PR,
          # so `opened` can fire before they land — `labeled` is in the trigger list
          # above to catch that race. Runs before checkout so a skipped PR doesn't
          # even pay for a clone. Skipped entirely on workflow_dispatch — a manual run
          # always proceeds regardless of label.
          labels=$(gh pr view "${{ github.event.pull_request.number }}" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qE '^type/(major|minor)$' <<< "$labels"; then
            echo "run_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping AI review — no type/major or type/minor label (patch-only or unlabeled)."
          fi

      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run_review == 'true'
        timeout-minutes: 5
        with:
          # pull_request events auto-detect the right ref (the test-merge commit);
          # workflow_dispatch has no PR context to infer from, so point it at the
          # PR's head explicitly. /head (not /merge) so a manual run still works
          # against a PR with merge conflicts.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      # Same 1Password → step-output pattern as flux-render.yaml/labeler.yaml/renovate.yaml.
      # ANTHROPIC_API_KEY previously lived here as a GitHub Actions secret (Settings →
      # Secrets and variables → Actions) after the 2026-06-23 leak — the key was sourced
      # from a Kubernetes-injected env var that never went through GitHub's log-masking
      # engine, so the action's own "Post Run" step echoed it in plaintext. That's fixed
      # here differently: 1password/load-secrets-action calls core.setSecret() on every
      # value it loads, registering it with the same runner-side masking engine
      # `secrets.*` uses, so this is exempt from the failure mode that caused the original
      # leak while restoring 1Password as the single source of truth. The item lives in
      # the `GitHub` vault (not `homelab`) — see docs/EXTERNAL-SECRETS.yaml — to keep
      # CI-scoped credentials segregated from the cluster-facing vault.
      - name: Load Secrets
        id: load-secrets
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run_review == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: op://GitHub/anthropic/API_KEY

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run_review == 'true'
        timeout-minutes: 30
        with:
          anthropic_api_key: ${{ steps.load-secrets.outputs.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'renovate' # Or '*' to allow all bots
          # Without this, the job log prints "Claude Code initialized" and then goes
          # completely silent until the process exits — confirmed on both a normal
          # 3-minute run and the 16-minute run that preceded this workflow's 2026-07-04
          # disable. Same log either way, no way to tell legitimate slow work from a
          # stuck loop. This trades that blind spot for a full turn-by-turn tool-call
          # trace in the log. allowedTools below is read-only-ish (Read/WebFetch/
          # WebSearch/Task + three narrow `gh pr` Bash subcommands), so the risk of
          # this echoing a secret is low, but it's still worth knowing before grepping
          # a log dump.
          show_full_output: true
          # Task: required to delegate to the pr-upgrade-reviewer subagent (its own
          # disallowedTools denylist + pr-reviewer-bash-guard.sh hook are the security
          # boundary). WebFetch/WebSearch: the agent's core job is fetching upstream
          # release notes/changelogs — these were removed earlier only because the
          # (now-reverted) CiliumNetworkPolicy would have blocked them; restored here.
          # --model pins the Claude Code session model. PR review (read diff +
          # release notes, assess upgrade risk) doesn't need Opus-tier; Sonnet 4.6
          # is ~60% the cost ($3/$15 vs $5/$25 per 1M tok) at ample capability.
          # Drop this flag to fall back to the action's Opus default.
          claude_args: |
            --model claude-sonnet-4-6 --allowedTools "Read,WebFetch,WebSearch,Task,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number || inputs.pr_number }} using
            the pr-upgrade-reviewer agent. Assess upgrade risk, breaking changes,
            and whether it is safe to merge. Post your findings as a PR comment.

            Note: the local checkout in this workspace is the PR's own head commit
            (or a test-merge of it), never the current main branch — a changed file
            will already show the PR's proposed value when read locally, which is
            expected and proves nothing about main. Never conclude a change is
            "already on main" or that the PR is "superseded" from local file
            contents; that can only be established via the GitHub API against an
            explicit main ref.

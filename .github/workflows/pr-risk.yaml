---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Risk

# Classifies each PR as risk/safe|review|risky (+ risk/uncertain) from git facts, path tiers,
# Konflate's render and TypeSafe Jev. Advisory and fail-open: code decides, Jev can only raise
# the level, and no step here can fail the job over a classification problem. PR_RISK_MODE picks
# what it publishes: shadow (default: job summary + artifact), labels, or comment (labels + comment).
# See .github/scripts/pr-risk/README.md.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: PR Risk
    # Same-repo PRs only: the job runs on the in-cluster runner with secrets. Drafts wait for
    # ready_for_review, as Konflate does.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    # Its own variable, not RUNNER: Konflate is only reachable in-cluster. On a GitHub-hosted
    # runner the classifier still runs, raw-diff-only and flagged uncertain.
    runs-on: ${{ vars.PR_RISK_RUNNER || 'home-lab' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # labels + the sticky comment
    steps:
      # The base branch, never the PR: the classifier comes from main, so a PR can't rewrite its
      # own verdict. PR content is only read as git objects (diff, merge-tree), never executed.
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0 # merge-base, overlap and the PR head (a same-repo branch)
          persist-credentials: false

      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        continue-on-error: true # no key: deterministic signals only, flagged uncertain
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TYPESAFE_API_KEY: op://GitHub/jev/API_KEY

      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv
          minimum_release_age: "24h" # see validate.yaml
          cache: false # see image-pull.yaml

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          KONFLATE_URL: ${{ vars.KONFLATE_URL || 'http://konflate.flux-system.svc.cluster.local:8080' }}
          KONFLATE_WAIT_SECONDS: ${{ vars.KONFLATE_WAIT_SECONDS || '480' }}
        run: >-
          uv run --no-project --python 3.13 .github/scripts/pr-risk/pr_risk.py collect
          --base "origin/${BASE_REF}" --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/pr-risk"

      - name: Classify
        id: classify
        if: ${{ steps.collect.outcome == 'success' }}
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ steps.load-secrets.outputs.TYPESAFE_API_KEY }}
          JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-1.13.0' }}
          PR_RISK_MODE: ${{ vars.PR_RISK_MODE }}
        run: |-
          uv run --no-project --python 3.13 .github/scripts/pr-risk/pr_risk.py classify --input "$RUNNER_TEMP/pr-risk"
          {
            if [ "${PR_RISK_MODE:-shadow}" = shadow ]; then echo '> Shadow mode: nothing published to the PR.'; echo; fi
            cat "$RUNNER_TEMP/pr-risk/comment.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: ${{ steps.classify.outcome == 'success' && contains(fromJSON('["labels", "comment"]'), vars.PR_RISK_MODE) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_RISK_MODE: ${{ vars.PR_RISK_MODE }}
        run: uv run --no-project --python 3.13 .github/scripts/pr-risk/pr_risk.py publish --input "$RUNNER_TEMP/pr-risk"

      - name: Classification unavailable
        if: ${{ steps.classify.outcome != 'success' }}
        run: echo '### ⚪ PR risk unavailable — existing labels left as they are; see the step logs.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-risk-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/pr-risk/result.json
            ${{ runner.temp }}/pr-risk/comment.md
            ${{ runner.temp }}/pr-risk/konflate.json
          if-no-files-found: ignore
          retention-days: 30

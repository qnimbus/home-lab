---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Risk

# Classifies a PR as risk/safe|review|risky (+ risk/uncertain) with the pr-risk/v2 model: typed
# findings from git, Konflate's render and TypeSafe Jev, an evidence ledger per surface, and a
# deterministic policy. Advisory and fail-open: Jev can add findings but never remove one, and a
# Jev or Konflate outage publishes nothing. No step here can fail the job over a classification
# problem. PR_RISK_MODE picks what it publishes: shadow (default: job summary + artifact),
# labels, or comment (labels + comment).
# Runs on every same-repo PR to main, and on demand (`gh workflow run pr-risk.yaml -f pr=<number>`).
# See .github/scripts/pr-risk/README.md.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to classify
        required: true
        type: number

concurrency:
  group: pr-risk-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: PR Risk
    # Same-repo, non-draft PRs only (the job runs on the in-cluster runner with secrets); a
    # manual run is checked in Resolve PR instead.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) }}
    # Its own variable, not RUNNER: Konflate is only reachable in-cluster. On a GitHub-hosted
    # runner the classifier still runs, raw-diff-only and flagged uncertain.
    runs-on: ${{ vars.PR_RISK_RUNNER || 'home-lab' }}
    timeout-minutes: 15
    permissions:
      actions: read # the PR's own runs of the workflows it changes (checks.json)
      contents: read
      pull-requests: write # labels + the sticky comment
    steps:
      # The Pulls API's object has the shape of a pull_request event payload, so pr_risk.py reads
      # it as one. Open, same-repo PRs only: the job runs on the in-cluster runner with secrets.
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |-
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            | jq '{pull_request: .}' > "$RUNNER_TEMP/event.json"
          state=$(jq -r '.pull_request.state' "$RUNNER_TEMP/event.json")
          head_repo=$(jq -r '.pull_request.head.repo.full_name' "$RUNNER_TEMP/event.json")
          if [ "$state" != open ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #${PR} is ${state} from ${head_repo}; only open same-repo PRs are classified"
            exit 1
          fi
          echo "base-ref=$(jq -r '.pull_request.base.ref' "$RUNNER_TEMP/event.json")" >> "$GITHUB_OUTPUT"

      # The base branch, never the PR: the classifier comes from main, so a PR can't rewrite its
      # own verdict. PR content is only read as git objects (diff, merge-tree), never executed.
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base-ref }}
          fetch-depth: 0 # merge-base, overlap and the PR head (a same-repo branch)
          persist-credentials: false

      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1 # zizmor: ignore[unpinned-tools]
        continue-on-error: true # no key: deterministic signals only, flagged uncertain
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TYPESAFE_API_KEY: op://GitHub/jev/API_KEY

      - name: Install uv
        uses: $/.github/actions/setup-mise # from the base branch, like everything else here
        with:
          tools: uv

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          BASE_REF: ${{ steps.pr.outputs.base-ref }}
          CHECKS_WAIT_SECONDS: ${{ vars.CHECKS_WAIT_SECONDS || '240' }}
          # Release lists are public; the token only lifts the rate limit for the notes fallback.
          GITHUB_TOKEN: ${{ github.token }}
          KONFLATE_URL: ${{ vars.KONFLATE_URL || 'http://konflate.flux-system.svc.cluster.local:8080' }}
          KONFLATE_WAIT_SECONDS: ${{ vars.KONFLATE_WAIT_SECONDS || '480' }}
          # Plaintext secrets are risky in a public repository; the PR payload normally says which.
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: >-
          uv run --no-project --python 3.13 .github/scripts/pr-risk/pr_risk.py collect
          --base "origin/${BASE_REF}" --event "$RUNNER_TEMP/event.json" --out "$RUNNER_TEMP/pr-risk"

      - name: Classify
        id: classify
        if: ${{ steps.collect.outcome == 'success' }}
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ steps.load-secrets.outputs.TYPESAFE_API_KEY }}
          JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-1.13.0' }}
          PR_RISK_MODE: ${{ vars.PR_RISK_MODE }}
        # Exit 3 means Jev or Konflate was down: the summary still shows what it saw, but the step
        # fails so Publish leaves the labels alone.
        run: |-
          rc=0
          uv run --no-project --python 3.13 .github/scripts/pr-risk/pr_risk.py classify --input "$RUNNER_TEMP/pr-risk" || rc=$?
          if [ -f "$RUNNER_TEMP/pr-risk/comment.md" ]; then
            {
              if [ "${PR_RISK_MODE:-shadow}" = shadow ]; then echo '> Shadow mode: nothing published to the PR.'; echo; fi
              cat "$RUNNER_TEMP/pr-risk/comment.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Publish
        if: ${{ steps.classify.outcome == 'success' && contains(fromJSON('["labels", "comment"]'), vars.PR_RISK_MODE) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_RISK_MODE: ${{ vars.PR_RISK_MODE }}
        run: uv run --no-project --python 3.13 .github/scripts/pr-risk/pr_risk.py publish --input "$RUNNER_TEMP/pr-risk"

      - name: Classification unavailable
        if: ${{ steps.classify.outcome != 'success' }}
        run: echo '### ⚪ PR risk unavailable — existing labels left as they are; see the step logs.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-risk-${{ github.event.pull_request.number || inputs.pr }}
          # The whole bundle (result.json is pr-risk/v2), so a run can be re-classified offline
          # after a policy change (`pr_risk.py classify --input <dir> --jev-fixture <dir>/result.json`).
          # Secret-shaped strings are redacted by collect: this repo is public, and so are its artifacts.
          path: ${{ runner.temp }}/pr-risk/
          if-no-files-found: ignore
          retention-days: 30

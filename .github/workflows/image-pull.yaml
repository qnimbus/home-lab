---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

# Pre-pulls the images a PR adds (vs its base branch) onto one node with talosctl. After merge,
# Spegel serves them to the other nodes over LAN, so the registry pull is paid once, here.

on:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/** # trigger filter; a filter job would bill a minute per run

concurrency:
  group: image-pull-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extract:
    name: Image Pull - Extract Images
    runs-on: home-lab
    timeout-minutes: 10
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # flate renders the base branch from history
          persist-credentials: false

      - name: Install flate
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: github:home-operations/flate
          minimum_release_age: "24h" # see validate.yaml
          cache: false # GitHub cache restores can stall off-GitHub (see pull); one small binary isn't worth it

      # flate renders the base branch and the PR and emits only the images the PR adds.
      - name: Extract Images
        id: extract
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |-
          images=$(flate diff images \
              --path kubernetes/clusters/main \
              --base "origin/${BASE_REF}" \
              --output json \
              --no-progress \
            | jq --compact-output '.')
          echo "images=${images}" >> "$GITHUB_OUTPUT"

          echo '## New images to pull' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$images" | jq >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  pull:
    if: ${{ needs.extract.outputs.images != '[]' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: home-lab
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 3 # half the home-lab runner's maxRunners, leaving slots for other jobs
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
    steps:
      # mise-action needs .mise/config.toml for the talos pin (and an activated shim).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A stalled cache restore can hang mise-action until the job timeout (2026-09-07, PR #115),
      # so it gets 2 minutes and falls through to the curl install below. Cache stays on (~9s vs ~20s).
      - name: Install talosctl
        id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1" # default 10; the step timeout is the real bound
        with:
          install_args: talos # not the `talosctl` alias, so the .mise/config.toml pin applies
          minimum_release_age: "24h" # see validate.yaml

      # Version parsed from .mise/config.toml; $GITHUB_PATH is prepended, so this beats a
      # half-initialised mise shim from the cancelled step.
      - name: Install talosctl (fallback)
        if: ${{ steps.mise.outcome != 'success' }}
        run: |-
          version="$(sed -n 's/^"\{0,1\}talos"\{0,1\}[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .mise/config.toml)"
          [ -n "$version" ] || { echo "could not parse talos version from .mise/config.toml"; exit 1; }
          echo "mise step did not complete (${{ steps.mise.outcome }}) — installing talosctl ${version} directly"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/talosctl" \
            "https://github.com/siderolabs/talos/releases/download/v${version}/talosctl-linux-amd64"
          chmod +x "$HOME/.local/bin/talosctl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pull Image
        run: talosctl --nodes "$NODE" image pull "${MATRIX_IMAGE}"

  success:
    if: ${{ !cancelled() }}
    needs: [extract, pull] # a failed extract skips pull, so check it directly
    name: Image Pull - Success
    runs-on: home-lab
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !contains(needs.*.result, 'failure') }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"

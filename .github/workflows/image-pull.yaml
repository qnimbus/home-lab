---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

# Pre-pulls the images a PR adds (main vs PR head) onto one node with talosctl. After merge,
# Spegel serves them to the other nodes over LAN, so the registry pull is paid once, here.

on:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/** # trigger filter; a filter job would bill a minute per run

concurrency:
  group: image-pull-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extract:
    name: Image Pull - Extract Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        branch:
          - default
          - pull
      fail-fast: false
    outputs:
      default: ${{ steps.extract.outputs.default }}
      pull: ${{ steps.extract.outputs.pull }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.branch == 'default' && github.event.repository.default_branch || '' }}

      - name: Gather Images
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0@sha256:c0be852e30f299ce6a220cc992b0c21a2a0b0684cc17713b9d718e18d9c8beff
        with:
          args: >-
            get cluster
            --all-namespaces
            --path /github/workspace/kubernetes/flux/cluster
            --enable-images
            --only-images
            --output json
            --output-file images.json

      - name: Extract Images
        id: extract
        run: |-
          echo "${{ matrix.branch }}=$(jq --compact-output '.' images.json)" >> "$GITHUB_OUTPUT"

          echo "## Branch ${{ matrix.branch }} images" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '.' images.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  diff:
    if: ${{ needs.extract.outputs.default != needs.extract.outputs.pull }}
    needs: extract
    name: Image Pull - Diff Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      # Via env, not inlined ${{ }}: image strings come from the PR and could inject shell.
      - name: Diff Images
        id: diff
        env:
          DEFAULT_IMAGES: ${{ needs.extract.outputs.default }}
          PULL_IMAGES: ${{ needs.extract.outputs.pull }}
        run: |-
          images=$(jq --compact-output --null-input \
              --argjson f1 "$DEFAULT_IMAGES" \
              --argjson f2 "$PULL_IMAGES" \
              '$f2 - $f1' \
          )
          echo "images=${images}" >> "$GITHUB_OUTPUT"

          echo '## New images to pull' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$images" | jq >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  pull:
    if: ${{ needs.diff.outputs.images != '[]' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: diff
    name: Image Pull - Pull Images
    runs-on: home-lab
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.diff.outputs.images) }}
      max-parallel: 3 # = home-lab runner maxRunners; extra legs idle on the job timeout
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
    steps:
      # mise-action needs .mise/config.toml for the talos pin (and an activated shim).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A stalled cache restore can hang mise-action until the job timeout (2026-09-07, PR #115),
      # so it gets 2 minutes and falls through to the curl install below. Cache stays on (~9s vs ~20s).
      - name: Install talosctl
        id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1" # default 10; the step timeout is the real bound
        with:
          install_args: talos # not the `talosctl` alias, so the .mise/config.toml pin applies
          minimum_release_age: "24h" # see validate.yaml

      # Version parsed from .mise/config.toml; $GITHUB_PATH is prepended, so this beats a
      # half-initialised mise shim from the cancelled step.
      - name: Install talosctl (fallback)
        if: ${{ steps.mise.outcome != 'success' }}
        run: |-
          version="$(sed -n 's/^"\{0,1\}talos"\{0,1\}[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .mise/config.toml)"
          [ -n "$version" ] || { echo "could not parse talos version from .mise/config.toml"; exit 1; }
          echo "mise step did not complete (${{ steps.mise.outcome }}) — installing talosctl ${version} directly"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/talosctl" \
            "https://github.com/siderolabs/talos/releases/download/v${version}/talosctl-linux-amd64"
          chmod +x "$HOME/.local/bin/talosctl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pull Image
        run: talosctl --nodes "$NODE" image pull "${MATRIX_IMAGE}"

  success:
    if: ${{ !cancelled() }}
    needs: pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !contains(needs.*.result, 'failure') }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"

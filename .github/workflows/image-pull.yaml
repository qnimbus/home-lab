---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

# Pre-warms new/changed container images onto a node before a PR merges, modelled on bykaj's
# image-pull.yaml. `extract` runs `flux-local get cluster --enable-images` against both `main`
# and the PR head, `diff` computes the set of images only the PR introduces, and `pull` runs
# `talosctl image pull` for each on a dedicated self-hosted runner. That warms exactly one node —
# Spegel (DaemonSet, all 5 nodes — kubernetes/apps/kube-system/spegel/) copies nothing. It is a
# peer-to-peer pull-through mirror: containerd on every node is pointed at its local Spegel
# (/etc/cri/conf.d/hosts/_default/hosts.toml), which resolves a digest by asking its peers. So
# Flux's reconcile after merge fetches the layer from the node that already holds it over LAN
# rather than from the upstream registry — the cold pull is paid once, here. Fail-open: a 200ms
# dial_timeout means containerd drops straight through to the registry if Spegel is unavailable.
#
# `pull` runs on `home-lab` — the same cluster-admin runner renovate-pr-review.yml uses — which
# also carries a Talos ServiceAccount cert (os:admin; see runners/home-lab/talos-serviceaccount.yaml)
# for talosctl. A dedicated zero-RBAC scale set for this job was tried and consolidated back into
# home-lab on 2026-09-06 in favor of a single-runner setup; see docs/CLUSTER.md.

on:
  pull_request:
    branches:
      - main
    paths:
      # trigger-level filter instead of a separate billed "filter" job (flux-render.yaml convention)
      - kubernetes/**

concurrency:
  group: image-pull-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extract:
    name: Image Pull - Extract Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        branch:
          - default
          - pull
      fail-fast: false
    outputs:
      default: ${{ steps.extract.outputs.default }}
      pull: ${{ steps.extract.outputs.pull }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.branch == 'default' && github.event.repository.default_branch || '' }}

      - name: Gather Images
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0@sha256:c0be852e30f299ce6a220cc992b0c21a2a0b0684cc17713b9d718e18d9c8beff
        with:
          args: >-
            get cluster
            --all-namespaces
            --path /github/workspace/kubernetes/flux/cluster
            --enable-images
            --only-images
            --output json
            --output-file images.json

      - name: Extract Images
        id: extract
        run: |-
          echo "${{ matrix.branch }}=$(jq --compact-output '.' images.json)" >> "$GITHUB_OUTPUT"

          echo "## Branch ${{ matrix.branch }} images" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '.' images.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  diff:
    if: ${{ needs.extract.outputs.default != needs.extract.outputs.pull }}
    needs: extract
    name: Image Pull - Diff Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - name: Diff Images
        id: diff
        run: |-
          images=$(jq --compact-output --null-input \
              --argjson f1 '${{ needs.extract.outputs.default }}' \
              --argjson f2 '${{ needs.extract.outputs.pull }}' \
              '$f2 - $f1' \
          )
          echo "images=${images}" >> "$GITHUB_OUTPUT"

          echo '## New images to pull' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$images" | jq >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  pull:
    if: ${{ needs.diff.outputs.images != '[]' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: diff
    name: Image Pull - Pull Images
    runs-on: home-lab
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.diff.outputs.images) }}
      # Must not exceed the home-lab scale set's maxRunners (3, see
      # runners/home-lab/helmrelease.yaml) — a 4th matrix leg would sit unassigned while still
      # burning this job's 15-minute clock, which is exactly where the mise cache stall bites.
      max-parallel: 3
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
    steps:
      # mise-action reads .mise.toml for the pinned version — without a checkout here it finds no
      # config, so it installs mise's own latest instead of .mise.toml's 1.13.0 pin, and (worse)
      # leaves the shim unactivated: "No version is set for shim: talosctl" on the next step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise-pinned, not a curl-latest install — matches .mise.toml's talosctl version.
      #
      # Bounded because a mise cache restore can hang this step indefinitely. Observed 2026-09-07
      # (run 34029723091 → PR #115): every matrix leg got a cache hit, but two of three then sat
      # at zero bytes for 101s before `Failed to restore: The operation cannot be completed in
      # timeout`. mise-action recovered fine — fresh-installed talosctl in 20s and exported PATH —
      # and then its node process simply never exited, leaving the step silent until the job's
      # 15-minute clock killed it. GitHub closed actions/setup-go#645 (same signature) saying an
      # aborted cache download that "appears to hang" is expected, so the bound has to live here.
      #
      # continue-on-error + a 2-minute budget converts that 15-minute hang into a ~2-minute detour
      # into the fallback below. The cache is left enabled: on the happy path it restores 61 MB in
      # ~3s and makes this step 9s instead of ~20s. cache_save stays on so the entry keeps getting
      # refreshed — parallel legs share one key, so all but the winner log a harmless
      # "Unable to reserve cache ... another job may be creating this cache" and move on.
      - name: Install talosctl
        id: mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        continue-on-error: true
        timeout-minutes: 2
        env:
          # Best-effort: abort a stalled segment after 1 min rather than the 10-min default. The
          # step timeout above is the actual guarantee — this only shortens the wasted window.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          install_args: talosctl

      # .mise.toml stays the single source of truth for the version — parsed here, never duplicated.
      # $GITHUB_PATH entries are prepended, so this wins over any half-initialised mise shim left
      # behind by a cancelled step ("No version is set for shim: talosctl").
      - name: Install talosctl (fallback)
        if: ${{ steps.mise.outcome != 'success' }}
        run: |-
          version="$(sed -n 's/^talosctl[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' .mise.toml)"
          [ -n "$version" ] || { echo "could not parse talosctl version from .mise.toml"; exit 1; }
          echo "mise step did not complete (${{ steps.mise.outcome }}) — installing talosctl ${version} directly"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/talosctl" \
            "https://github.com/siderolabs/talos/releases/download/v${version}/talosctl-linux-amd64"
          chmod +x "$HOME/.local/bin/talosctl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pull Image
        run: talosctl --nodes "$NODE" image pull "${MATRIX_IMAGE}"

  success:
    if: ${{ !cancelled() }}
    needs: pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !contains(needs.*.result, 'failure') }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"

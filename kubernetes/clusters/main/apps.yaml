---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  deletionPolicy: WaitForTermination
  interval: 1h
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          postBuild:
            substituteFrom:
              - kind: ConfigMap
                name: cluster-settings
                optional: true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux.home.arpa/disabled notin (true)
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          deletionPolicy: WaitForTermination
          retryInterval: 2m
          timeout: 15m
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  install:
                    strategy:
                      name: RetryOnFailure
                  timeout: 15m
                  upgrade:
                    cleanupOnFail: true
                    remediation:
                      remediateLastFailure: true
                      retries: 2
                    strategy:
                      name: RemediateOnFailure
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  install:
                    crds: CreateReplace
                  upgrade:
                    crds: CreateReplace
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                labelSelector: crds.flux.home.arpa/disabled notin (true)
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  install:
                    crds: Skip
                  upgrade:
                    crds: Skip
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                labelSelector: crds.flux.home.arpa/disabled=true
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  driftDetection:
                    mode: enabled
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                labelSelector: drift-detection.flux.home.arpa/disabled notin (true)
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - patch: |-
                - op: replace
                  path: /spec/bootstrap
                  value:
                    initdb:
                      database: ${POSTGRES_DATABASE:=${APP}}
                      owner: ${POSTGRES_USERNAME:=${APP}}
                - op: remove
                  path: /spec/externalClusters
              target:
                group: postgresql.cnpg.io
                kind: Cluster
                version: v1
      target:
        kind: Kustomization
        labelSelector: components.postgres/cnpg=init
  path: ./kubernetes/apps
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 15m

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: "${KOPIUR_CLAIM:-${APP}}"
spec:
  policyRef:
    name: "${KOPIUR_CLAIM:-${APP}}"
  schedule:
    # Daily; `H` hashes the schedule's identity into a stable minute so apps
    # don't all fire at once.
    cron: "${KOPIUR_SCHEDULE:=H 3 * * *}"

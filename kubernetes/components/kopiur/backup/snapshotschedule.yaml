---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: "${KOPIUR_CLAIM:-${APP}}"
spec:
  policyRef:
    name: "${KOPIUR_CLAIM:-${APP}}"
  schedule:
    # Hourly; `H` hashes the schedule's identity into a stable minute so apps don't all fire at once.
    cron: "${KOPIUR_SCHEDULE:=H * * * *}"

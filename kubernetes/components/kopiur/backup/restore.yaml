---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${KOPIUR_CLAIM:-${APP}}"
spec:
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsGroup: ${KOPIUR_MOVER_GID:=1000}
      runAsUser: ${KOPIUR_MOVER_UID:=1000}
  policy:
    # No backup yet (brand-new app): hand out an empty volume instead of blocking.
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: "${KOPIUR_CLAIM:-${APP}}"
      offset: 0 # latest snapshot
  # Passive volume populator: only runs when a PVC's dataSourceRef claims it.
  target:
    populator: {}

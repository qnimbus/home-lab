---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${KOPIUR_CLAIM:=${APP}}"
spec:
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsGroup: ${KOPIUR_MOVER_GID:=1000}
      runAsUser: ${KOPIUR_MOVER_UID:=1000}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: "${KOPIUR_CLAIM:=${APP}}"
      offset: 0
  target:
    populator: {}

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${KOPIUR_CLAIM:=${APP}}"
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - "${KOPIUR_ACCESSMODES:=ReadWriteOnce}"
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: "${KOPIUR_CLAIM:=${APP}}"
  resources:
    requests:
      storage: "${KOPIUR_CAPACITY:=5Gi}"
  storageClassName: "${KOPIUR_STORAGECLASS:=ceph-block}"

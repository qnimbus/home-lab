---
apiVersion: batch/v1
kind: Job
metadata:
  name: "${APP}-nfs-config-migrate"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: ${APP_UID:=1000}
        runAsGroup: ${APP_GID:=1000}
        fsGroup: ${APP_GID:=1000}
      containers:
        - name: migrate
          image: docker.io/library/busybox:1.37.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Copying /source -> /dest ..."
              cp -a /source/. /dest/
              echo "Copy complete. File counts (source vs dest):"
              find /source -type f | wc -l
              find /dest -type f | wc -l
              echo "Byte totals (source vs dest):"
              du -sb /source | cut -f1
              du -sb /dest | cut -f1
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: dest
              mountPath: /dest
      volumes:
        # The pre-existing ceph-block PVC (name == ${APP}, created by the volsync
        # component). Only safe to attach here because this app's HelmRelease is
        # scaled to 0 for the migration window (see helmrelease.yaml) - Ceph RBD's
        # RWO mode allows multi-attach on the same node, but the app pod and this
        # Job are never guaranteed to land on the same node, so the app must not
        # be holding the PVC open concurrently.
        - name: source
          persistentVolumeClaim:
            claimName: "${VOLSYNC_CLAIM:=${APP}}"
            readOnly: true
        - name: dest
          persistentVolumeClaim:
            claimName: "${APP}-nfs-config"

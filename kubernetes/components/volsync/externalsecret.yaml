---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-volsync"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: "${APP}-volsync-secret"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        # Per-app isolation is via repository sub-path, not a per-app password/item.
        RESTIC_REPOSITORY: "local:/mnt/repository/${APP}"
  dataFrom:
    - extract:
        key: volsync-restic

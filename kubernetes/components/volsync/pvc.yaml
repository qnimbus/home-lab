---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${VOLSYNC_CLAIM:=${APP}}"
  labels:
    # dataSourceRef is immutable on an existing PVC — if an app already has a live PVC of
    # this name (e.g. a pre-VolSync retrofit), applying this manifest would fail outright.
    # IfNotPresent makes Flux skip it entirely when the object already exists, instead of
    # erroring; it only creates fresh (bootstrap-restore-enabled) PVCs for genuinely new apps.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - "${VOLSYNC_ACCESSMODES:=ReadWriteOnce}"
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: "${APP}-bootstrap"
  resources:
    requests:
      storage: "${VOLSYNC_CAPACITY:=5Gi}"
  storageClassName: "${VOLSYNC_STORAGECLASS:=ceph-block}"

---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: "${APP}-bootstrap"
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  trigger:
    manual: restore-once
  restic:
    repository: "${APP}-volsync-secret"
    copyMethod: Snapshot
    capacity: "${VOLSYNC_CAPACITY:=5Gi}"
    accessModes:
      - "${VOLSYNC_ACCESSMODES:=ReadWriteOnce}"
    storageClassName: "${VOLSYNC_STORAGECLASS:=ceph-block}"
    volumeSnapshotClassName: "${VOLSYNC_SNAPSHOTCLASS:=ceph-block-snapshot}"
    cacheAccessModes:
      - "${VOLSYNC_CACHE_ACCESSMODES:=ReadWriteOnce}"
    cacheCapacity: "${VOLSYNC_CACHE_CAPACITY:=${VOLSYNC_CAPACITY:=5Gi}}"
    cacheStorageClassName: "${VOLSYNC_CACHE_STORAGECLASS:=openebs-hostpath}"
    cleanupCachePVC: true
    cleanupTempPVC: true
    enableFileDeletion: true
    moverSecurityContext:
      runAsUser: ${APP_UID:=4000}
      runAsGroup: ${APP_GID:=4000}
      fsGroup: ${APP_GID:=4000}
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            server: "${VOLSYNC_NFS_SERVER:=10.200.0.41}"
            path: "${VOLSYNC_NFS_PATH:=/mnt/tank/Cluster/volsync}"
    sourceIdentity:
      sourceName: "${APP}"

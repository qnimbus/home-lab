---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}-postgres-scaler
spec:
  scaleTargetRef:
    name: ${APP}
  minReplicaCount: 0
  maxReplicaCount: 1
  advanced:
    restoreToOriginalReplicaCount: true
  # 30s deliberately: this repo's shared CNPG cluster (postgres-v17,
  # primaryUpdateStrategy: unsupervised) already performs brief, self-healing primary
  # switchovers today that these apps ride out via a few failed queries + reconnect.
  # A 30s cooldown adds one extra confirmation window beyond the blackbox probe's own
  # 30s scrape interval (observability/blackbox-exporter/app/probes.yaml) before
  # committing to scale-down, so a single transient failed scrape during a routine
  # switchover doesn't immediately cold-restart the app — while still reacting within
  # ~60-90s of a genuine, sustained outage.
  cooldownPeriod: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        query: probe_success{instance="${PG_HOST}:5432"}
        threshold: "1"
        ignoreNullValues: "0"

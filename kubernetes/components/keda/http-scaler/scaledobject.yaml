---
# yaml-language-server: $schema=https://schemas.clustrs.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  scaleTargetRef:
    name: ${APP}
  minReplicaCount: 0
  maxReplicaCount: 1
  # Idle window before scaling to 0 once request activity stops. Consumers of this
  # component are human-triggered, on-demand tools, not services other workloads
  # depend on staying warm, so a generous window avoids reloading on every short
  # pause. Tune in the component if the assumption stops holding for a consumer.
  cooldownPeriod: 1800
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: ${APP}

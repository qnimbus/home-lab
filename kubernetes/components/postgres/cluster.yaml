---
# yaml-language-server: $schema=https://schemas.clustrs.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  bootstrap:
    recovery:
      database: ${POSTGRES_DATABASE:=${APP}}
      owner: ${POSTGRES_USERNAME:=${APP}}
      source: &archive ${APP}-backup-archive
  enablePDB: ${POSTGRES_ENABLE_PDB:=false}
  enableSuperuserAccess: true
  externalClusters:
    - name: *archive
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ${APP}-postgres-backup
          serverName: ${APP}
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  instances: ${POSTGRES_INSTANCES:=1}
  maxSyncReplicas: ${POSTGRES_SYNC_REPLICAS:=0}
  minSyncReplicas: ${POSTGRES_SYNC_REPLICAS:=0}
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${APP}-postgres-backup
        serverName: ${APP}
  postgresql:
    parameters:
      archive_timeout: 5min
      max_connections: "100"
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      memory: 256Mi
  storage:
    size: ${POSTGRES_STORAGE:=5Gi}
    storageClass: openebs-hostpath

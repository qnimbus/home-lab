---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ${APP}-postgres-backup
spec:
  configuration:
    destinationPath: "s3://vwn-io-cluster-cnpg/dedicated/${APP}"
    endpointURL: "https://s3.us-west-001.backblazeb2.com"
    data:
      compression: bzip2
      encryption: AES256
    wal:
      compression: bzip2
      maxParallel: 8
      encryption: AES256
    s3Credentials:
      accessKeyId:
        name: &secret ${APP}-postgres
        key: S3_ACCESS_KEY
      secretAccessKey:
        name: *secret
        key: S3_SECRET_KEY
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  retentionPolicy: 14d

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./backup-local
  - ./cluster.yaml
  - ./externalsecret.yaml
  - ./objectstore.yaml
  - ./scheduledbackup.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: cloudnative-pg
          namespace: database
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      version: v2

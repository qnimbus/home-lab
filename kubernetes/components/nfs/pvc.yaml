---
# yaml-language-server: $schema=https://schemas.clustrs.dev/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "nfs-${APP}"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "${NFS_CAPACITY:=5Gi}"
  storageClassName: nfs

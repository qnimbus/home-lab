---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
  ref:
    # Pinned below latest to test whether 0.7.0's barman-cloud/boto3 bump is
    # what's causing "IncompleteBody: request body was too small" against
    # Backblaze B2 - bykaj/home-ops runs 0.6.0 against the same B2 region
    # without this error. Revert this comment + bump back once confirmed.
    # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
    tag: "0.6.0"
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: https://token.actions.githubusercontent.com
        subject: ^https://github.com/cloudnative-pg/charts

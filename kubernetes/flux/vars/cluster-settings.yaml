---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: "Enabled"
data:
  CLUSTER_NAME: "home-lab"
  CLUSTER_TIMEZONE: "Europe/Amsterdam"
  # VolSync defaults — single source of truth for every consumer of components/volsync.
  # Variable names must match the ${VAR:=default} tokens in that Component's templates
  # exactly, or Flux's substitution simply won't override the inline fallback.
  VOLSYNC_NFS_SERVER: "10.200.0.41"
  VOLSYNC_NFS_PATH: "/mnt/tank/Cluster/volsync"
  VOLSYNC_STORAGECLASS: "ceph-block"
  VOLSYNC_SNAPSHOTCLASS: "ceph-block-snapshot"
  VOLSYNC_CACHE_STORAGECLASS: "openebs-hostpath"

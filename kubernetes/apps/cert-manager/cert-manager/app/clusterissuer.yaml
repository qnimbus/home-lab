---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt-production
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: API_TOKEN
              name: cert-manager-secret
        selector:
          dnsZones:
            - vwn.app
            - vwn.casa
            - cluster.vwn.io
            - apps.vwn.io
            - vwn.io
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt-staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: API_TOKEN
              name: cert-manager-secret
        selector:
          dnsZones:
            - vwn.app
            - vwn.casa
            - cluster.vwn.io
            - apps.vwn.io
            - vwn.io

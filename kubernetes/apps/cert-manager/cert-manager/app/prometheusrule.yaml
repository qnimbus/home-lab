---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-rules
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerAbsent
          expr: |-
            absent(up{job="cert-manager"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Cert Manager has disappeared from Prometheus service discovery

    - name: certificates
      rules:
        - alert: CertManagerCertExpirySoon
          expr: |-
            avg by (exported_namespace, namespace, name) (time() - certmanager_certificate_renewal_timestamp_seconds) > (7 * 24 * 3600)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              The cert {{ $labels.name }} should have renewed {{ $value | humanizeDuration }} ago

        - alert: CertManagerCertNotReady
          expr: |-
            max by (name, exported_namespace, namespace, condition) (certmanager_certificate_ready_status{condition!="True"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              The cert {{ $labels.name }} is not ready to serve traffic

        - alert: CertManagerHittingRateLimits
          expr: |-
            sum by (host) (rate(certmanager_http_acme_client_request_count{status="429"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Cert manager hitting LetsEncrypt rate limits

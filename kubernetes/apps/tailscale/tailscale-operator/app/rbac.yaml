---
# cluster-admin is intentional: this grants kubectl access via the Tailscale API-server
# proxy, gated by tailnet membership/ACLs rather than a distributed kubeconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-user-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "${TAILSCALE_USER}"

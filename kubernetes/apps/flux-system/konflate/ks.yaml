---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app konflate
  namespace: flux-system
spec:
  targetNamespace: flux-system
  dependsOn:
    # The ExternalSecret in this path needs the ESO webhook serving before dry-run
    # validation passes (same reason as flux-instance).
    - name: external-secrets
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/flux-system/konflate/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

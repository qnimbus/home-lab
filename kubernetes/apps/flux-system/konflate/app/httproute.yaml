---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
# GitHub's webhook deliveries (POST /hooks), same shape as flux-receiver's flux-webhook
# route. Kept on its own host so the Cloudflare Access gate on the UI host below never
# sits in front of GitHub.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate-webhook
spec:
  hostnames: ["${APP}-webhook.${DOMAIN_IO}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: konflate
          port: 8080
      matches:
        - path:
            type: Exact
            value: /hooks
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
# The UI from outside the LAN/Tailscale, and the host publicUrl links to from PR comments.
# konflate has no auth of its own and this repo is private: this host is only safe behind
# the Cloudflare Access application for it (Zero Trust dashboard, not in Git). On the LAN,
# UniFi DNS resolves it straight to envoy-external, bypassing Access, like the internal
# route in helmrelease.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate-public
spec:
  hostnames: ["${APP}.${DOMAIN_APP}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: konflate
          port: 8080

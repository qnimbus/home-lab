---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      mcp: true
      prComments: true
      prFilterExpr: "pr.labels.exists(l, l.name == 'area/kubernetes') && !pr.draft"
      publicUrl: "https://${APP}.${DOMAIN_APP}"
      repo: github://qnimbus/home-lab
      statusChecks: true
      verifyImages: true
    httpRoute:
      enabled: true
      hostnames:
        - "${APP}.${DOMAIN_CLUSTER}"
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
    secret:
      existingSecret: konflate-secret

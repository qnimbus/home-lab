---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/secretstore_v1.json
# Read-only access to the CI-side `GitHub` 1Password vault, scoped to flux-system: the
# cluster-wide `onepassword` store only reads `homelab`, and CI credentials stay out of every
# other namespace. Auth is a 1Password service account with read access to the GitHub vault
# only; its token is bootstrapped from the homelab vault by the ExternalSecret below.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-github
spec:
  provider:
    onepasswordSDK:
      auth:
        serviceAccountSecretRef:
          name: onepassword-github-sa
          key: token
      vault: GitHub
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-github-sa
spec:
  data:
    - secretKey: token
      remoteRef:
        key: onepassword-github-cluster-sa
        property: OP_SERVICE_ACCOUNT_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: onepassword-github-sa

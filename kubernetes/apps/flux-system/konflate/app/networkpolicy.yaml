---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
# flux-operator's flux-system policies only admit cross-namespace ingress on port 8080
# (allow-scraping); konflate serves metrics on 8081, so Prometheus needs its own rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: konflate-allow-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: konflate
      app.kubernetes.io/name: konflate
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: metrics
          protocol: TCP

---
instance:
  distribution:
    # renovate: depName=ghcr.io/fluxcd/flux-operator datasource=docker
    version: "2.6.4"
  cluster:
    networkPolicy: false
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  sync:
    kind: GitRepository
    interval: 5m0s
    url: "ssh://git@github.com/qnimbus/home-lab"
    ref: refs/heads/main
    path: ./kubernetes/flux/cluster
    pullSecret: flux-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: flux
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=10
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: all
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      limits:
                        memory: 1Gi
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=20
          - op: replace
            path: /spec/template/spec/volumes/0
            value:
              name: temp
              emptyDir:
                medium: Memory
        target:
          kind: Deployment
          name: kustomize-controller
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-max-size=10
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-ttl=60m
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-purge-interval=5m
        target:
          kind: Deployment
          name: source-controller
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=OOMWatch=true
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-memory-threshold=95
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-interval=500ms
        target:
          kind: Deployment
          name: helm-controller
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=DisableChartDigestTracking=true
        target:
          kind: Deployment
          name: helm-controller
      # Inject shared pod label so all four controllers form one group for topology spread.
      # commonMetadata.labels does NOT propagate to pod templates (verified) — patch required.
      - patch: |
          - op: add
            path: /spec/template/metadata/labels/app.kubernetes.io~1part-of
            value: flux
        target:
          kind: Deployment
      # Scale to 2 replicas: pre-places one pod per two nodes so a single node failure
      # triggers leader-election failover (~35 s lease duration) instead of pod rescheduling
      # (~5-6 min). flux-operator excluded — it manages the FluxInstance CR, not reconciliation.
      - patch: |
          - op: replace
            path: /spec/replicas
            value: 2
        target:
          kind: Deployment
          name: (helm-controller|kustomize-controller|source-controller|notification-controller)
      # Spread all 8 Flux controller pods (4 controllers x 2 replicas) across 3 nodes.
      # ScheduleAnyway (soft) used because 8 pods on 3 nodes cannot achieve perfect 1-per-node
      # (target is 3/3/2); hard DoNotSchedule would block placement during rolling upgrades
      # when transient pod count temporarily increases.
      - patch: |
          - op: add
            path: /spec/template/spec/topologySpreadConstraints
            value:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: flux
        target:
          kind: Deployment
          name: (helm-controller|kustomize-controller|source-controller|notification-controller)

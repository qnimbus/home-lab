---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    # The controller runs short kopia ops (catalog scans, maintenance) in-process,
    # so it needs the filesystem repository mounted at the same path the
    # ClusterRepository declares.
    extraVolumeMounts:
      - mountPath: /repository
        name: repository
    extraVolumes:
      - name: repository
        nfs:
          path: /mnt/tank/Cluster/kopiur
          server: "${NAS_HOST}"
    features:
      # Lets the operator copy the repository password Secret from `system`
      # into each app namespace a mover runs in, so no per-namespace
      # ExternalSecret is needed.
      credentialProjection:
        enabled: true
    monitoring:
      # Includes a stale-backup alert (no successful snapshot in 48h).
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    # TrueNAS `kubernetes` user (3001:3001): owner of the NAS repository
    # directory and the kopiur share's Mapall user.
    podSecurityContext:
      fsGroup: 3001
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 3001
      runAsNonRoot: true
      runAsUser: 3001
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi

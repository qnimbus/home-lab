---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          path: /mnt/tank/Cluster/kopiur
          server: "${NAS_HOST}"
  catalog:
    fallbackNamespace: system
    retain:
      perIdentity: 30
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-repository-secret
      namespace: system
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    schedule:
      full:
        cron: 0 3 * * *
        jitter: 1h
      quick:
        cron: 0 * * * *
        jitter: 10m
  moverDefaults:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    ttlSecondsAfterFinished: 300
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Europe/Amsterdam
  server:
    auth:
      secretRef:
        name: nas-kopia-ui-secret
        passwordKey: password
        usernameKey: username
    namespace: system
    # Writable so snapshots and policies can be deleted from the UI (e.g. an old
    # claim's after a rename); kopiur only retains them.
    readOnly: false

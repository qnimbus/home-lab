---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          path: /mnt/tank/Cluster/kopiur
          server: "${NAS_HOST}"
  catalog:
    fallbackNamespace: system
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-repository-secret
      namespace: system
  # Same as kopiur's defaults (policyName@namespace), pinned explicitly: identity
  # can't be changed once snapshots exist without forking the backup history.
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  moverDefaults:
    # Movers run as each app's own UID/GID (KOPIUR_MOVER_UID/GID, default 1000)
    # so they can read the app's files and restore them with the right owner.
    # No NAS-side UID/group is needed: the kopiur NFS share maps every client to
    # the TrueNAS `kubernetes` user (Mapall 3001:3001), so kopia's owner-only
    # (0600) repository files stay readable across movers with different UIDs.
    # Requests only (no limit): mover memory scales with app data size, and a
    # limit would fail large backups mid-run.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    ttlSecondsAfterFinished: 300
  scheduleDefaults:
    timezone: Europe/Amsterdam
  # Kopia web UI, served as Service nas-kopia-ui:51515 (see httproute.yaml).
  # Read-only: browse and restore files, but it can't delete or change backups.
  # Login is generated by kopiur: username `kopia`, password in the Secret
  # system/nas-kopia-ui-auth.
  server:
    auth:
      generate: {}
    namespace: system
    readOnly: true

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
    creationPolicy: Owner
  # Named fields, not `extract`: credentialProjection copies this Secret into every
  # namespace that backs up, so it must hold the repository password and nothing
  # else from the item (not the UI login below).
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur
        property: PASSWORD
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-kopia-ui
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nas-kopia-ui-secret
  data:
    - secretKey: password
      remoteRef:
        key: kopiur
        property: UI_PASSWORD
    - secretKey: username
      remoteRef:
        key: kopiur
        property: UI_USERNAME

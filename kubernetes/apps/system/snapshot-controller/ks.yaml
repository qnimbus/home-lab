---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app snapshot-controller
  namespace: flux-system
spec:
  targetNamespace: snapshot-controller
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # rook-ceph-cluster depends on this Kustomization being Ready (CRDs + pod
  # healthy) before its own VolumeSnapshotClass can be created.
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system/snapshot-controller/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: snapshot-controller

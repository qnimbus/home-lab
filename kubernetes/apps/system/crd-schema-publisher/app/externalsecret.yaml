---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crd-schema-publisher
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: crd-schema-publisher-secret
    creationPolicy: Owner
    template:
      data:
        CLOUDFLARE_ACCOUNT_ID: "{{ .CF_ACCOUNT_TAG }}"
        CLOUDFLARE_API_TOKEN: "{{ .CF_PAGES_API_TOKEN }}"
  dataFrom:
    - extract:
        key: cloudflare-tunnel
      rewrite:
        - regexp:
            source: (.*)
            target: CF_$1

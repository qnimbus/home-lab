---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crd-schema-publisher
spec:
  chartRef:
    kind: OCIRepository
    name: crd-schema-publisher
  interval: 1h
  values:
    annotations:
      reloader.stakater.com/auto: "true"
    config:
      cfPagesProject: schemas
      includeBuiltins: true
    existingSecret:
      name: crd-schema-publisher-secret
    fullnameOverride: crd-schema-publisher
    grafana:
      dashboard:
        operator:
          enabled: true
          datasources:
            - datasourceName: Prometheus
              inputName: DS_PROMETHEUS
    metrics:
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true

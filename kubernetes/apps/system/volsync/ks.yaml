---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app volsync
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: volsync
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Every consumer app embeds raw ReplicationSource/ReplicationDestination manifests via the
  # components/volsync Component — their dry-run fails if these CRDs don't exist yet.
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system/volsync/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: openebs
      namespace: flux-system
    - name: snapshot-controller
      namespace: system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: volsync

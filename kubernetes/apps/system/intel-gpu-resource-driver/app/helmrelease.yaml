---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  interval: 1h
  values:
    cdi:
      dynamicPath: /var/cdi/dynamic
      staticPath: /var/cdi/static
    kubeletPlugin:
      healthMonitoring:
        enabled: false
      manageBinding:
        enabled: false
      privileged: true

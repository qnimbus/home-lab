---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# csi-driver-nfs, csi-driver-smb, and openebs deploy into `system` (spec.targetNamespace comes
# from the replacements). The other apps keep their own namespace: they carry the
# replacements.flux.home.arpa/disabled label, which leaves their explicit spec.targetNamespace alone.
namespace: system
components:
  - ../../components/namespace
replacements:
  - path: ../../components/replacements/replacements.yaml
resources:
  - ./csi-driver-nfs/ks.yaml
  - ./csi-driver-smb/ks.yaml
  - ./keda/ks.yaml
  - ./openebs/ks.yaml
  - ./reloader/ks.yaml
  - ./snapshot-controller/ks.yaml

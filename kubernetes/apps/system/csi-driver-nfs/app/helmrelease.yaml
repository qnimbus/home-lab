---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  chartRef:
    kind: OCIRepository
    name: csi-driver-nfs
  install:
    disableTakeOwnership: true
  interval: 1h
  values:
    storageClass:
      create: true
      mountOptions:
        - nfsvers=4.2
        - nconnect=16
        - hard
        - noatime
      name: nfs
      parameters:
        server: "${NAS_HOST}"
        share: /mnt/tank/Cluster/k8s-nfs-csi
      reclaimPolicy: Delete
      volumeBindingMode: Immediate

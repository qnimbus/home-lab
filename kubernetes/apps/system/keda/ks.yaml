---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app keda
  namespace: flux-system
spec:
  targetNamespace: keda
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system/keda/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: keda
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app2 keda-add-ons-http
  namespace: flux-system
spec:
  targetNamespace: keda
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app2
  # The add-on's InterceptorRoute CRD is a dry-run dependency for any app that
  # wires an app into it (e.g. pgadmin) — keep this Kustomization ahead of consumers.
  dependsOn:
    - name: keda
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system/keda/app-http-add-on
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app2
      namespace: keda

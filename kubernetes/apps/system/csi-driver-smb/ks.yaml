---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app csi-driver-smb
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  # ExternalSecret here creates a Secret asynchronously (ESO); wait: true + placing
  # it in this earlier Kustomization guarantees it's Ready before any future
  # consumer's static PV (which references smb-credentials via nodeStageSecretRef)
  # reconciles — see CLAUDE.md "Bootstrap ordering".
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system/csi-driver-smb/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: system

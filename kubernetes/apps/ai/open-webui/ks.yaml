---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &db-app open-webui-db
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *db-app
  interval: 1h
  path: ./kubernetes/apps/ai/open-webui/db
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword-store
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app open-webui
  namespace: flux-system
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  interval: 1h
  path: ./kubernetes/apps/ai/open-webui/app
  postBuild:
    substitute:
      APP: *app
      # The published open-webui image is not arbitrary-UID friendly (writes to
      # open_webui/static on every startup as whatever UID it was built with, which for
      # the published ghcr.io tags is root) - see containers.app.securityContext in
      # helmrelease.yaml. VolSync's mover must run as the same UID that owns files on the
      # config PVC (root), not the component's default of 4000, or restic backup/restore
      # hits permission errors.
      APP_UID: "0"
      APP_GID: "0"
      VOLSYNC_CLAIM: open-webui-config
      VOLSYNC_CAPACITY: 5Gi
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: open-webui-db
    - name: onepassword-store
    - name: rook-ceph-cluster
    - name: dragonfly
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync

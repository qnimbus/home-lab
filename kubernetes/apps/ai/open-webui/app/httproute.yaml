---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Open WebUI"
    gethomepage.dev/description: "Self-hosted AI chat interface"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-chat-processing"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "chat.${DOMAIN_CLUSTER}"
  rules:
    - backendRefs:
        - name: open-webui
          port: 8080

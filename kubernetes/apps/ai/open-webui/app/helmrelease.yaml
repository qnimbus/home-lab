---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  # scaledobject.yaml scales this Deployment's replicas directly; without this, Flux's
  # drift detection reverts it back to the chart's desired replica count on the next
  # reconcile/drift check, undoing scale-to-zero within the hour (same reasoning as
  # paperless-ngx's helmrelease.yaml).
  driftDetection:
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
            env:
              WEBUI_URL: "https://chat.${DOMAIN_CLUSTER}"
              # Pre-provisioned admin only (see job-bootstrap-admin.yaml) - signup is never
              # opened, not even briefly, to create the first account.
              ENABLE_SIGNUP: false
              ENABLE_LOGIN_FORM: true
              ENABLE_WEBSOCKET_SUPPORT: true
              WEBSOCKET_MANAGER: redis
              # Upstream inconsistency (confirmed live via open_webui/socket/utils.py and
              # env.py): the lock's own default TTL (60s) is shorter than
              # SESSION_POOL_TIMEOUT, the hardcoded 120s sleep interval between renewal
              # attempts - so the lock always expires before the next renewal check runs,
              # flooding logs with harmless "Unable to renew session cleanup lock"
              # warnings every cycle. Set longer than 120s so a renewal always lands
              # inside the lock's TTL.
              WEBSOCKET_REDIS_LOCK_TIMEOUT: "150"
            envFrom:
              - secretRef:
                  name: open-webui-secret
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    # The published image is not arbitrary-UID friendly - it writes to open_webui/static on
    # every startup as whatever UID it was built with (root, for the published ghcr.io tags),
    # and running as a different UID hits permission-denied errors on boot. Well-documented
    # upstream (open-webui/open-webui discussions #1698, #4131, #16594; issue #26662) with no
    # fix landed as of v0.11.0 - unlike paperless-ngx's root requirement (apt-get + chown at
    # runtime), this one can't be dropped via USERMAP_UID/GID or similar.
    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM:=open-webui-config}"
        globalMounts:
          - path: /app/backend/data
    route:
      app:
        hostnames:
          - "chat.${DOMAIN_CLUSTER}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

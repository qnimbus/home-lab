---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}-scaler
spec:
  scaleTargetRef:
    name: ${APP}
  minReplicaCount: 0
  maxReplicaCount: 1
  advanced:
    restoreToOriginalReplicaCount: true
  # 30s, same rationale as components/keda/postgres-scaler and paperless-ngx's own
  # scaledobject.yaml: one extra confirmation window beyond each blackbox probe's own
  # 30s scrape interval before committing to scale-down, so a single transient failed
  # scrape doesn't cold-restart the app.
  cooldownPeriod: 30
  # A single combined trigger, not one Component per dependency: KEDA only allows one
  # ScaledObject per workload (confirmed live via the vscaledobject.kb.io admission
  # webhook - see paperless-ngx/app/ks.yaml), so open-webui's two dependencies - CNPG
  # Postgres (DATABASE_URL) and the shared Dragonfly cache (WEBSOCKET_REDIS_URL) - must
  # be folded into one query. min() over both probe_success series means ANY one being
  # unreachable (0) drags the aggregate to 0, giving the same "any dependency down ->
  # scale to zero" semantics a per-dependency trigger would, which a multi-trigger
  # ScaledObject can't provide under its default semantics: KEDA scales down only when
  # ALL triggers are inactive, the opposite of what's needed here.
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        query: min(probe_success{instance=~"${PG_HOST}:5432|${DRAGONFLY_HOST}:6379"})
        threshold: "1"
        ignoreNullValues: "0"

# --- FUTURE: combined idle-traffic + dependency-health scaling ---------------------
#
# Not deployed. Considered and researched alongside the dependency-only scaler above
# (2026-08 session) as a way to *also* get idle-cost savings (scale to 0 when nobody's
# chatting, like components/keda/http-scaler does for other on-demand tools) without
# losing the crash-loop protection the trigger above provides.
#
# Why this can't just be "add a second trigger" to the ScaledObject above: a Prometheus
# trigger's default activation threshold is 0, so `min(probe_success{...})` reads as
# "active" any time it evaluates to 1 - which is essentially always, since dependencies
# are healthy the overwhelming majority of the time. Under KEDA's default multi-trigger
# rule (scale to zero only once ALL triggers report inactive - confirmed fixed for
# external-push triggers specifically in kedacore/keda#7116, shipped well before this
# cluster's pinned chart v2.20.1), the health trigger would almost never go inactive,
# so the object would almost never scale down for idle traffic either. You'd get all
# the YAML of a combined scaler with none of the idle-cost benefit - functionally
# identical to the simpler dependency-only trigger above.
#
# advanced.scalingModifiers.formula is the actual mechanism for this: it fully replaces
# KEDA's default OR-activate/AND-deactivate logic with a custom expression over named
# triggers, so "scale up needs BOTH recent HTTP activity AND healthy dependencies" (an
# AND relationship the default multi-trigger semantics can't express) becomes possible.
#
# Caveat before ever enabling this: KEDA's docs don't document any restriction against
# mixing an `external-push` trigger (used by the HTTP add-on) with a `prometheus`
# trigger inside one formula, but no worked real-world example of that specific
# combination was found either - this corner of KEDA is young enough that the
# coordination bug referenced above was only fixed in late 2025. Prototype and verify
# behavior (especially the scale-from-zero path) against a disposable ScaledObject
# before trusting this on the real deployment.
#
# ---

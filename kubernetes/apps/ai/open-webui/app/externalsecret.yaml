---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: open-webui-secret
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .OPENWEBUI_SECRET_KEY }}"
        # Password piped through `urlquery` (a Sprig function, available in ESO's v2
        # template engine) - confirmed live that a raw, un-encoded password containing "#"
        # crashes the app outright: "#" is the URI fragment delimiter, so open-webui's
        # ASYNC redis client (redis.asyncio, used by its websocket module, imported eagerly
        # at process startup rather than lazily) truncates the URL right after it and
        # misparses what's left as the port, throwing "Port could not be cast to integer" on
        # every boot - CrashLoopBackOff, not a lazy runtime failure. The sync redis-py client
        # tolerates this fine (tested directly against the same URL), which is why this went
        # unnoticed initially. Postgres's DATABASE_URL carries the identical risk even though
        # psycopg2 hasn't been observed to fail on it yet - encoded here too, pre-emptively.
        DATABASE_URL: "postgresql://{{ .OPENWEBUI_DB_USER }}:{{ .OPENWEBUI_DB_PASSWORD | urlquery }}@${PG_HOST}:5432/open_webui"
        # Dragonfly is a cluster-wide shared instance (kubernetes/apps/database/dragonfly);
        # paperless-ngx is already its consumer on db index 0, so open-webui takes the next
        # unused index (1) to avoid key collisions.
        WEBSOCKET_REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD | urlquery }}@dragonfly.database.svc.cluster.local:6379/1"
        # Consumed only by job-bootstrap-admin.yaml's one-shot signup call, not by the app
        # container itself.
        BOOTSTRAP_ADMIN_NAME: "{{ .OPENWEBUI_ADMIN_NAME }}"
        BOOTSTRAP_ADMIN_EMAIL: "{{ .OPENWEBUI_ADMIN_EMAIL }}"
        BOOTSTRAP_ADMIN_PASSWORD: "{{ .OPENWEBUI_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: open-webui
      rewrite:
        - regexp:
            source: (.*)
            target: OPENWEBUI_$1
    - extract:
        key: dragonfly
      rewrite:
        - regexp:
            source: (.*)
            target: DRAGONFLY_$1

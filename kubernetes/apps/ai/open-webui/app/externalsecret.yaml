---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: open-webui-secret
    template:
      engineVersion: v2
      data:
        WEBUI_SECRET_KEY: "{{ .OPENWEBUI_SECRET_KEY }}"
        DATABASE_URL: "postgresql://{{ .OPENWEBUI_DB_USER }}:{{ .OPENWEBUI_DB_PASSWORD }}@${PG_HOST}:5432/open_webui"
        # Dragonfly is a cluster-wide shared instance (kubernetes/apps/database/dragonfly);
        # paperless-ngx is already its consumer on db index 0, so open-webui takes the next
        # unused index (1) to avoid key collisions.
        WEBSOCKET_REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/1"
        # Consumed only by job-bootstrap-admin.yaml's one-shot signup call, not by the app
        # container itself.
        BOOTSTRAP_ADMIN_NAME: "{{ .OPENWEBUI_ADMIN_NAME }}"
        BOOTSTRAP_ADMIN_EMAIL: "{{ .OPENWEBUI_ADMIN_EMAIL }}"
        BOOTSTRAP_ADMIN_PASSWORD: "{{ .OPENWEBUI_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: open-webui
      rewrite:
        - regexp:
            source: (.*)
            target: OPENWEBUI_$1
    - extract:
        key: dragonfly
      rewrite:
        - regexp:
            source: (.*)
            target: DRAGONFLY_$1

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bifrost
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Bifrost"
    gethomepage.dev/description: "LLM gateway / unified provider API"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: https://raw.githubusercontent.com/maximhq/bifrost/refs/heads/dev/.github/assets/bifrost-logo.png
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "bifrost.${DOMAIN_CLUSTER}"
  rules:
    - backendRefs:
        - name: bifrost
          port: 80

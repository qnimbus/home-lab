---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bifrost-secret
    template:
      engineVersion: v2
      data:
        BIFROST_SETUP_TOKEN: "{{ .BIFROST_SETUP_TOKEN }}"
        BIFROST_ENCRYPTION_KEY: "{{ .BIFROST_ENCRYPTION_KEY }}"
        # `providers` and `source_of_truth` are deliberately omitted: Bifrost's docs state
        # `source_of_truth: "config.json"` makes any file-present section overwrite DB/UI state
        # on every restart. Leaving both unset defaults to "split" mode, so provider config added
        # later through Bifrost's own web UI (persisted to config_store below) survives restarts.
        # `encryption_key` is the literal string "env.BIFROST_ENCRYPTION_KEY" - Bifrost resolves
        # that prefix itself from the container's environment; the real value never touches this
        # JSON blob.
        config.json: |
          {
            "$schema": "https://www.getbifrost.ai/schema",
            "encryption_key": "env.BIFROST_ENCRYPTION_KEY",
            "setup_token": "env.BIFROST_SETUP_TOKEN",
            "config_store": {
              "enabled": true,
              "type": "sqlite",
              "config": {
                "path": "/app/data/config.db"
              }
            }
          }
  dataFrom:
    - extract:
        key: bifrost
      rewrite:
        - regexp:
            source: (.*)
            target: BIFROST_$1

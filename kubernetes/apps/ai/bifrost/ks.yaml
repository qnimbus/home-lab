---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bifrost
  namespace: flux-system
spec:
  targetNamespace: ai
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  interval: 1h
  path: ./kubernetes/apps/ai/bifrost/app
  postBuild:
    substitute:
      APP: *app
      # Bifrost's container runs as UID/GID 1000 (unlike open-webui's root requirement) - the
      # VolSync restic mover must match, or backup/restore hits permission errors on the PVC.
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CLAIM: bifrost-data
      # Holds Bifrost's own SQLite config/governance DB (config_store, see helmrelease.yaml) once
      # providers are added via its web UI - small, but not disposable once that happens.
      VOLSYNC_CAPACITY: 1Gi
      # Deterministic stagger, not hand-picked - generated by scripts/volsync-schedule.py
      # (task volsync:schedule APP=bifrost). Run `task volsync:check-schedules` after adding.
      VOLSYNC_SCHEDULE: "29 * * * *"
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
    - name: rook-ceph-cluster
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them - see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync

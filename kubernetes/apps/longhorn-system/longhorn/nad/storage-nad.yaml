---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: longhorn-storage
  namespace: longhorn-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "longhorn-storage",
      "type": "ipvlan",
      "master": "bond-storage",
      "mode": "l3",
      "mtu": 9000,
      "ipam": {
        "type": "whereabouts",
        "range": "10.200.0.64/26",
        "node_slice_size": "/28",
        "routes": [
          {"dst": "10.200.0.0/24"}
        ]
      }
    }

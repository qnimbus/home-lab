---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: longhorn
  wait: false
  prune: true
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/longhorn-system/longhorn/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: longhorn
      namespace: longhorn-system
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-nad
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: longhorn-nad
  prune: true
  interval: 1h
  path: ./kubernetes/apps/longhorn-system/longhorn/nad
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: multus    # NAD CRD (NetworkAttachmentDefinition) is installed by Multus
    - name: longhorn  # longhorn-system namespace is created by the Longhorn HelmRelease

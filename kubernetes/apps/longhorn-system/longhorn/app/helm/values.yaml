---
# see: https://github.com/longhorn/charts/blob/v1.11.x/charts/longhorn/values.yaml

persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 3
  volumeBindingMode: WaitForFirstConsumer
  defaultDataLocality: best-effort
  reclaimPolicy: Delete

csi:
  kubeletRootDir: /var/lib/kubelet

defaultSettings:
  defaultDataPath: /var/mnt/longhorn-storage
  defaultReplicaCount: 3
  createDefaultDiskLabeledNodes: true
  allowEmptyDiskSelectorVolume: true
  storageOverProvisioningPercentage: 200
  storageMinimalAvailablePercentage: 10
  guaranteedEngineManagerCPU: 12
  guaranteedReplicaManagerCPU: 12
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  concurrentReplicaRebuildPerNodeLimit: 2
  orphanAutoDeletion: true
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  csiStorageCapacityTracking: true
  replicaAutoBalance: best-effort
  replicaReplenishmentWaitInterval: "900"
  # Routes engine<->replica iSCSI over the storage VLAN via the Multus lhnet1 NAD.
  # ipvlan L3 + whereabouts node_slice_size (one /28 per node); host /etc/hostname is
  # provided to whereabouts by a postRenderer initContainer. See docs/longhorn-storage-network.md.
  storageNetwork: "kube-system/longhorn-storage"

service:
  ui:
    type: ClusterIP

longhornManager:
  priorityClass: system-cluster-critical
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

longhornDriver:
  priorityClass: system-cluster-critical
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

longhornInstanceManager:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 2000m
      memory: 256Mi

longhornUI:
  replicas: 1

monitoring:
  enabled: true

preUpgradeChecker:
  jobEnabled: false

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app waha
  namespace: flux-system
spec:
  targetNamespace: automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Phase 1 (see app/helmrelease.yaml): direct ReplicationSource only, not the full
  # components/volsync Component yet — the Component's PVC/ReplicationDestination assume a
  # PVC that doesn't exist yet, which doesn't hold for this app (it already has live data).
  # Phase 2 adds `components: [../../../../components/volsync]` back once a real backup is
  # verified working.
  wait: false
  prune: true
  interval: 1h
  path: ./kubernetes/apps/automation/waha/app
  postBuild:
    substitute:
      APP: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
    - name: rook-ceph-cluster
    - name: volsync
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: automation

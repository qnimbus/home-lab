---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app waha
  namespace: flux-system
spec:
  targetNamespace: automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # VolSync retrofit complete: wired to the full components/volsync Component (was Phase 1's
  # standalone ExternalSecret/ReplicationSource). The "waha" PVC has been cut over to
  # dataSourceRef — see docs/ROADMAP.md → VolSync (PVC Backup) for the cutover history,
  # including the 2026-06-22 incident where an earlier attempt deleted the live PVC.
  components:
    - ../../../../components/volsync
  wait: false
  prune: true
  interval: 1h
  path: ./kubernetes/apps/automation/waha/app
  postBuild:
    substitute:
      APP: *app
      # NAS temporarily offline 2026-06-24
      # This toggle pauses the hourly ReplicationSource
      # so VolSync stops attempting NFS-backed Restic backups.
      VOLSYNC_PAUSED: "false"
      # Deterministic stagger, not hand-picked — generated by scripts/volsync-schedule.py
      # (task volsync:schedule APP=waha), which hashes the app name to avoid the
      # component's :00 default (see docs/ROADMAP.md's e1000e packet-drops entry,
      # 2026-09-01, for why unstaggered hourly backups are a real risk). Run
      # `task volsync:check-schedules` after adding/renaming any volsync-backed app.
      VOLSYNC_SCHEDULE: "18 * * * *"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: automation

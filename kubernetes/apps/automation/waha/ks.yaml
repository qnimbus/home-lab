---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app waha
  namespace: flux-system
spec:
  targetNamespace: automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # VolSync retrofit, step 2 of 3 (see app/helmrelease.yaml): now wired to the full
  # components/volsync Component (was Phase 1's standalone ExternalSecret/ReplicationSource).
  # dataSourceRef only populates a PVC at creation time, so this alone does NOT take over the
  # existing "waha" PVC — the Component's PVC carries ssa: IfNotPresent, so Flux skips it
  # while that object still exists. Step 3 (separate, deliberate, not yet done): verify the
  # backup restores cleanly, delete the live PVC, let this Component recreate it fresh with
  # dataSourceRef intact.
  components:
    - ../../../../components/volsync
  wait: false
  prune: true
  interval: 1h
  path: ./kubernetes/apps/automation/waha/app
  postBuild:
    substitute:
      APP: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
    - name: rook-ceph-cluster
    - name: volsync
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: automation

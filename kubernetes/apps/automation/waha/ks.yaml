---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app waha
  namespace: flux-system
spec:
  targetNamespace: automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Phase 2 of the VolSync retrofit (see app/helmrelease.yaml): now using the full Component.
  # dataSourceRef only populates a PVC at creation time — it can't retroactively attach to
  # the already-Bound "waha" PVC, so this alone doesn't restore anything. The Component's PVC
  # carries ssa: IfNotPresent, so Flux just skips it while "waha" already exists; the actual
  # cutover to a dataSourceRef-backed PVC is a separate, deliberate step (delete the live PVC
  # once its backup is verified restorable, let this Component recreate it fresh).
  components:
    - ../../../../components/volsync
  wait: false
  prune: true
  interval: 1h
  path: ./kubernetes/apps/automation/waha/app
  postBuild:
    substitute:
      APP: *app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
    - name: rook-ceph-cluster
    - name: volsync
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: automation

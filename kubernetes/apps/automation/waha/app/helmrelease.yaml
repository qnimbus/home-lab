---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: waha
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: waha
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
    controllers:
      waha:
        annotations:
          reloader.stakater.com/auto: "true"
        revisionHistoryLimit: 1
        containers:
          app:
            image:
              repository: docker.io/devlikeapro/waha
              tag: gows-2026.9.2@sha256:1ae3c6a994ee97e5039bf41103193d7bf9175f1a31db73ba89bdeed6277901bc
            env:
              TZ: "${CLUSTER_TIMEZONE}"
              WAHA_API_KEY:
                valueFrom:
                  secretKeyRef:
                    key: WAHA_API_KEY
                    name: waha-secret
              WAHA_AUTO_START_DELAY_SECONDS: "5"
              WAHA_DASHBOARD_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: WAHA_DASHBOARD_PASSWORD
                    name: waha-secret
              WAHA_DASHBOARD_USERNAME:
                valueFrom:
                  secretKeyRef:
                    key: WAHA_DASHBOARD_USERNAME
                    name: waha-secret
              WAHA_LOG_FORMAT: "JSON"
              WAHA_LOG_LEVEL: "info"
              WAHA_WORKER_RESTART_SESSIONS: "true"
              WHATSAPP_DEFAULT_ENGINE: "GOWS"
              WHATSAPP_FILES_LIFETIME: "180"
              WHATSAPP_HOOK_EVENTS: "message,session.status"
              WHATSAPP_HOOK_HMAC_KEY:
                valueFrom:
                  secretKeyRef:
                    key: WHATSAPP_HOOK_HMAC_KEY
                    name: waha-secret
              WHATSAPP_RESTART_ALL_SESSIONS: "true"
              WHATSAPP_START_SESSION: "true"
              WHATSAPP_SWAGGER_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: WHATSAPP_SWAGGER_PASSWORD
                    name: waha-secret
              WHATSAPP_SWAGGER_USERNAME:
                valueFrom:
                  secretKeyRef:
                    key: WHATSAPP_SWAGGER_USERNAME
                    name: waha-secret
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      until curl -sf http://localhost:3000/ping > /dev/null; do sleep 2; done
                      curl -sf -X POST http://localhost:3000/api/sessions/default/start \
                        -H "Content-Type: application/json" \
                        -H "X-Api-Key: $(cat /run/secrets/waha/WAHA_API_KEY_PLAIN)" || \
                      curl -sf -X POST http://localhost:3000/api/sessions \
                        -H "Content-Type: application/json" \
                        -H "X-Api-Key: $(cat /run/secrets/waha/WAHA_API_KEY_PLAIN)" \
                        -d '{"name":"default","start":true}' || true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /ping
                    port: &port 3000
                    scheme: HTTP
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /ping
                    port: *port
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 384Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    persistence:
      waha-secrets:
        type: secret
        name: waha-secret
        globalMounts:
          - path: /run/secrets/waha
            readOnly: true
      sessions:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /app/.sessions
      media:
        type: emptyDir
        globalMounts:
          - path: /tmp/whatsapp-files
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        ports:
          http:
            port: *port

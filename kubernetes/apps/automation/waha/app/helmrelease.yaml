---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app waha
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      waha:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        revisionHistoryLimit: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/devlikeapro/waha
              # renovate: datasource=docker depName=docker.io/devlikeapro/waha
              tag: "gows-2026.5.1"
            env:
              WHATSAPP_START_SESSION: "true"
              WHATSAPP_FILES_LIFETIME: "180"
              WHATSAPP_DEFAULT_ENGINE: "GOWS"
              WHATSAPP_RESTART_ALL_SESSIONS: "true"
              WHATSAPP_HOOK_EVENTS: "message,session.status"
              WAHA_AUTO_START_DELAY_SECONDS: "5"
              WAHA_WORKER_RESTART_SESSIONS: "true"
              WAHA_LOG_FORMAT: "JSON"
              WAHA_LOG_LEVEL: "info"
              TZ: "${CLUSTER_TIMEZONE}"
            envFrom:
              - secretRef:
                  name: waha-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 3000
                    scheme: HTTP
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 384Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      sessions:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /app/.sessions
      media:
        type: emptyDir
        globalMounts:
          - path: /tmp/whatsapp-files
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

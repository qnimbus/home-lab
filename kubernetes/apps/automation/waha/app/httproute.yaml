---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waha
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "WAHA"
    gethomepage.dev/description: "WhatsApp HTTP API"
    gethomepage.dev/group: "Automation"
    gethomepage.dev/icon: "mdi-whatsapp"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "waha.${DOMAIN_CLUSTER}"
  rules:
    - backendRefs:
        - name: waha
          port: 3000

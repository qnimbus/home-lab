---
# Phase 1 of the VolSync retrofit — see ks.yaml and app/helmrelease.yaml. Backs up the
# real, already-existing "waha" PVC directly by name (NOT via components/volsync, which
# assumes a PVC that doesn't exist yet). sourcePVC only needs to name an existing PVC; it
# doesn't need to "own" or have created it, so this is safe against live data.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: "${APP}"
spec:
  sourcePVC: "${APP}"
  trigger:
    schedule: "0 * * * *"
  restic:
    repository: "${APP}-volsync-secret"
    copyMethod: Snapshot
    pruneIntervalDays: 7
    retain:
      hourly: 24
      daily: 7
      weekly: 4
    accessModes:
      - ReadWriteOnce
    storageClassName: ceph-block
    volumeSnapshotClassName: ceph-block-snapshot
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 5Gi
    cacheStorageClassName: openebs-hostpath
    moverSecurityContext:
      runAsUser: 4000
      runAsGroup: 4000
      fsGroup: 4000
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            server: 10.200.0.41
            path: /mnt/tank/Cluster/volsync

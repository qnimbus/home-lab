---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &db-app n8n-db
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *db-app
  interval: 1h
  path: ./kubernetes/apps/automation/n8n/db
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword-store
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app n8n
  namespace: flux-system
spec:
  targetNamespace: automation
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  interval: 1h
  path: ./kubernetes/apps/automation/n8n/app
  postBuild:
    substitute:
      APP: *app
      # n8n's published image runs as the `node` user (UID/GID 1000), unlike open-webui's
      # root-only image — match the mover's security context to that so VolSync's restic
      # backup/restore doesn't hit permission errors against files owned by 1000:1000.
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CAPACITY: 5Gi
      # Deterministic stagger, not hand-picked — generated by scripts/volsync-schedule.py
      # (task volsync:schedule APP=n8n), which hashes the app name to avoid the
      # component's :00 default (see docs/ROADMAP.md's e1000e packet-drops entry,
      # 2026-09-01, for why unstaggered hourly backups are a real risk). Run
      # `task volsync:check-schedules` after adding/renaming any volsync-backed app.
      VOLSYNC_SCHEDULE: "32 * * * *"
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: n8n-db
    - name: onepassword-store
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync
      namespace: system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: automation

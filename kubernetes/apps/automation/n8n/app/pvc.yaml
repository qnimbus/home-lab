---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
  labels:
    # Create-once: Flux skips this claim if it already exists, so the live PVC (which can carry
    # an immutable dataSourceRef from the removed VolSync bootstrap-restore) is never re-applied.
    # Keep it declared here — dropping it from this Kustomization would let Flux prune the volume.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-block

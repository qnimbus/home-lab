---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: n8n-secret
    template:
      engineVersion: v2
      data:
        # Critical and effectively irreversible: n8n uses this to encrypt stored workflow
        # credentials. Losing or rotating it after workflows exist orphans every stored
        # credential. Generate once with `openssl rand -base64 32` and never rotate casually.
        N8N_ENCRYPTION_KEY: "{{ .N8N_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: n8n
      rewrite:
        - regexp:
            source: (.*)
            target: N8N_$1

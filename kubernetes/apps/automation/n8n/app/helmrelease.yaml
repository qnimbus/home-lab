---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: n8n
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.42.2@sha256:4867554ea7e90d996debeed6cdcdae676e66d949dbd0a05176b87792843d59f5
            env:
              DB_POSTGRESDB_DATABASE:
                valueFrom:
                  secretKeyRef:
                    key: dbname
                    name: n8n-postgres-app
              DB_POSTGRESDB_HOST: "${APP}-postgres-rw"
              DB_POSTGRESDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: n8n-postgres-app
              DB_POSTGRESDB_PORT: "5432"
              DB_POSTGRESDB_USER:
                valueFrom:
                  secretKeyRef:
                    key: username
                    name: n8n-postgres-app
              DB_TYPE: "postgresdb"
              EXECUTIONS_DATA_MAX_AGE: "168"
              EXECUTIONS_DATA_PRUNE: "true"
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: "50000"
              GENERIC_TIMEZONE: "${CLUSTER_TIMEZONE}"
              N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
              N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
              N8N_DIAGNOSTICS_ENABLED: "false"
              N8N_EMAIL_MODE: "smtp"
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
              N8N_HIDE_USAGE_PAGE: "true"
              N8N_HOST: "n8n.${DOMAIN_CLUSTER}"
              N8N_NATIVE_PYTHON_RUNNER: "true"
              N8N_PORT: &port 5678
              N8N_PROTOCOL: "https"
              N8N_PROXY_HOPS: "1"
              N8N_RUNNERS_MODE: "external"
              N8N_RUNNERS_TASK_TIMEOUT: &taskTimeout "300"
              N8N_SMTP_HOST: "smtp-relay.mail.svc.cluster.local"
              N8N_SMTP_PORT: "25"
              N8N_SMTP_SENDER: "n8n <${MAIL_FROM_ADDRESS}>"
              N8N_SMTP_SSL: "false"
              N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
              N8N_WEBHOOK_URL: "https://n8n.${DOMAIN_CLUSTER}/"
              NODE_OPTIONS: "--max-old-space-size=1536"
            envFrom:
              - secretRef:
                  name: n8n-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness:
                <<: *probes
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: *port
            resources:
              requests:
                cpu: 5m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
          runners:
            image:
              repository: ghcr.io/n8n-io/runners
              tag: 2.42.2@sha256:7c99d650ff125780ba1bd293bd95c8cf537bea77f16eb085bf79bca3a5e36ab5
            env:
              GENERIC_TIMEZONE: "${CLUSTER_TIMEZONE}"
              N8N_RUNNERS_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    key: N8N_RUNNERS_AUTH_TOKEN
                    name: n8n-secret
              N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
              N8N_RUNNERS_TASK_BROKER_URI: "http://localhost:5679"
              N8N_RUNNERS_TASK_TIMEOUT: *taskTimeout
              NODE_OPTIONS: "--max-old-space-size=768"
            probes:
              liveness: &runnerProbes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /healthz
                    port: 5680
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *runnerProbes
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext
    persistence:
      config:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /home/node/.n8n
    service:
      app:
        ports:
          http:
            port: *port

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &db-app firefly-iii-db
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *db-app
  interval: 1h
  path: ./kubernetes/apps/finance/firefly-iii/db
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword-store
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii
  namespace: flux-system
spec:
  targetNamespace: finance
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    - ../../../../components/keda/postgres-scaler
  interval: 1h
  path: ./kubernetes/apps/finance/firefly-iii/app
  postBuild:
    substitute:
      APP: *app
      APP_UID: "33"
      APP_GID: "33"
      VOLSYNC_CAPACITY: 5Gi
      # Staggered off the component's :00 default — see docs/ROADMAP.md's e1000e
      # packet-drops entry (2026-09-01): all 8 volsync-backed apps syncing at the same
      # top-of-hour minute is a real synchronized-burst risk on the Ceph public_network.
      VOLSYNC_SCHEDULE: "51 * * * *"
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: firefly-iii-db
    - name: onepassword-store
    - name: rook-ceph-cluster
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync

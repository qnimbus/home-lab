---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      firefly-iii:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: fireflyiii/core
              # renovate: datasource=docker depName=fireflyiii/core
              tag: "version-6.6.6"
            env:
              APP_ENV: production
              APP_DEBUG: "false"
              DB_CONNECTION: pgsql
              DB_HOST: ${PG_HOST}
              DB_PORT: "5432"
              DB_DATABASE: firefly
              APP_URL: "https://firefly.${DOMAIN_CLUSTER}"
              TRUSTED_PROXIES: "**"
              TZ: ${CLUSTER_TIMEZONE}
            envFrom:
              - secretRef:
                  name: firefly-iii-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # Laravel runs DB migrations on first boot, which can take a while -
                  # generous budget so the pod isn't killed mid-migration.
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: firefly-iii
        ports:
          http:
            port: *port
    persistence:
      upload:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /var/www/html/storage/upload

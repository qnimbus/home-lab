---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly-iii-importer
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Firefly III Data Importer"
    gethomepage.dev/description: "Bank CSV/API import tool for Firefly III"
    gethomepage.dev/group: "Finance"
    gethomepage.dev/icon: "mdi-database-import"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "firefly-importer.${DOMAIN_CLUSTER}"
  rules:
    # Routed through the KEDA HTTP Add-on interceptor (not the importer's Service
    # directly) so it can hold first-request traffic while the importer scales up
    # from 0 — see interceptorroute.yaml/scaledobject.yaml in this directory.
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080

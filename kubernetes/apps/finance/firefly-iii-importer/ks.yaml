---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii-importer
  namespace: flux-system
spec:
  targetNamespace: finance
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/finance/firefly-iii-importer/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: firefly-iii
    - name: onepassword-store
    # InterceptorRoute/ScaledObject CRDs don't exist until the add-on's
    # operator installs them — see bootstrap-ordering rule in CLAUDE.md.
    - name: keda-add-ons-http

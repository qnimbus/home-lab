---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-admin-secret
    template:
      engineVersion: v2
      data:
        username: "{{ .ADMIN_USERNAME }}"
        password: "{{ .ADMIN_PASSWORD }}"
        # Duplicated from the `database`-namespace `forgejo-db-secret` (same 1Password
        # item) — a Pod can only reference a Secret in its own namespace, and this app
        # runs in `development` while forgejo-db-secret lives in `database` for CNPG.
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: forgejo

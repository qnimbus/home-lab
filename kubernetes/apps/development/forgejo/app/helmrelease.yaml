---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 1h
  # Placeholder so components/postgres's JSON6902 patch (appends to
  # /spec/dependsOn/-) has an existing array to append to — see
  # kubernetes/components/postgres/kustomization.yaml.
  dependsOn: []
  chartRef:
    kind: OCIRepository
    name: forgejo
  values:
    # image.registry/repository/rootless already default to code.forgejo.org/forgejo/forgejo
    # rootless — leaving image.tag unset tracks the chart's own appVersion pairing rather
    # than jumping ahead to an app release the pinned chart version wasn't tested against.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop: ["ALL"]
    gitea:
      admin:
        existingSecret: forgejo-admin-secret
      config:
        server:
          DOMAIN: forgejo.${DOMAIN_CLUSTER}
          ROOT_URL: https://forgejo.${DOMAIN_CLUSTER}
          SSH_DOMAIN: forgejo.${DOMAIN_CLUSTER}
        database:
          DB_TYPE: postgres
          # Dedicated cluster (components/postgres), same namespace as this
          # Deployment now — no more cross-namespace secret duplication needed.
          HOST: "${APP}-postgres-rw:5432"
      # cache/queue/session deliberately left unset: this chart's own template falls
      # back to memory/level/memory when unspecified, which is correct for a single
      # replicaCount deployment — no Redis/Valkey instance needed for one consumer.
      #
      # NAME/USER/PASSWD all read from the CNPG-generated forgejo-postgres-app
      # Secret rather than being hardcoded — stays correct if POSTGRES_DATABASE/
      # POSTGRES_USERNAME are ever overridden away from the ${APP} default.
      additionalConfigFromEnvs:
        - name: GITEA__DATABASE__NAME
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres-app
              key: dbname
        - name: GITEA__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres-app
              key: username
        - name: GITEA__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres-app
              key: password
    persistence:
      storageClass: ceph-block
    httpRoute:
      enabled: false
    tcpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: ssh

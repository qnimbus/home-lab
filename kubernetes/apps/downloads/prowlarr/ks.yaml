---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app prowlarr
  namespace: flux-system
spec:
  targetNamespace: downloads
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    # --- ceph-block -> NFS /config migration (see docs/ROADMAP.md, e1000e packet-drops
    # entry, follow-up #3) --- PHASE 1 (additive, safe): provisions the new nfs-backed PVC
    # and a one-off Job that copies the current ceph-block PVC's contents into it. Remove
    # both lines, and the app's replicas: 0 override below, once the migration Job has been
    # confirmed successful (phase 2 also drops the volsync line above and cuts
    # persistence.config over to the new PVC — see that commit).
    - ../../../../components/nfs-config
    - ../../../../components/nfs-config-migrate
  interval: 1h
  path: ./kubernetes/apps/downloads/prowlarr/app
  postBuild:
    substitute:
      APP: *app
      # 1000:1000 matches media/plex and n8n's precedent — see that ks.yaml's comment. Kept
      # here even though Prowlarr itself has no NFS mount, so the volsync component's backup
      # job owns the /config PVC contents with the same UID/GID as every other app in this
      # stack, for consistency.
      APP_UID: "1000"
      APP_GID: "1000"
      # /config only (indexer defs, sqlite db, logs) — small, no media library involved.
      VOLSYNC_CAPACITY: 2Gi
      # Matches VOLSYNC_CAPACITY above — sized the same since it's the same logical data,
      # just moving backend. Drop VOLSYNC_CAPACITY (and the volsync component) once phase 2
      # of the ceph-block -> NFS migration completes.
      NFS_CONFIG_CAPACITY: 2Gi
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # Prowlarr itself needs no ExternalSecret beyond its own (see app/externalsecret.yaml),
    # but the volsync component's own externalsecret.yaml pulls the shared "volsync-restic"
    # 1Password item and needs the ClusterSecretStore to exist first.
    - name: onepassword-store
    - name: rook-ceph-cluster
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync
    # nfs StorageClass source — required for the nfs-config PVC above.
    - name: csi-driver-nfs
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: downloads

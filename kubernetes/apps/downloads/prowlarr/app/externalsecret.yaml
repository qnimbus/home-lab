---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr-secret
  data:
    # Pre-seeded rather than left to auto-generate on first boot, so it's known in advance
    # for Prowlarr's own Applications config (Sonarr/Radarr) and any future automation.
    - secretKey: PROWLARR__AUTH__APIKEY
      remoteRef:
        key: prowlarr
        property: api_key

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # PHASE 2 of the ceph-block -> NFS /config migration (docs/ROADMAP.md, e1000e
  # packet-drops entry, follow-up #3) complete: volsync (ceph-block PVC + hourly backup)
  # and nfs-config-migrate (one-off copy Job, already run) are both gone — /config now
  # lives permanently on the nfs-config component's PVC, with no automated backup (this
  # data is small/recreatable: sqlite db, logs — see ROADMAP.md for why that trade-off
  # was made).
  components:
    - ../../../../components/nfs-config
  interval: 1h
  path: ./kubernetes/apps/downloads/radarr/app
  postBuild:
    substitute:
      APP: *app
      # 1000:1000 matches media/plex and n8n's precedent — see that ks.yaml's comment. Also
      # the UID/GID the /mnt/media NFS mount is expected to be writable by.
      APP_UID: "1000"
      APP_GID: "1000"
      # /config only (sqlite db, logs) — the movie library itself is the same raw NFS mount
      # media/plex already uses, not part of this PVC.
      NFS_CONFIG_CAPACITY: 5Gi
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
      namespace: flux-system
    # nfs StorageClass source — required for the nfs-config PVC.
    - name: csi-driver-nfs
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: downloads

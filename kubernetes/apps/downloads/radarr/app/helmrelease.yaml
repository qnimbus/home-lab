---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: radarr
  values:
    controllers:
      radarr:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            env:
              TZ: "${CLUSTER_TIMEZONE}"
            envFrom:
              - secretRef:
                  name: radarr-secret
            probes:
              # Confirmed live: this image listens on Radarr's traditional default port
              # (7878), not 80 — an earlier assumption that home-operations images normalize
              # to 80 was wrong and caused a probe-port mismatch / CrashLoopBackOff.
              # Probes are split (they used to share one timeoutSeconds: 1 probe): kubelet was
              # restarting this pod after /ping timeouts (166 restarts in 8d as of 2026-09-20,
              # all clean exits). The stall itself is not root-caused — sabnzbd has the same
              # node, NFS backing and 1s probe and restarted once — so this widens tolerance
              # rather than fixing it. startup gates the other two (5m budget), liveness needs
              # 6 consecutive 5s timeouts (~1m) before killing, readiness drops the pod from
              # the Service after 3 without restarting it.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 7878
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      app:
        controller: radarr
        ports:
          http:
            port: 7878
    persistence:
      config:
        existingClaim: "${APP}-nfs-config"
        globalMounts:
          - path: /config
      # Text logs on node-local disk instead of the NFS config PVC, to take their constant
      # small appends off the NFS mount — a trial for the /ping timeout restarts (see the
      # probes comment), not a proven cause: logs.db and the main sqlite DB stay on NFS in
      # /config. Survives container restarts but not pod recreation; console logs still
      # reach kubectl logs.
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      # Same raw NFS export media/plex and downloads/sonarr already mount — see sonarr's
      # helmrelease.yaml comment for the hardlink rationale.
      media:
        type: nfs
        server: "${NAS_HOST}"
        path: /mnt/tank/Media
        globalMounts:
          - path: /mnt/media

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      radarr:
        # Required: /config is an RWO ceph-block PVC.
        strategy: Recreate
        # PHASE 1 of the ceph-block -> NFS /config migration (docs/ROADMAP.md, e1000e
        # packet-drops entry): scaled to 0 so the ceph-block PVC below is unattached while
        # the nfs-config-migrate Job copies its contents to the new nfs-backed PVC — Ceph
        # RBD RWO only reliably allows same-node multi-attach, which isn't guaranteed
        # between this pod and the Job. Restore to 1 (or remove the field) in phase 2, at
        # the same time persistence.config below is cut over to the new PVC.
        replicas: 0
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/home-operations/radarr
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.1.10545@sha256:260469d707617f4b5be1cd11a40be7e4889c63c5e7cdbc6a429626dc05863b6b # verify current tag/digest at implementation time
            env:
              TZ: "${CLUSTER_TIMEZONE}"
            envFrom:
              - secretRef:
                  name: radarr-secret
            probes:
              # Confirmed live: this image listens on Radarr's traditional default port
              # (7878), not 80 — an earlier assumption that home-operations images normalize
              # to 80 was wrong and caused a probe-port mismatch / CrashLoopBackOff.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 7878
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      app:
        controller: radarr
        ports:
          http:
            port: 7878
    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM:=${APP}}"
        globalMounts:
          - path: /config
      # Same raw NFS export media/plex and downloads/sonarr already mount — see sonarr's
      # helmrelease.yaml comment for the hardlink rationale.
      media:
        type: nfs
        server: "${NAS_HOST}"
        path: /mnt/tank/Media
        globalMounts:
          - path: /mnt/media

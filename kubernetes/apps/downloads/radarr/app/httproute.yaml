---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  annotations:
    gethomepage.dev/description: "Movie automation"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "radarr"
    gethomepage.dev/name: "Radarr"
spec:
  hostnames:
    - "radarr.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: radarr
          port: 7878

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  annotations:
    gethomepage.dev/description: "TV series automation"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "sonarr"
    gethomepage.dev/name: "Sonarr"
spec:
  hostnames:
    - "sonarr.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989

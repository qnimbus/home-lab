---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr
  values:
    controllers:
      sonarr:
        # Required: /config is an RWO PVC (nfs StorageClass since the ceph-block ->
        # NFS migration — see docs/ROADMAP.md).
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/home-operations/sonarr
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.19.3001@sha256:2fef93accb445aeb1773e454825ac903f7d66d9addfe045d56fff69ba8181c82 # verify current tag/digest at implementation time
            env:
              TZ: "${CLUSTER_TIMEZONE}"
            envFrom:
              - secretRef:
                  name: sonarr-secret
            probes:
              # Confirmed live: this image listens on Sonarr's traditional default port
              # (8989), not 80 — an earlier assumption that home-operations images normalize
              # to 80 was wrong and caused a probe-port mismatch / CrashLoopBackOff.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989
    persistence:
      config:
        existingClaim: "${APP}-nfs-config"
        globalMounts:
          - path: /config
      # Same raw NFS export media/plex already mounts (not the dynamic nfs StorageClass —
      # see that HelmRelease's comment). Sonarr needs both the downloads staging area
      # (to detect completed grabs) and the library (to hardlink the imported file) on this
      # one mount, since hardlinks only work within a single filesystem. Root folder and
      # remote-path-mapping config (which subpaths under here) is set post-deploy in the UI —
      # see docs/ROADMAP.md.
      media:
        type: nfs
        server: "${NAS_HOST}"
        path: /mnt/tank/Media
        globalMounts:
          - path: /mnt/media

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: configarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: configarr-secret
    template:
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
  dataFrom:
    - extract:
        key: sonarr
      rewrite:
        - regexp:
            source: (.*)
            target: SONARR_$1
    - extract:
        key: radarr
      rewrite:
        - regexp:
            source: (.*)
            target: RADARR_$1

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: configarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: configarr-secret
    template:
      engineVersion: v2
      data:
        # Names match config.yml's `!env` lookups, not the SONARR_/RADARR_-prefixed
        # rewrite output directly.
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
  # Reuses the sonarr/radarr 1Password items sonarr's and radarr's own ExternalSecrets
  # already pull from (see ../sonarr/app/externalsecret.yaml) — no separate "configarr"
  # 1Password item required.
  dataFrom:
    - extract:
        key: sonarr
      rewrite:
        - regexp:
            source: (.*)
            target: SONARR_$1
    - extract:
        key: radarr
      rewrite:
        - regexp:
            source: (.*)
            target: RADARR_$1

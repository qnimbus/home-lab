---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sabnzbd
  driftDetection:
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
            env:
              SABNZBD__HOST_WHITELIST_ENTRIES: "sabnzbd.${DOMAIN_CLUSTER},sabnzbd.downloads.svc.cluster.local"
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: &path "/api?mode=version"
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: *path
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    persistence:
      config:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /config
      backups:
        type: nfs
        path: /mnt/tank/Cluster/backup
        server: "${NAS_HOST}"
        globalMounts:
          - path: /mnt/backups
            subPath: apps/sabnzbd
      media:
        type: nfs
        path: /mnt/tank/Media
        server: "${NAS_HOST}"
        globalMounts:
          - path: /mnt/media
    service:
      app:
        ports:
          http:
            port: 8080

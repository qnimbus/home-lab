---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      sabnzbd:
        # Required: /config is an RWO ceph-block PVC.
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/home-operations/sabnzbd
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.1@sha256:8f90c25c7ee2773112c76b209ba0c32f089ced996f0dd0683cdfeaf07df365f8 # verify current tag/digest at implementation time
            env:
              TZ: "${CLUSTER_TIMEZONE}"
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: "/api?mode=version"
                    port: 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                # par2 repair/unpack is memory-hungry — higher ceiling than the other three.
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: 80
    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM:=${APP}}"
        globalMounts:
          - path: /config
      # Same raw NFS export media/plex, downloads/sonarr and downloads/radarr already mount.
      # Sabnzbd downloads into the incomplete/complete subpaths here (configured post-deploy
      # in its UI); Sonarr/Radarr then hardlink from the complete subpath into the library on
      # this same filesystem — see sonarr's helmrelease.yaml comment.
      media:
        type: nfs
        server: "${NAS_HOST}"
        path: /mnt/tank/Media
        globalMounts:
          - path: /mnt/media

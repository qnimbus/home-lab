---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd
  annotations:
    gethomepage.dev/description: "Usenet downloader"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "sabnzbd"
    gethomepage.dev/name: "Sabnzbd"
spec:
  hostnames:
    - "sabnzbd.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: sabnzbd
          port: 8080

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sabnzbd-secret
  data:
    - secretKey: SABNZBD__API_KEY
      remoteRef:
        key: sabnzbd
        property: api_key
    - secretKey: SABNZBD__NZB_KEY
      remoteRef:
        key: sabnzbd
        property: nzb_key

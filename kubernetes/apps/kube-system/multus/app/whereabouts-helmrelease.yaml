---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whereabouts
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: whereabouts-chart
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: whereabouts-values
  # Backport of upstream whereabouts PR #703 (fixes issue #518), which is merged to master but
  # NOT yet in any release — v0.9.3 (the latest, pinned here) predates it. With node_slice_size,
  # the whereabouts CNI *plugin* must resolve its node name for the NodeSlicePool lookup +
  # per-pool leader election. getNodeName (pkg/storage/kubernetes/ipam.go) resolves in order:
  #   (1) $NODENAME env  →  (2) <configuration_path>/nodename file  →  (3) /etc/hostname
  # The plugin is exec'd by the multus thick-daemon inside chroot:/hostroot, so it does NOT
  # inherit this pod's NODENAME env, and Talos provides no /etc/hostname (and /etc is read-only)
  # → it panics (nil-pointer in leader election) and the CNI ADD fails. We use path (2): write
  # the apiserver node name into the host CNI dir (writable on Talos, unlike /etc/hostname) and
  # emit configuration_path so the on-host binary consults it.
  #
  # configuration_path MUST live in the flatfile whereabouts.conf, NOT the NAD: getNodeName treats
  # it as a directory (<path>/nodename), but GetFlatIPAM treats a NAD-supplied configuration_path
  # as a *file* and io.ReadAll's it — a directory there breaks all config loading.
  #
  # The chart has no hook for this, so override the DaemonSet container args (NODENAME env and the
  # writable /host/etc/cni/net.d mount are already provided by the chart). When a whereabouts
  # release > 0.9.3 containing PR #703 ships, drop this backport — the chart will do it natively.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: whereabouts-whereabouts-chart
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: whereabouts-whereabouts-chart
              spec:
                template:
                  spec:
                    containers:
                      - name: whereabouts-chart
                        command: ["/bin/sh"]
                        args:
                          - -c
                          - |
                            SLEEP=false source /install-cni.sh
                            CONF=/host/etc/cni/net.d/whereabouts.d/whereabouts.conf
                            grep -q '"configuration_path"' "$CONF" || sed -i 's#"datastore": "kubernetes",#"datastore": "kubernetes",\n  "configuration_path": "/etc/cni/net.d/whereabouts.d",#' "$CONF"
                            printf '%s' "$NODENAME" > /host/etc/cni/net.d/whereabouts.d/nodename
                            /token-watcher.sh &
                            /ip-control-loop -log-level debug

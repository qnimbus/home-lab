# Applied manually via UniFi's UI: Settings → Policy Table → Policy Engine →
# Dynamic Routing → BGP → select the UDM Pro Max → paste/upload this file.
# Nothing in this repo applies it automatically; kept here for reference and
# reproducibility only, same as everything else in this directory.
router bgp 64513
  ! Router ID
  bgp router-id 10.60.0.1

  ! Disables FRR's RFC 8212 strict-policy requirement, which would otherwise
  ! refuse to accept/advertise anything on an eBGP session with no attached
  ! route-map. Safe to disable here: the inbound route-map below still
  ! bounds what's accepted regardless of this setting.
  no bgp ebgp-requires-policy

  neighbor k8s peer-group
  neighbor k8s remote-as 64514

  ! No session authentication (no `password`, no GTSM/TTL check) — peers are
  ! trusted by source IP + matching ASN alone. Consider `neighbor k8s
  ! password <secret>` (TCP MD5, RFC 2385) later if this needs hardening;
  ! it requires a matching `authSecretRef` on Cilium's CiliumBGPPeerConfig
  ! for the session to still come up.
  neighbor 10.60.0.201 peer-group k8s
  neighbor 10.60.0.202 peer-group k8s
  neighbor 10.60.0.203 peer-group k8s
  neighbor 10.60.0.204 peer-group k8s
  neighbor 10.60.0.205 peer-group k8s

  address-family ipv4 unicast
    ! Matches today's 5 Talos nodes exactly, with no headroom. If a 6th node
    ! is ever added and peered, bump this too — otherwise its routes are
    ! accepted into the BGP table but never installed into the FIB, silently
    ! capping ECMP at 5 of 6 equal-cost paths.
    maximum-paths 5
    neighbor k8s next-hop-self
    neighbor k8s soft-reconfiguration inbound
    neighbor k8s route-map K8S-LB-IN in
  exit-address-family
exit

! Only accept routes for this cluster's actual LoadBalancer VIPs: kube-api
! (10.60.0.2/32) plus the general pool (10.60.0.230-249, decomposed below
! into exact CIDR blocks — no slop, no over-permit). `le 32` matters because
! Cilium advertises each Service IP as an exact /32, not the pool CIDR
! itself. Side benefit: this also rejects the IOT-VLAN VIPs (10.30.0.234,
! 10.30.0.240) should they ever leak onto this session, since they fall
! outside 10.60.0.0/24 entirely.
ip prefix-list K8S-LB-IN seq 10 permit 10.60.0.2/32
ip prefix-list K8S-LB-IN seq 20 permit 10.60.0.230/31 le 32
ip prefix-list K8S-LB-IN seq 30 permit 10.60.0.232/29 le 32
ip prefix-list K8S-LB-IN seq 40 permit 10.60.0.240/29 le 32
ip prefix-list K8S-LB-IN seq 50 permit 10.60.0.248/31 le 32

route-map K8S-LB-IN permit 10
  match ip address prefix-list K8S-LB-IN
exit

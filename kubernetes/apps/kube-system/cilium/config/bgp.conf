# Applied manually via UniFi's UI: Settings → Policy Table → Policy Engine →
# Dynamic Routing → BGP → select the UDM Pro Max → paste/upload this file.
# Nothing in this repo applies it automatically; kept here for reference and
# reproducibility only, same as everything else in this directory.
router bgp 64513
  ! Router ID
  bgp router-id 10.60.0.1

  ! RFC 8212 strict-policy enforcement is disabled explicitly. Import and
  ! export policy is nevertheless applied to every peer group below.
  no bgp ebgp-requires-policy

  ! -------------------------------------------------------------------------
  ! Kubernetes / Cilium
  ! -------------------------------------------------------------------------

  neighbor k8s peer-group
  neighbor k8s remote-as 64514

  neighbor 10.60.0.201 peer-group k8s
  neighbor 10.60.0.202 peer-group k8s
  neighbor 10.60.0.203 peer-group k8s
  neighbor 10.60.0.204 peer-group k8s
  neighbor 10.60.0.205 peer-group k8s

  ! -------------------------------------------------------------------------
  ! TrueNAS / FRR
  ! -------------------------------------------------------------------------

  neighbor nas peer-group
  neighbor nas remote-as 64515

  neighbor 10.10.0.41 peer-group nas

  address-family ipv4 unicast
    ! Five Cilium peers may advertise the same Service VIP. Allow all five
    ! equal-cost paths to be installed.
    maximum-paths 5

    ! Accept only approved Kubernetes LoadBalancer VIPs.
    neighbor k8s soft-reconfiguration inbound
    neighbor k8s route-map K8S-LB-IN in

    ! The UDM is not used to distribute routes back into Kubernetes.
    neighbor k8s route-map DENY-ALL out

    ! Accept only individual /32 VIPs from the NAS service address pool.
    neighbor nas soft-reconfiguration inbound
    neighbor nas route-map NAS-LB-IN in

    ! The NAS does not need to learn routes from the UDM via BGP.
    neighbor nas route-map DENY-ALL out
  exit-address-family
exit

! ---------------------------------------------------------------------------
! Kubernetes import policy
! ---------------------------------------------------------------------------

! kube-api VIP.
ip prefix-list K8S-LB-IN seq 10 permit 10.60.0.2/32

! General LoadBalancer pool: 10.60.0.230-249.
ip prefix-list K8S-LB-IN seq 20 permit 10.60.0.230/31 le 32
ip prefix-list K8S-LB-IN seq 30 permit 10.60.0.232/29 le 32
ip prefix-list K8S-LB-IN seq 40 permit 10.60.0.240/29 le 32
ip prefix-list K8S-LB-IN seq 50 permit 10.60.0.248/31 le 32

route-map K8S-LB-IN permit 10
  match ip address prefix-list K8S-LB-IN
exit

! ---------------------------------------------------------------------------
! NAS import policy
! ---------------------------------------------------------------------------

! 10.10.2.0/24 is reserved as the NAS/Docker service VIP pool.
! Only individual /32 service addresses may be advertised. The aggregate
! 10.10.2.0/24 itself, or any other prefix, is rejected.
ip prefix-list NAS-LB-IN seq 10 permit 10.10.2.0/24 ge 32

route-map NAS-LB-IN permit 10
  match ip address prefix-list NAS-LB-IN
exit

! ---------------------------------------------------------------------------
! Export policy
! ---------------------------------------------------------------------------

! Neither Cilium nor the NAS requires routes from the UDM. An empty deny
! route-map matches everything and therefore exports nothing.
route-map DENY-ALL deny 10
exit

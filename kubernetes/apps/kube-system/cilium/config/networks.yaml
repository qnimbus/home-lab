---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  blocks:
    - start: "10.60.0.230"
      stop: "10.60.0.249"
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2.json
# Single-IP pool reserved for kube-api only (serviceSelector below), so it can
# never be auto-picked by an unpinned Service and can't collide with the
# envoy-external/envoy-internal block in `pool`.
#
# Pinned to 10.60.0.2 — the same address as talos/controlplane.yaml.j2's
# Layer2VIPConfig, not a separate IP. Talos's own VIP already ARPs this
# address on the control-plane nodes from the moment Talos is up, independent
# of Cilium/CNI; this Service exists so external-dns can publish a hostname
# for it, and so BGP (once configured for this pool) can upgrade single-node
# ARP failover into real ECMP across all 3 control planes for routed clients.
# l2-policy below excludes this Service so Cilium never ARPs the same IP
# itself and fights with Talos's own ownership of it.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-kube-api
spec:
  blocks:
    - cidr: "10.60.0.2/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": kube-system
      "io.kubernetes.service.name": kube-api
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2.json
# Single-IP pool reserved for smtp-relay's IOT-facing VIP only (serviceSelector below).
# Announced via the tagged VLAN 30 sub-interface each node carries on its mgmt trunk NIC
# (talos/talconfig.yaml) — gives the IOT-VLAN printer an in-segment path to smtp-relay
# that never crosses the UniFi inter-VLAN firewall. See docs/QA.md.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-iot-smtp-relay
spec:
  blocks:
    - cidr: "10.30.0.240/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": mail
      "io.kubernetes.service.name": smtp-relay
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliumloadbalancerippool_v2.json
# Single-IP pool reserved for Plex's IOT-facing VIP only (serviceSelector below). Same
# rationale as pool-iot-smtp-relay above: a Google TV streamer on 10.30.0.0/24 can't route to
# 10.60.0.0/24 at all (UniFi gateway blocks IOT-initiated cross-VLAN traffic by design),
# so Plex needs an in-segment IOT-side VIP too. See docs/QA.md.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-iot-plex
spec:
  blocks:
    - cidr: "10.30.0.234/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": media
      "io.kubernetes.service.name": plex
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  serviceSelector:
    # Excludes kube-api: its LB IP (10.60.0.2, see pool-kube-api above) is the
    # same address Talos's own Layer2VIPConfig (talos/controlplane.yaml.j2)
    # already ARPs on the control-plane nodes directly. Announcing it here too
    # would give the address two independent, uncoordinated ARP owners —
    # Talos's VIP election and Cilium's L2 leader election can pick different
    # nodes, flapping/blackholing the apiserver VIP itself.
    matchExpressions:
      - { key: "io.kubernetes.service.name", operator: NotIn, values: ["kube-api"] }
  # Interfaces intentionally unspecified: Cilium announces on all interfaces.
  # The storage bond (`bond-storage`, all 5 nodes, 10.200.0.0/24) has no
  # gateway/default route back to the management subnet, so ARP announcements
  # on it are harmless — that's still true after `bond-storage` was added to
  # Cilium's `devices:` list (kube-system/cilium/app/helm/values.yaml) to give
  # pods a routed path to Ceph's public_network. "No route back" is an L3
  # statement about that subnet's own config (no gateway configured on it),
  # not a claim that pods can't reach it — Cilium's own datapath now routes
  # pod traffic there directly once attached as a device. The IOT VLAN 30
  # sub-interfaces (pool-iot-smtp-relay, pool-iot-plex, above) are deliberately reachable
  # from the IOT segment — that's the point — but each scoped to a single
  # pinned Service.
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux

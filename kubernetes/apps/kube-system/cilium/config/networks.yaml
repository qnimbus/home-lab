---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  serviceSelector:
    # Only the two IOT-facing VIPs stay on L2 now (pool-iot-smtp-relay,
    # pool-iot-plex — mail/media namespaces): BGP (bgp.conf, the
    # CiliumBGP* resources below) took over kube-api, envoy-external,
    # envoy-internal, and victoria-logs-syslog once peering, 5-way ECMP,
    # live failover (~17s recovery, one node's session killed outright), and
    # real per-connection flow-hashing were all verified working. kube-api
    # was already excluded before that for a second reason too: its LB IP
    # (10.60.0.2) is the same address Talos's own Layer2VIPConfig
    # (talos/controlplane.yaml.j2) ARPs on the control-plane nodes directly —
    # L2-announcing it here as well would give that address two independent,
    # uncoordinated ARP owners.
    #
    # Positive include (mail/media) rather than a NotIn list of individual
    # service names, so this selector and the CiliumBGPAdvertisement's below
    # stay complementary automatically — any future LoadBalancer Service
    # gets BGP by default, with nothing to update here.
    matchExpressions:
      - { key: "io.kubernetes.service.namespace", operator: In, values: ["mail", "media"] }
  # Interfaces intentionally unspecified: Cilium announces on all interfaces.
  # The storage bond (`bond-storage`, all 5 nodes, 10.200.0.0/24) has no
  # gateway/default route back to the management subnet, so ARP announcements
  # on it are harmless — that's still true after `bond-storage` was added to
  # Cilium's `devices:` list (kube-system/cilium/app/helm/values.yaml) to give
  # pods a routed path to Ceph's public_network. "No route back" is an L3
  # statement about that subnet's own config (no gateway configured on it),
  # not a claim that pods can't reach it — Cilium's own datapath now routes
  # pod traffic there directly once attached as a device. The IOT VLAN 30
  # sub-interfaces (pool-iot-smtp-relay, pool-iot-plex, above) are deliberately reachable
  # from the IOT segment — that's the point — but each scoped to a single
  # pinned Service.
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  blocks:
    - start: "10.60.0.230"
      stop: "10.60.0.249"
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-kube-api
spec:
  blocks:
    - cidr: "10.60.0.2/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": kube-system
      "io.kubernetes.service.name": kube-api
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-iot-smtp-relay
spec:
  blocks:
    - cidr: "10.30.0.240/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": mail
      "io.kubernetes.service.name": smtp-relay
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool-iot-plex
spec:
  blocks:
    - cidr: "10.30.0.234/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": media
      "io.kubernetes.service.name": plex

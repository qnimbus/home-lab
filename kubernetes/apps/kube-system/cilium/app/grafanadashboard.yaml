---
# yaml-language-server: $schema=https://schemas.clustrs.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-dashboard
spec:
  allowCrossNamespaceImport: true
  configMapRef:
    key: cilium-dashboard.json
    name: cilium-dashboard
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS
  instanceSelector:
    matchLabels:
      dashboards: grafana
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-operator-dashboard
spec:
  allowCrossNamespaceImport: true
  configMapRef:
    key: cilium-operator-dashboard.json
    name: cilium-operator-dashboard
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS
  instanceSelector:
    matchLabels:
      dashboards: grafana

---
autoDirectNodeRoutes: true
bpf:
  masquerade: true
  # Talos workaround: https://github.com/siderolabs/talos/issues/10002
  hostLegacyRouting: true
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# This cluster has two active bonds per node with different names across nodes:
#   cp-01: management=bond0 (r8169+igc), storage=bond1 (i40e)
#   cp-02/03: management=enp1s0f0 (e1000e), storage=bond0 (ixgbe)
# Cilium auto-detects the primary interface via the default route (management).
# Uncomment and adjust if Cilium attaches to the wrong interface:
# devices: bond+ enp+
endpointRoutes:
  enabled: true
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: "10.42.0.0/16"
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
l2announcements:
  enabled: true
loadBalancer:
  algorithm: maglev
  mode: dsr
localRedirectPolicy: true
operator:
  replicas: 1
  rollOutPods: true
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
socketLB:
  hostNamespaceOnly: true

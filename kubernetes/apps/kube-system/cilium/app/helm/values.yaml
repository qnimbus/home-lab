---
autoDirectNodeRoutes: true
# REVERTED live 2026-09-13: crash-looped cilium-agent on 2/5 nodes with
# "BPF bandwidth manager's BBR setup requires BPF host routing." BBR hard-
# requires bpf.hostLegacyRouting: false, which directly conflicts with the
# hostLegacyRouting: true Talos workaround below (siderolabs/talos#10002).
# Verified BBR was available in the kernel before enabling, but didn't cross-
# check it against that pre-existing setting — real gap in the pre-check, not
# a flaky failure. Revisit only alongside confirming whether talos#10002 is
# still applicable on the installed Talos version; don't re-enable blind.
# bandwidthManager:
#   enabled: true
#   bbr: true
# Field path verified live against the installed chart (helm show values
# cilium/cilium --version 1.20.1): bgpControlPlane.enabled, default false.
# secretsNamespace.name defaults to kube-system (not cilium-secrets — that
# was true for chart 1.18.x, not this version); left at default since no
# peer auth secret exists yet (see bgp.conf's comment on adding one later).
bgpControlPlane:
  enabled: true
bpf:
  masquerade: true
  # Removed hostLegacyRouting: true (was here since the initial commit,
  # never revisited). Traced the actual bug via siderolabs/talos#10002's
  # comment thread rather than the one-line summary that was here before:
  # Cilium's BPF host routing + bpf.masquerade=true (set above) breaks
  # return-path delivery for DNS forwarded to the host resolver — confirmed
  # by a Talos maintainer as a general upstream Cilium bug (cilium/cilium
  # #36761), not Talos-specific. Two independent fixes exist: Talos-side
  # forwardKubeDNSToHost: false, or this flag. talos/cluster.yaml.j2 already
  # sets forwardKubeDNSToHost: false — for an unrelated reason (preserving
  # the cluster search domain) — so this flag was redundant, paying legacy
  # routing's real perf cost (skips the BPF redirect fast path, traverses
  # netfilter/conntrack in the host namespace) for a bug already closed off
  # from the other side. Chart default (false = BPF host routing) applies
  # now. Confirmed live before removing: `cilium status --verbose` showed
  # "Routing: Network: Native Host: Legacy"; watch it flip to "BPF" after
  # rollout, and watch pods come up Running (not another hard dependency
  # crash like tonight's BBR one) before considering this done.
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# Renders the cilium-dashboard/cilium-operator-dashboard ConfigMaps that app/grafanadashboard.yaml
# loads into Grafana. hubble.metrics.dashboards stays off: hubble.metrics is deliberately
# still unconfigured.
dashboards:
  enabled: true
# Bond/mgmt-NIC layout, confirmed live via `talosctl get links` (2026-09-03):
#   cp-01:                management=enp4s0 (I225/I226 igc), storage=bond-storage
#   cp-02/03/worker-01/02: management=eno1  (I219-LM e1000e), storage=bond-storage
# Scoped wildcards, not exact names: `eno1+`/`enp4s0+` match the management NIC
# itself *and* its own `.30` VLAN sub-interface (eno1.30 / enp4s0.30 — the IOT
# VLAN, talos/talconfig.yaml) — required for Cilium's L2-announcement feature,
# which only ARP-announces LoadBalancer IPs (e.g. pool-iot-plex's 10.30.0.234,
# pool-iot-smtp-relay's 10.30.0.240) on interfaces present in this `devices`
# filter. An exact-name list (`eno1 enp4s0 bond-storage`, briefly landed
# 2026-09-03) silently excluded the `.30` sub-interfaces and broke both IOT
# VIPs — confirmed via `cilium-dbg statedb` showing l2-announce entries for
# 10.30.0.234/10.30.0.240 only on enp4s0/bond-storage, never enp4s0.30. Do NOT
# broaden this to a bare `enp+`/`eno+`: that would also match bond-storage's
# own slave NICs on some nodes (e.g. cp-01's enp5s0f0np0/enp5s0f1np1), which
# must NOT be attached to directly — only the bond master. The scoped
# `eno1+`/`enp4s0+` forms don't have that collision (bond-storage's slaves use
# different prefixes on every node — enp5s0f*, enp2s0f*, enp1s0f* — confirmed
# via `talosctl get links` across all 5 nodes) while still giving pods a
# routed path to Ceph's public_network migration target (10.200.0.0/24) — see
# docs/ROADMAP.md "Ceph public_network: Move to Storage Bond".
devices: eno1+ enp4s0+ bond-storage
#
# MTU stays at 1500 even though bond-storage carries jumbo frames (9000) at
# the host level: Cilium's MTU is a single cluster-wide scalar in this chart
# version (1.20.1), not per-device, so raising it would also apply to the
# management path. It was pinned here after a real incident — a 9000 MTU on
# the mgmt-only pod path made pods believe they could send 9000-byte frames
# over a route capped at 1500 end-to-end; every packet needing PMTUD (ICMP
# fragmentation-needed) to recover triggered black-holes (e.g. the mutual-TLS
# streaming_replica handshake between CNPG instances stalled for minutes at a
# time before self-clearing) while small packets kept working, which made it
# hard to diagnose. Ceph's own host-networked mon/OSD/replication traffic on
# bond-storage is unaffected — it never goes through Cilium's pod-network MTU.
# Only pod-originated traffic to 10.200.0.0/24 is capped at 1500 by this — e.g.
# the RBD CSI controller plugin, which runs on the pod network
# (`drivers.rbd.controllerPlugin.hostNetwork: false` in the ceph-csi-drivers
# HelmRelease); the CSI node plugins are host-networked and unaffected.
MTU: 1500
endpointRoutes:
  enabled: true
# Explicit decision, not chart default left on by accident: base Hubble is a
# lightweight per-node flow-recording listener in cilium-agent (local
# hubble.sock only, no extra Deployment). Relay aggregates all 5 nodes' flows
# into one queryable stream — cheap (1 replica, no resource overrides in the
# chart), and would have made this session's BGP/L2 debugging (which node
# actually served a connection, DNS/policy verdicts like the bifrost
# incident) a live query instead of workarounds like SAN-diffing repeated
# curls. UI and Prometheus metrics deliberately held off for now.
hubble:
  enabled: true
  relay:
    enabled: true
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: "10.42.0.0/16"
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
l2announcements:
  enabled: true
loadBalancer:
  algorithm: maglev
  mode: dsr
# localRedirectPolicy (singular) is deprecated as of this chart version —
# schema comment says "please use 'localRedirectPolicies.enabled' instead".
# Confirmed both render the same enable-local-redirect-policy flag via
# `helm template`; migrated ahead of the deprecated alias being removed.
localRedirectPolicies:
  enabled: true
operator:
  dashboards:
    enabled: true
  replicas: 2 # chart default; was pinned to 1, a needless SPOF for LB IPAM/CRD reconciliation
  rollOutPods: true
# Enable path MTU discovery so Cilium's datapath correctly generates ICMP
# fragmentation-needed replies — relevant given the real PMTUD-blackhole
# incident documented above (bond-storage's 9000 MTU vs. the 1500 pod-network
# MTU). Doesn't replace the MTU pin, complements it.
pmtuDiscovery:
  enabled: true
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
# enabled was missing — hostNamespaceOnly alone is a no-op while the parent
# feature is off (default false). Confirmed via `helm template`: without
# `enabled: true` the rendered agent config keeps bpf-lb-sock: "false"
# regardless of hostNamespaceOnly. hostNamespaceOnly matters for the
# k8sServiceHost/k8sServicePort local-proxy pattern above — keeps socket LB
# out of the pod namespace's path to the apiserver.
socketLB:
  enabled: true
  hostNamespaceOnly: true

---
autoDirectNodeRoutes: true
bpf:
  masquerade: true
  # Talos workaround: https://github.com/siderolabs/talos/issues/10002
  hostLegacyRouting: true
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# Allow Multus to coexist as the default CNI — Multus writes 00-multus.conf which
# wraps Cilium as primary. Without this, Cilium renames 00-multus.conf to
# 00-multus.conf.cilium_bak and kubelet uses Cilium directly, bypassing Multus.
cni:
  exclusive: false
# Bond layout (all nodes use bond-storage for storage after talconfig.yaml rename):
#   cp-01/02: management=e1000e (single port), storage=bond-storage (ixgbe X520)
#   cp-03:    management=bond0 (RTL8125+igc),  storage=bond-storage (i40e X710)
# Cilium auto-detects the primary interface via the default route (management).
# Uncomment and adjust if Cilium attaches to the wrong interface:
# devices: bond+ enp+
MTU: 9000
endpointRoutes:
  enabled: true
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: "10.42.0.0/16"
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
l2announcements:
  enabled: true
loadBalancer:
  algorithm: maglev
  mode: dsr
localRedirectPolicy: true
operator:
  replicas: 1
  rollOutPods: true
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
socketLB:
  hostNamespaceOnly: true

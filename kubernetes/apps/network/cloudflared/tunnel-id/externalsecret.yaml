---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-id
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-tunnel-id-secret
    template:
      data:
        CLOUDFLARE_TUNNEL_ID: "{{ .CF_TUNNEL_ID }}"
  dataFrom:
    - extract:
        key: cloudflared
      rewrite:
        - regexp:
            source: (.*)
            target: CF_$1

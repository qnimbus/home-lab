---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns-rules
spec:
  groups:
    - name: external-dns.rules
      rules:
        - alert: ExternalDNSStale
          annotations:
            summary: ExternalDNS ({{ $labels.job }}) has not synced successfully in the last 15 minutes.
          expr: time() - external_dns_controller_last_sync_timestamp_seconds > 90
          for: 15m
          labels:
            severity: warning

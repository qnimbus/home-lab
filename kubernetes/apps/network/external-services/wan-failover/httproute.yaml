---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app wan-failover
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
  # No gethomepage.dev/* annotations: this proxies an external failover link, not a Kubernetes
  # workload — there's no pod for homepage's pod-selector to ever match. It's listed in
  # homepage's services.yaml instead, with an HTTP siteMonitor check rather than pod status.
spec:
  hostnames:
    - "wan-failover.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  # Router's embedded web UI validates the Host header against its own management IP and
  # rejects/misbehaves on wan-failover.${DOMAIN_CLUSTER}. Envoy Gateway blocks both standard
  # Gateway API mechanisms for rewriting Host to an IP literal: URLRewrite.hostname rejects IP
  # literals outright, and RequestHeaderModifier silently strips "Host" as a disallowed header
  # (leaving the route Accepted: False either way, which also makes external-dns-unifi delete
  # the DNS record — gateway-httproute source only advertises Accepted routes, policy: sync).
  # No filter for now: still routable/DNS-resolvable while a real fix is designed. See ROADMAP.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: *app
          port: 80

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app wan-failover
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
  # No gethomepage.dev/* annotations: this proxies an external failover link, not a Kubernetes
  # workload — there's no pod for homepage's pod-selector to ever match. It's listed in
  # homepage's services.yaml instead, with an HTTP siteMonitor check rather than pod status.
spec:
  hostnames:
    - "wan-failover.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # The router's embedded web UI validates the Host header against its own management IP
      # and rejects/misbehaves on wan-failover.${DOMAIN_CLUSTER} — rewrite it to what the router
      # itself expects before forwarding. Must use RequestHeaderModifier, not URLRewrite: Envoy
      # Gateway rejects URLRewrite.hostname when the value is an IP literal ("Hostname: ... cannot
      # be an ip address"), which left this route unaccepted and serving a synthetic 500.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: "192.168.8.1"
      backendRefs:
        - name: *app
          port: 80

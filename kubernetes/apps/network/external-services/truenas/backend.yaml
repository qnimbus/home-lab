---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: &app truenas
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
  # Envoy Gateway Backend rather than a Service + hand-managed EndpointSlice: newer TrueNAS
  # versions validate the scheme of the request they actually receive (notably /_download), so
  # terminating TLS at Envoy and re-originating plain HTTP made TrueNAS reject its own UI's
  # downloads. Talking HTTPS on 8443 end-to-end keeps that check happy. Requires
  # `extensionApis.enableBackend` on the envoy-gateway HelmRelease.
spec:
  endpoints:
    - ip:
        address: "${NAS_LAN_HOST}"
        port: 8443
  tls:
    # TrueNAS serves its own self-signed cert on 8443 and there is no path to enrol it in our
    # cert-manager PKI; the hop is a single LAN link to a host we already trust.
    insecureSkipVerify: true
    # Pin to HTTP/1.1: TrueNAS's nginx offers h2 over TLS, and Backend.spec.tls.alpnProtocols
    # defaults to [h2, http/1.1], so Envoy negotiates h2 to the backend unless told otherwise.
    # HTTP/2 has no Upgrade mechanism (RFC 9113 §8.2.2 forbids the Connection/Upgrade headers
    # entirely — WebSocket over h2 requires extended CONNECT instead), so the WebSocket upgrade
    # TrueNAS's UI depends on for its middleware API got a 400 from nginx once TLS enabled h2
    # negotiation. Plain HTTP never had this problem: no ALPN, so it was always HTTP/1.1.
    alpnProtocols:
      - http/1.1

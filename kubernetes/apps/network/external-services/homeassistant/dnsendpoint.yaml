---
# yaml-language-server: $schema=https://schemas.clustrs.dev/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: homeassistant
spec:
  endpoints:
    - dnsName: "homeassistant.lan.home.${DOMAIN_IO}"
      recordType: A
      targets:
        - "${HOME_ASSISTANT_LAN_HOST}"
    - dnsName: "homeassistant.iot.home.${DOMAIN_IO}"
      recordType: A
      targets:
        - "${HOME_ASSISTANT_IOT_HOST}"
    - dnsName: "ha.lan.home.${DOMAIN_IO}"
      recordType: CNAME
      targets:
        - "homeassistant.lan.home.${DOMAIN_IO}"
    - dnsName: "ha.iot.home.${DOMAIN_IO}"
      recordType: CNAME
      targets:
        - "homeassistant.iot.home.${DOMAIN_IO}"

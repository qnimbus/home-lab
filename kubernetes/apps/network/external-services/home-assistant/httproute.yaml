---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app home-assistant
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
  # No gethomepage.dev/* annotations: Home Assistant is a physical/LAN device proxied in from
  # here, not a Kubernetes workload — there's no pod for homepage's pod-selector to ever match.
  # It's listed in homepage's services.yaml instead, with a homeassistant widget rather than pod
  # status.
spec:
  hostnames:
    - "ha.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: *app
          port: 8123

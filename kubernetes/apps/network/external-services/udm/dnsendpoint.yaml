---
# yaml-language-server: $schema=https://schemas.clustrs.dev/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: udm
spec:
  endpoints:
    - dnsName: "gateway.lan.home.${DOMAIN_IO}"
      recordType: A
      targets:
        - "10.10.0.1"
    - dnsName: "portal.guest.home.${DOMAIN_IO}"
      recordType: A
      targets:
        - "192.168.1.1"
    - dnsName: "udm.${DOMAIN_APP}"
      recordType: A
      targets:
        - "10.10.0.1"
    - dnsName: "guest.unifi.${DOMAIN_APP}"
      recordType: A
      targets:
        - "192.168.1.1"

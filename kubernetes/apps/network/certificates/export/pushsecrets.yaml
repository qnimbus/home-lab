---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vwn-app-tls
spec:
  refreshInterval: 1h
  updatePolicy: Replace # keep re-pushing so a cert-manager renewal reaches 1Password
  deletionPolicy: None # never delete the 1Password item if this CR is removed
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: vwn-app-tls
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: vwn-app-tls
          property: tls.crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: vwn-app-tls
          property: tls.key
---

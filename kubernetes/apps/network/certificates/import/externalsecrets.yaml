---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vwn-app-tls
spec:
  refreshInterval: 5m
  # One-time restore only — cert-manager owns renewal from here on. creationPolicy:
  # Orphan alone would NOT stop ESO from overwriting on every refresh; it's this
  # refreshPolicy that provides the one-time-then-hands-off guarantee.
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vwn-app-tls
    creationPolicy: Orphan
    template:
      type: kubernetes.io/tls
      metadata:
        labels:
          controller.cert-manager.io/fao: "true"
        annotations:
          cert-manager.io/certificate-name: wildcard-vwn-app
          cert-manager.io/common-name: "${DOMAIN_APP}"
          cert-manager.io/alt-names: "${DOMAIN_APP},*.${DOMAIN_APP}"
          cert-manager.io/ip-sans: ""
          cert-manager.io/uri-sans: ""
          cert-manager.io/issuer-name: letsencrypt-production
          cert-manager.io/issuer-kind: ClusterIssuer
          cert-manager.io/issuer-group: cert-manager.io
  data:
    - secretKey: tls.crt
      remoteRef:
        key: vwn-app-tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: vwn-app-tls
        property: tls.key

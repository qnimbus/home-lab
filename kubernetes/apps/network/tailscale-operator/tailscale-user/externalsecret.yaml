---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-user
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tailscale-user-secret
    template:
      data:
        TAILSCALE_USER: "{{ .TS_USERNAME }}"
  dataFrom:
    - extract:
        key: tailscale
      rewrite:
        - regexp:
            source: (.*)
            target: TS_$1

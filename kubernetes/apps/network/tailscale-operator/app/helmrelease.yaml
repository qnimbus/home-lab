---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tailscale-operator
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
  interval: 1h
  values:
    fullnameOverride: *app
    installCRDs: true
    oauthSecretVolume:
      secret:
        secretName: tailscale-operator
    operatorConfig:
      hostname: *app

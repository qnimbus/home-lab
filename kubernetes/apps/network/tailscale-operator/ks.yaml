---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-user
spec:
  targetNamespace: network
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/tailscale-user
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: tailscale-user
      namespace: network
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-operator
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: network
  dependsOn:
    - name: tailscale-user
    - name: cilium-config
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: tailscale-user-secret
      - kind: ConfigMap
        name: cluster-settings
        optional: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: network
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-configs
spec:
  targetNamespace: network
  dependsOn:
    - name: tailscale-operator
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

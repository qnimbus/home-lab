---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-user
spec:
  targetNamespace: network
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/tailscale-user
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: tailscale-user
      namespace: network
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-operator
  labels:
    # Load-bearing: cluster-apps' substituteFrom patch replaces the whole
    # list, which would drop tailscale-user-secret and render
    # ${TAILSCALE_USER} empty. cluster-settings is listed below instead.
    # TAILSCALE_USER has its own Secret (an ExternalSecret, where bykaj seeds
    # it at bootstrap) to keep it out of the plaintext cluster-settings
    # ConfigMap.
    substitution.flux.home.arpa/disabled: "true"
spec:
  targetNamespace: network
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: tailscale-user-secret
      - kind: ConfigMap
        name: cluster-settings
        optional: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: tailscale-user
    - name: cilium-config
      namespace: kube-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: network
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-configs
spec:
  targetNamespace: network
  prune: true
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/configs
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: tailscale-operator

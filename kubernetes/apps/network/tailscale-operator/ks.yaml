---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-user
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/tailscale-user
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: tailscale-user
      namespace: network
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-operator
  labels:
    decryption.flux.home.arpa/disabled: "true"
    # TAILSCALE_USER must stay out of the fleet-wide plaintext cluster-settings
    # ConfigMap — sourced instead from the dedicated tailscale-user-secret
    # above, mirroring the cloudflare-tunnel-id pattern (bykaj seeds the
    # equivalent secret during his synchronous bootstrap instead; this repo's
    # bootstrap isn't wired up yet, so a regular ExternalSecret substitutes).
    substitution.flux.home.arpa/disabled: "true"
spec:
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: tailscale-user-secret
      - kind: ConfigMap
        name: cluster-settings
        optional: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: tailscale-user
    - name: cilium-config
      namespace: kube-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: network
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-configs
  labels:
    decryption.flux.home.arpa/disabled: "true"
    substitution.flux.home.arpa/disabled: "true"
spec:
  prune: true
  interval: 1h
  path: ./kubernetes/apps/network/tailscale-operator/configs
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: tailscale-operator

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  values:
    config:
      envoyGateway:
        extensionApis:
          # Off-chart default ({}). Enables the gateway.envoyproxy.io Backend CRD, which lets an
          # HTTPRoute target an off-cluster host directly (with its own TLS settings) instead of
          # a Service fronting a hand-managed EndpointSlice — see external-services/truenas.
          enableBackend: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace

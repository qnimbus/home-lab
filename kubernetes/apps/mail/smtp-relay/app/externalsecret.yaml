---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp-relay
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: smtp-relay-secret
  dataFrom:
    - extract:
        key: resend-notifications
      rewrite:
        - regexp:
            source: (.*)
            target: RESEND_NOTIFICATIONS_$1
    - extract:
        key: resend-scan
      rewrite:
        - regexp:
            source: (.*)
            target: RESEND_SCAN_$1

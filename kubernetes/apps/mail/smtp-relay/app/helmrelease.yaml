---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smtp-relay
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: smtp-relay
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      smtp-relay:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/foxcpp/maddy
              tag: 0.9.6@sha256:e1074e92a452b84d1135ebe8ab831c5f541d33dcbd39e38fab740a53bbf2f97c
            env:
              SMTP_RELAY_HOSTNAME: smtp-relay.${DOMAIN_CLUSTER}
              SMTP_RELAY_SMTP_PORT: &port 2525
            envFrom:
              - secretRef:
                  name: smtp-relay-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    persistence:
      cache:
        type: emptyDir
      config:
        type: configMap
        name: smtp-relay-config
        globalMounts:
          - path: /data/maddy.conf
            subPath: maddy.conf
            readOnly: true
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "smtp-relay.${DOMAIN_CLUSTER}"
          external-dns.kubernetes.io/target: "10.60.0.240"
          lbipam.cilium.io/ips: "10.60.0.240,10.30.0.240"
        loadBalancerSourceRanges:
          - "${PRINTER_IOT_HOST}/32"
          - "${LAN_CIDR}"
        ports:
          smtp:
            port: 25
            protocol: TCP
            targetPort: *port

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./dnsendpoint.yaml
configMapGenerator:
  - name: smtp-relay-config
    files:
      - maddy.conf=./resources/maddy.conf
generatorOptions:
  disableNameSuffixHash: true

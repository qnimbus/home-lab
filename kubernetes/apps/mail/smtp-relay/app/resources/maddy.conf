state_dir /cache/state
runtime_dir /cache/run
tls off
hostname {env:SMTP_RELAY_HOSTNAME}
smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
    source notifications.vanwetten.id {
        deliver_to &notifications_queue
    }
    source scan.vwn.casa {
        deliver_to &scan_queue
    }
    default_source {
        reject 550 5.7.1 "Sender domain not allowed on this relay"
    }
}
target.queue notifications_queue {
    target &notifications_resend
}
target.smtp notifications_resend {
    starttls yes
    auth plain resend {env:RESEND_NOTIFICATIONS_API_KEY}
    targets tcp://smtp.resend.com:587
}
target.queue scan_queue {
    target &scan_resend
}
target.smtp scan_resend {
    starttls yes
    auth plain resend {env:RESEND_SCAN_API_KEY}
    targets tcp://smtp.resend.com:587
}

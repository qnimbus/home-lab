---
apiVersion: v1
kind: Service
metadata:
  name: &app smtp-relay-iot
  labels:
    app.kubernetes.io/name: *app
    app.kubernetes.io/instance: *app
  annotations:
    # DNS-only record: publishes smtp-relay.iot.${DOMAIN_IO} -> the IOT-side pinned VIP
    # (pool-iot-smtp-relay, 10.30.0.240) that the real smtp-relay Service already holds as its second
    # LoadBalancer IP (see helmrelease.yaml). Split into its own ExternalName Service because
    # a single Service's hostname annotation can't map two different names to two different
    # IPs — external-dns publishes every hostname against every ingress IP on that Service.
    # Same externalName-as-literal-IP trick used for anna/adam/canon makes external-dns emit
    # a clean single A record. type: ExternalName means no ClusterIP is ever allocated.
    external-dns.alpha.kubernetes.io/hostname: "smtp-relay.iot.${DOMAIN_IO}"
spec:
  type: ExternalName
  externalName: "10.30.0.240"

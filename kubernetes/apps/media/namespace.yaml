---
# yaml-language-server: $schema=https://schemas.clustrs.dev/core/namespace_v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Required for the components/gpu ResourceClaimTemplate's adminAccess:
    # true (plex's DRA GPU claim) to be admitted in this namespace.
    resource.kubernetes.io/admin-access: "true"

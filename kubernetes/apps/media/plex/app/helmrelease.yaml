---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      plex:
        # Required: /config is an RWO ceph-block PVC.
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/home-operations/plex
              repository: ghcr.io/home-operations/plex
              tag: 1.43.3.10896@sha256:4f1d88882a9883cc525e7c84b22c67c57416b7d3b35c3412329eeb07786433a7 # verify current tag/digest at implementation time
            env:
              TZ: "${CLUSTER_TIMEZONE}"
              # Deliberately not setting PLEX_CLAIM_TOKEN — plex.tv claim tokens expire in
              # ~4 minutes, incompatible with async GitOps/ESO reconcile timing. Claim via
              # the web setup wizard post-deploy instead.
              # Trusted CIDRs that skip Plex's own sign-in prompt: mgmt LAN, user's actual
              # LAN (routed separately from mgmt), pod network, service network.
              PLEX_NO_AUTH_NETWORKS: "10.60.0.0/24,10.10.0.0/24,10.42.0.0/16,10.43.0.0/16"
              # The pod has no host networking, so PMS can only see its own pod IP
              # (10.42.0.0/16) — useless to real clients. Without this, PMS advertises
              # that pod IP to plex.tv as the "local" connection, so LAN/mobile clients
              # outside the cluster network can never reach it. This maps to the
              # `customConnections` Preferences.xml key (see entrypoint.sh).
              PLEX_ADVERTISE_URL: "https://plex.${DOMAIN_CLUSTER}:443"
              PLEX_PREFERENCE_1: "AllowMediaDeletion=0"
              PLEX_PREFERENCE_2: "EnableIPv6=0"
              PLEX_PREFERENCE_3: "FriendlyName=Plex"
              PLEX_PREFERENCE_4: "sendCrashReports=0"
              # Required (the default once claimed) rejects plaintext connections from
              # anywhere but loopback — breaks kubelet's probes (fixed via HTTPS scheme
              # above) and Envoy's backend connection (plain HTTP, no BackendTLSPolicy in
              # this repo). Preferred keeps HTTPS available without rejecting plaintext.
              PLEX_PREFERENCE_5: "secureConnections=1"
              # Explicit 0 (not removed — Preferences.xml is additively updated, so
              # removing this var alone wouldn't reset an already-written value). Debug
              # logging confirmed the "Remote connection" label is a hard architectural
              # consequence of no host networking, not a fixable config gap — see
              # docs/QA.md → Media for the full diagnosis. Off to stop the log volume.
              PLEX_PREFERENCE_6: "logDebug=0"
            probes:
              # /identity is Plex's unauthenticated health/discovery endpoint. scheme:
              # HTTPS is required — PMS rejects every plaintext non-loopback connection
              # with "secure connections are required" (confirmed via debug logs), which
              # includes kubelet's own probe traffic (sourced from the node IP, not the
              # pod). Loopback is exempt from this check, which is why exec'ing in and
              # curling 127.0.0.1 always worked while the probe never did. Kubernetes'
              # httpGet probe with scheme: HTTPS does not validate the server certificate,
              # so PMS's self-signed cert needs no extra configuration here.
              # startupProbe gates liveness/readiness until first pass — needed because
              # first-boot library scanning/metadata indexing against a populated NFS
              # library can take well past a minute, and liveness alone (with no startup
              # gate) kills PMS mid-scan before it ever finishes, causing a permanent
              # restart loop. periodSeconds x failureThreshold = 10m budget.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                gpu.intel.com/i915: 1
              limits:
                memory: 4Gi
                # Extended resources require request == limit.
                gpu.intel.com/i915: 1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      # Excludes cp-01 (AMD Ryzen, no Intel iGPU) — the other 4 nodes carry this label via
      # the GPU device plugin's NodeFeatureRule.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
    service:
      app:
        controller: plex
        ports:
          http:
            port: 32400
    persistence:
      config:
        existingClaim: "${VOLSYNC_CLAIM:=${APP}}"
        globalMounts:
          - path: /config
      # Native in-tree NFS volume (no PVC/StorageClass) — deliberately not the dynamic nfs
      # StorageClass, which provisions/deletes a per-PVC subdirectory and would be wrong
      # for a persistent, hand-managed media library.
      media:
        type: nfs
        server: "${NAS_HOST}"
        path: /mnt/tank/Media
        globalMounts:
          - path: /mnt/media
      # Bounded scratch space for transcode segments — disk-backed rather than tmpfs
      # since the smallest worker nodes have only 32GB RAM shared with other workloads,
      # and node disks are already NVMe.
      transcode:
        type: emptyDir
        sizeLimit: 20Gi
        globalMounts:
          - path: /transcode

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  interval: 1h
  # KEDA's nfs-scaler ScaledObject (app/scaledobject.yaml) manages replicas via its own
  # HPA once the NAS's NFS export goes unreachable. Without this, Flux's drift detection
  # reverts it back to the chart's desired replica count on the next reconcile/drift
  # check, undoing scale-to-zero within the hour (same reasoning as paperless's and
  # open-webui's helmrelease.yaml).
  driftDetection:
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  chartRef:
    kind: OCIRepository
    name: plex
  values:
    controllers:
      plex:
        # Required: /config is an RWO ceph-block PVC.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: "${CLUSTER_TIMEZONE}"
              # Cluster-local Service URL: fast direct path for other in-cluster pods
              # (a future *arr stack, say) — bypasses Envoy entirely. Plain HTTP is fine
              # now that secureConnections=Preferred (see PLEX_PREFERENCE_7) allows it.
              # Dedicated LoadBalancer IP (below) also gets a plain-HTTP candidate here,
              # matching bykaj's own pattern — connecting via raw IP over HTTPS would hit
              # a cert hostname mismatch (Plex's self-signed cert covers its advertised
              # hostnames, not the bare IP), so plain HTTP sidesteps that entirely; it's
              # LAN-only traffic so that's an acceptable tradeoff.
              # Dropped bykaj's original ${DOMAIN_APPS} candidate (https://...:443 via
              # envoy-external) — deliberately internal-only, no public route exists for
              # that to be functional. But plex.${DOMAIN_APPS} *is* now a real, working
              # hostname via a different path: external-dns-unifi publishes it straight
              # at the LoadBalancer IP below (see service.app.annotations), so it gets
              # its own plain-HTTP:32400 candidate here, same reasoning as the raw IP.
              # ${LB_IP_PLEX_IOT} candidate: IOT clients (e.g. a Google TV streamer on
              # 10.30.0.0/24) can't route to 10.60.0.0/24 at all — the UniFi gateway
              # blocks IOT-initiated cross-VLAN traffic by design — so without this,
              # plex.tv's "resources" list has no address an IOT device can actually
              # reach. Confirmed 2026-08-24. See docs/QA.md.
              # ${DOMAIN_TAILSCALE} candidate: the Tailscale Ingress below terminates its
              # own TLS via the operator's built-in `tailscale cert` provisioning (no
              # cert-manager involved) — HTTPS is correct here, unlike the plain-HTTP
              # candidates above.
              PLEX_ADVERTISE_URL: "https://plex.${DOMAIN_CLUSTER}:443,http://${LB_IP_PLEX}:32400,http://${LB_IP_PLEX_IOT}:32400,http://plex.${DOMAIN_APPS}:32400,https://${APP_SUBDOMAIN:=${APP}}.${DOMAIN_TAILSCALE}:443,http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:32400"
              PLEX_NO_AUTH_NETWORKS: "${LAN_CIDR},${POD_CIDR},${SERVICE_CIDR},${TAILSCALE_CIDR}"
              PLEX_PREFERENCE_1: "AllowMediaDeletion=0"
              PLEX_PREFERENCE_2: "EnableIPv6=0"
              PLEX_PREFERENCE_3: "FriendlyName=SkyNet Plex"
              PLEX_PREFERENCE_4: "LanNetworksBandwidth=${LAN_CIDR}"
              PLEX_PREFERENCE_5: "RelayEnabled=0"
              PLEX_PREFERENCE_6: "sendCrashReports=0"
              PLEX_PREFERENCE_7: "secureConnections=1"
              PLEX_PREFERENCE_8: "logDebug=0"
            probes:
              # /identity is Plex's unauthenticated health/discovery endpoint. scheme:
              # HTTPS is required — PMS rejects every plaintext non-loopback connection
              # with "secure connections are required" (confirmed via debug logs), which
              # includes kubelet's own probe traffic (sourced from the node IP, not the
              # pod). Loopback is exempt from this check, which is why exec'ing in and
              # curling 127.0.0.1 always worked while the probe never did. Kubernetes'
              # httpGet probe with scheme: HTTPS does not validate the server certificate,
              # so PMS's self-signed cert needs no extra configuration here.
              # startupProbe gates liveness/readiness until first pass — needed because
              # first-boot library scanning/metadata indexing against a populated NFS
              # library can take well past a minute, and liveness alone (with no startup
              # gate) kills PMS mid-scan before it ever finishes, causing a permanent
              # restart loop. periodSeconds x failureThreshold = 10m budget.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: *port
                    scheme: HTTPS
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      # DRA resolves scheduling directly against real device inventory (no manual
      # node label needed) — cp-01 (AMD Ryzen, no Intel iGPU) is naturally excluded
      # since it advertises no gpu.intel.com device.
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: "${APP}-gpu"
    # Tailscale Ingress — gives the user's own tailnet devices a stable HTTPS hostname
    # (${APP_SUBDOMAIN:=${APP}}.${DOMAIN_TAILSCALE}) without depending on the mgmt-LAN
    # subnet route at all. Complements, doesn't replace, the LoadBalancer IPs above:
    # this works even for a tailnet device with no LAN/IOT reachability whatsoever
    # (e.g. off-network). No extra tailscale-operator config was needed — the `tailscale`
    # IngressClass has existed since the operator was first deployed (confirmed live via
    # `kubectl get ingressclass`, 2026-08-24); an earlier assumption here that Ingress
    # mode required separate operator setup was wrong. TLS is provisioned automatically
    # by the operator via Tailscale's own `tailscale cert` (Let's Encrypt through
    # Tailscale, not cert-manager) — requires "HTTPS Certificates" to be enabled for
    # this tailnet in the Tailscale admin console; verify there if the Ingress never
    # reaches Ready.
    ingress:
      ts:
        className: tailscale
        # Scopes this proxy's tailnet ACL grants to Plex specifically, instead of the
        # operator's cluster-wide default (tag:k8s — shared with every other operator-
        # managed proxy, e.g. the subnet router). Tags don't retag an already-exposed
        # proxy in place — recreating the StatefulSet is required after this lands.
        annotations:
          tailscale.com/tags: "tag:plex"
        hosts:
          - host: &host ${APP_SUBDOMAIN:=${APP}}.${DOMAIN_TAILSCALE}
            paths:
              - path: /
                service:
                  identifier: app
                  port: *port
        tls:
          - hosts:
              - *host
    service:
      app:
        controller: plex
        type: LoadBalancer
        annotations:
          # Pin both LB IPs explicitly: mgmt (default pool) and IOT (pool-iot-plex,
          # serviceSelector-scoped to this Service) — see docs/QA.md. `target` pins
          # plex.${DOMAIN_APPS} to the mgmt IP only; without it, both of this Service's
          # ingress IPs would publish as separate A records under the same name (same
          # trap smtp-relay hit first — see dnsendpoint.yaml in that app for the
          # IOT-side-hostname alternative, not needed here since Plex clients get the
          # IOT IP from PLEX_ADVERTISE_URL/plex.tv, not DNS).
          lbipam.cilium.io/ips: "${LB_IP_PLEX},${LB_IP_PLEX_IOT}"
          external-dns.kubernetes.io/hostname: "plex.${DOMAIN_APPS}"
          external-dns.kubernetes.io/target: "${LB_IP_PLEX}"
        # Deliberately NOT externalTrafficPolicy: Local. Cilium's L2 announcement is
        # documented as incompatible with it (cilium/cilium#27800, upstream docs):
        # leader election for the announcing node is unaware of endpoint placement, so
        # the node that wins ARP for LB_IP_PLEX can easily differ from whichever of the
        # 4 GPU-labeled nodes Plex's pod actually lands on — confirmed live 2026-08-24
        # (lease holder was talos-worker-02, pod was on talos-cp-02: every external
        # connection got refused, since a Local-policy node with no local endpoint
        # correctly declines rather than forwarding). Cluster (the default, so this
        # field is just omitted) always routes to a healthy backend regardless of which
        # node receives the traffic, at the cost of not preserving the real client IP —
        # a trade worth making here, since that IP-preservation benefit was unconfirmed
        # to even fix Plex's own LAN/WAN connection labeling in the first place (see
        # docs/QA.md → Media, the interface-adjacency finding).
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: /config
      # Native in-tree NFS volume (no PVC/StorageClass) — deliberately not the dynamic nfs
      # StorageClass, which provisions/deletes a per-PVC subdirectory and would be wrong
      # for a persistent, hand-managed media library.
      media:
        type: nfs
        server: "${NAS_HOST}"
        path: /mnt/tank/Media
        globalMounts:
          - path: /mnt/media
      # Bounded scratch space for transcode segments — disk-backed rather than tmpfs
      # since the smallest worker nodes have only 32GB RAM shared with other workloads,
      # and node disks are already NVMe.
      transcode:
        type: emptyDir
        sizeLimit: 20Gi
        globalMounts:
          - path: /transcode

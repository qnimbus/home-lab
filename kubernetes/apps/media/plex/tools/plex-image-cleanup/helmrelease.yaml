---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-image-cleanup
spec:
  chartRef:
    kind: OCIRepository
    name: plex-image-cleanup
  interval: 1h
  values:
    defaultPodOptions:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - plex
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      plex-image-cleanup:
        type: cronjob
        cronjob:
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          schedule: "27 6 * * */2"
          successfulJobsHistory: 0
          timeZone: "${CLUSTER_TIMEZONE}"
        containers:
          app:
            image:
              repository: docker.io/meisnate12/plex-image-cleanup
              tag: v1.0.2@sha256:257634cb149f104658079274139bd55d652962ecf331bfda01e71c10686f9e32
            env:
              MODE: remove
              PHOTO_TRANSCODER: true
              PLEX_PATH: "/mnt/plex-config/Library/Application Support/Plex Media Server"
              PLEX_URL: http://plex.media.svc.cluster.local:32400
              TZ: "${CLUSTER_TIMEZONE}"
            envFrom:
              - secretRef:
                  name: plex-image-cleanup-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    persistence:
      config:
        type: emptyDir
        advancedMounts:
          plex-image-cleanup:
            app:
              - path: /config
                subPath: config
              - path: /tmp
                subPath: tmp
      plex-config:
        existingClaim: plex
        advancedMounts:
          plex-image-cleanup:
            app:
              - path: /mnt/plex-config

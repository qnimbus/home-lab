---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-lab-readonly
  namespace: actions-runner-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: flux-system
  values:
    githubConfigUrl: "https://github.com/qnimbus/home-lab"
    githubConfigSecret: home-lab-readonly-runner-secret
    minRunners: 0
    maxRunners: 3
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 10Gi
    controllerServiceAccount:
      namespace: actions-runner-system
      name: actions-runner-controller
    template:
      spec:
        # Explicit, no-RBAC ServiceAccount (see rbac.yaml comment) — required even though it
        # has zero bound permissions, to suppress the chart's auto-RBAC for kube mode.
        serviceAccountName: actions-runner-readonly
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.334.0
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: ANTHROPIC_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: anthropic-readonly-secret
                    key: ANTHROPIC_API_KEY

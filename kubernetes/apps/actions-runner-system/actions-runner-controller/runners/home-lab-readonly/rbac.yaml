---
# No ClusterRoleBinding, no Role/RoleBinding here — this ServiceAccount is intentionally
# bound to nothing. The Renovate-PR-review job only shells out to read-only `gh` CLI calls
# (enforced by claude_args --allowedTools + scripts/pr-reviewer-bash-guard.sh) and never
# touches the Kubernetes API. Explicitly setting template.spec.serviceAccountName in
# helmrelease.yaml is required: leaving it unset lets the gha-runner-scale-set chart
# auto-provision its own namespace-scoped Role (pods/exec/log, jobs, secrets — all with
# create+delete) — see chart templates/kube_mode_role.yaml. That auto-Role would silently
# reintroduce the privilege this split exists to remove.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: actions-runner-readonly
  namespace: actions-runner-system

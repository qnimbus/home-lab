---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-lab
  namespace: actions-runner-system
spec:
  chartRef:
    kind: OCIRepository
    name: home-lab
  interval: 1h
  values:
    containerMode:
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi # revisit if heavier workflow jobs (image builds, large test suites) are added
        storageClassName: openebs-hostpath
      type: kubernetes
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    githubConfigSecret: home-lab-runner-secret
    githubConfigUrl: "https://github.com/qnimbus/home-lab"
    maxRunners: 6
    minRunners: 0
    template:
      spec:
        containers:
          - command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              # talosctl needs a node to target, and any node will do: Spegel (DaemonSet, all 5
              # nodes) is a peer-to-peer pull-through mirror, so whichever node this pod lands on
              # becomes the peer the others fetch the layer from when Flux reconciles. The layer
              # is not replicated — it stays on that one node until another node actually needs it.
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            # renovate: datasource=docker depName=ghcr.io/home-operations/actions-runner
            image: ghcr.io/home-operations/actions-runner:2.337.0
            name: runner
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
        serviceAccountName: actions-runner
        volumes:
          # Populated by Talos itself from talos-serviceaccount.yaml — not 1Password.
          - name: talos
            secret:
              secretName: home-lab

---
# Talos's native Kubernetes-native API access feature (machine.features.kubernetesTalosAPIAccess,
# see talos/patches/controller/machine-features.yaml): Talos watches this CRD and mints a
# matching Secret/home-lab with a short-lived, revocable client cert — no static talosconfig
# secret in 1Password. Only works because actions-runner-system is on that patch's
# allowedKubernetesNamespaces list; os:admin is the requested role because no narrower Talos role
# is confirmed to cover image pull (see docs/ROADMAP.md).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: home-lab
  namespace: actions-runner-system
spec:
  roles:
    - os:admin

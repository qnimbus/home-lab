---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-lab-runner-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-lab-runner-secret
  data:
    - secretKey: github_app_id
      remoteRef:
        key: actions-runner
        property: ACTIONS_RUNNER_APP_ID
    - secretKey: github_app_installation_id
      remoteRef:
        key: actions-runner
        property: ACTIONS_RUNNER_INSTALLATION_ID
    - secretKey: github_app_private_key
      remoteRef:
        key: actions-runner
        property: ACTIONS_RUNNER_PRIVATE_KEY
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: anthropic-secret
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: anthropic
        property: ANTHROPIC_API_KEY

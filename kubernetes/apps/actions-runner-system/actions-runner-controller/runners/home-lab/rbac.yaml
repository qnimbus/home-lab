---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: actions-runner
  namespace: actions-runner-system
---
# cluster-admin is intentional, reserved for future manually-dispatched ops workflows
# (kubectl, talosctl, flux reconcile, etc.) — none exist yet. The only workflow that runs
# today (Renovate PR review) runs on the home-lab-readonly group instead, which has no
# RBAC at all. Do not point an auto-triggered workflow (pull_request/push/schedule) at
# this group — only workflow_dispatch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actions-runner-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: actions-runner
    namespace: actions-runner-system

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: actions-runner
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actions-runner-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: actions-runner
    namespace: actions-runner-system

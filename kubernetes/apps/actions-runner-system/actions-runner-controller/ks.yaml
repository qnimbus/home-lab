---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app actions-runner-controller
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: actions-runner-system
  interval: 1h
  path: ./kubernetes/apps/actions-runner-system/actions-runner-controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actions-runner-home-lab
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  # RunnerScaleSet CRDs don't exist until the controller HelmRelease is healthy.
  # dependsOn blocks the dry-run until ARC registers its CRD types.
  dependsOn:
    - name: actions-runner-controller
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: home-lab
      namespace: actions-runner-system
  interval: 1h
  path: ./kubernetes/apps/actions-runner-system/actions-runner-controller/runners/home-lab
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

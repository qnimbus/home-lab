---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &db-app paperless-ngx-db
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *db-app
  interval: 1h
  path: ./kubernetes/apps/documents/paperless-ngx/db
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword-store
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-ngx
  namespace: flux-system
spec:
  targetNamespace: documents
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    # postgres-scaler + redis-scaler: wired in while paperless-ngx itself is disabled
    # (see ../../kustomization.yaml) — has no live effect until the app is re-enabled.
    # Both target the same Deployment; the driftDetection.ignore rule in
    # app/helmrelease.yaml already covers /spec/replicas generically for any
    # ScaledObject, no per-scaler addition needed there.
    - ../../../../components/keda/postgres-scaler
    - ../../../../components/keda/redis-scaler
  interval: 1h
  path: ./kubernetes/apps/documents/paperless-ngx/app
  postBuild:
    substitute:
      APP: *app
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CLAIM: paperless-ngx-media
      VOLSYNC_CAPACITY: 30Gi
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: paperless-ngx-db
    - name: onepassword-store
    - name: rook-ceph-cluster
    - name: dragonfly
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync

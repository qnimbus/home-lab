---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &db-app paperless-ngx-db
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *db-app
  interval: 1h
  path: ./kubernetes/apps/documents/paperless-ngx/db
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword-store
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-ngx
  namespace: flux-system
spec:
  targetNamespace: documents
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    # No keda/postgres-scaler or keda/redis-scaler Component here: KEDA's admission
    # webhook (vscaledobject.kb.io) forbids more than one ScaledObject managing the
    # same workload ("already managed by the hpa ...") — hit this live when both were
    # wired in at once. paperless-ngx depends on Postgres, Dragonfly, AND SMB (see
    # app/pv.yaml), so it needs all three folded into ONE ScaledObject's single
    # trigger instead — see app/scaledobject.yaml.
  interval: 1h
  path: ./kubernetes/apps/documents/paperless-ngx/app
  postBuild:
    substitute:
      APP: *app
      # VolSync's mover container needs to run as the UID/GID that owns files on the
      # config PVC (1000, matching defaultPodOptions.securityContext) rather than the
      # component's default of 4000, or restic backup/restore hits permission errors.
      APP_UID: "1000"
      APP_GID: "1000"
      VOLSYNC_CLAIM: paperless-ngx-config
      VOLSYNC_CAPACITY: 5Gi
      # Deterministic stagger, not hand-picked — generated by scripts/volsync-schedule.py
      # (task volsync:schedule APP=paperless-ngx), which hashes the app name to avoid the
      # component's :00 default (see docs/ROADMAP.md's e1000e packet-drops entry,
      # 2026-09-01, for why unstaggered hourly backups are a real risk). Run
      # `task volsync:check-schedules` after adding/renaming any volsync-backed app.
      VOLSYNC_SCHEDULE: "5 * * * *"
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: paperless-ngx-db
    - name: onepassword-store
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: dragonfly
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync
      namespace: system
    # pv.yaml's nodeStageSecretRef points at the smb-credentials Secret ESO creates
    # asynchronously in the system namespace — wait: true there guarantees it's
    # Ready before this Kustomization's Pod tries to mount the SMB PVCs.
    - name: csi-driver-smb
      namespace: system

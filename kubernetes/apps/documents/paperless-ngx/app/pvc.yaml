---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}-smb-archive
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2T
  # Explicit binding to the static PV above — storageClassName must still match (it's
  # compared even when volumeName is set) even though no "smb" StorageClass object exists.
  volumeName: ${APP}-smb-archive
  storageClassName: smb
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}-smb-backup
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2T
  volumeName: ${APP}-smb-backup
  storageClassName: smb

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-secret
    template:
      engineVersion: v2
      data:
        PAPERLESS_DBUSER: "{{ .DB_USER }}"
        PAPERLESS_DBPASS: "{{ .DB_PASSWORD }}"
        PAPERLESS_SECRET_KEY: "{{ .SECRET_KEY }}"
        PAPERLESS_ADMIN_USER: "{{ .ADMIN_USER }}"
        PAPERLESS_ADMIN_MAIL: "{{ .ADMIN_MAIL }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        # Dragonfly is a cluster-wide shared instance (kubernetes/apps/database/dragonfly);
        # paperless-ngx is its first named consumer, using db index 0 — future consumers
        # should pick the next unused index to avoid key collisions.
        PAPERLESS_REDIS: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/0"
  dataFrom:
    - extract:
        key: paperless
    - extract:
        key: dragonfly
      rewrite:
        - regexp:
            source: (.*)
            target: DRAGONFLY_$1

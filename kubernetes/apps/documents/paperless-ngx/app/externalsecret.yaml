---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-secret
    template:
      engineVersion: v2
      data:
        PAPERLESS_DBUSER: "{{ .PAPERLESS_DB_USER }}"
        PAPERLESS_DBPASS: "{{ .PAPERLESS_DB_PASSWORD }}"
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_MAIL: "{{ .PAPERLESS_ADMIN_MAIL }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        # Dragonfly is a cluster-wide shared instance (kubernetes/apps/database/dragonfly);
        # paperless-ngx is its first named consumer, using db index 0 — future consumers
        # should pick the next unused index to avoid key collisions.
        # Password piped through `urlquery` (Sprig, available in ESO's v2 template engine):
        # an un-encoded password containing "#" (URI fragment delimiter) or "@" truncates
        # or misparses this URL - confirmed live via the identical pattern in open-webui's
        # externalsecret.yaml, which crash-looped on exactly this with the current Dragonfly
        # password. paperless-ngx hasn't been observed to crash on it (Django's redis backend
        # appears more tolerant/lazier than open-webui's eager async client), but it's the
        # same latent bug against the same shared, rotatable password - fixed pre-emptively.
        PAPERLESS_REDIS: "redis://:{{ .DRAGONFLY_PASSWORD | urlquery }}@dragonfly.database.svc.cluster.local:6379/0"
  dataFrom:
    - extract:
        key: paperless
      rewrite:
        - regexp:
            source: (.*)
            target: PAPERLESS_$1
    - extract:
        key: dragonfly
      rewrite:
        - regexp:
            source: (.*)
            target: DRAGONFLY_$1

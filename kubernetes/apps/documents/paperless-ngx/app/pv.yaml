---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/persistentvolume.json
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  name: ${APP}-smb-archive
spec:
  capacity:
    storage: 2T
  accessModes:
    - ReadWriteMany
  # Static SMB binding, not a StorageClass-driven provisioner — Retain so deleting the
  # PVC (or the whole app) never deletes documents sitting on the NAS share.
  persistentVolumeReclaimPolicy: Retain
  # No "smb" StorageClass object exists in-cluster (csi-driver-smb is deliberately
  # driver-only, see kubernetes/apps/system/csi-driver-smb/app/helmrelease.yaml) — this
  # is just a matching label the PVC below must repeat for static binding to succeed.
  storageClassName: smb
  mountOptions:
    - noperm
  csi:
    driver: smb.csi.k8s.io
    # volumeHandle format: {smb-server-address}#{sub-dir-name}#{share-name}
    # make sure this value is unique for every share in the cluster
    volumeHandle: ${APP}-smb-archive
    volumeAttributes:
      source: //${NAS_HOST}/Archive
    nodeStageSecretRef:
      name: smb-credentials
      namespace: csi-driver-smb
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/persistentvolume.json
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  name: ${APP}-smb-backup
spec:
  capacity:
    storage: 2T
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb
  mountOptions:
    - noperm
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: ${APP}-smb-backup
    volumeAttributes:
      source: //${NAS_HOST}/Backup
    nodeStageSecretRef:
      name: smb-credentials
      namespace: csi-driver-smb

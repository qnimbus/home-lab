---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
spec:
  interval: 1h
  # KEDA (scaledobject.yaml) scales this Deployment's replicas directly; without
  # this, Flux's drift detection reverts it back to the chart's desired replica
  # count on the next reconcile/drift check, undoing scale-to-zero within the hour.
  driftDetection:
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      # First multi-container controller in this repo: gotenberg/tika are tightly-coupled
      # sidecars talking to `app` over localhost (no separate Service/Kustomization needed),
      # mirroring the vaskozl/home-infra community pattern researched for this deployment.
      paperless-ngx:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              # renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
              tag: "3.0.3"
            env:
              PAPERLESS_DBHOST: ${PG_HOST}
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: paperless
              PAPERLESS_TIKA_ENABLED: "1"
              PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
              PAPERLESS_URL: "https://paperless.${DOMAIN_CLUSTER}"
              PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://paperless.${DOMAIN_CLUSTER}"
              PAPERLESS_TRUSTED_PROXIES: "**"
              PAPERLESS_TIME_ZONE: ${CLUSTER_TIMEZONE}
              PAPERLESS_OCR_LANGUAGE: nld
              PAPERLESS_OCR_LANGUAGES: nld
              PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
              PAPERLESS_DATA_DIR: /usr/src/paperless/data
              PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
              PAPERLESS_EXPORT_DIR: /usr/src/paperless/export
              # The image's s6-overlay entrypoint must start as root: PAPERLESS_OCR_LANGUAGES
              # triggers a runtime `apt-get install tesseract-ocr-nld`, and it also chowns the
              # mounted volumes - both fail silently as non-root (confirmed live: container
              # crash-looped with "Unable to install language tesseract-ocr-nld as non-root").
              # USERMAP_UID/GID is the image's documented mechanism to drop root privileges to
              # this UID/GID for the actual gunicorn/celery processes after that init work is
              # done - see containers.app.securityContext below for the matching root override.
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
            envFrom:
              - secretRef:
                  name: paperless-secret
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # First boot runs DB migrations + search-index build, which can take a
                  # while - generous budget so the pod isn't killed mid-migration.
                  failureThreshold: 60
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                # 3Gi OOMKilled during document_importer restore: Django's JSON
                # deserializer loads the whole manifest into memory at once (no
                # streaming), and a real-world manifest.json can run 500Mi+ on top
                # of the ~512Mi gunicorn/celery baseline already resident here.
                memory: 10Gi
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              # renovate: datasource=docker depName=docker.io/gotenberg/gotenberg
              tag: "8.34.0"
            args:
              - "gotenberg"
              - "--chromium-disable-javascript=true"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          tika:
            image:
              repository: docker.io/apache/tika
              # renovate: datasource=docker depName=docker.io/apache/tika
              tag: "3.3.1.0"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: paperless-ngx
        ports:
          http:
            port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /usr/src/paperless/data
      # The document archive - the only irreplaceable data here, so it's the only volume
      # backed by VolSync. existingClaim ties this directly to the PVC that
      # components/volsync's pvc.yaml/replicationsource.yaml create and back up (named via
      # ks.yaml's postBuild.substitute.VOLSYNC_CLAIM), rather than relying on this
      # persistence key happening to produce a matching PVC name.
      media:
        existingClaim: "${VOLSYNC_CLAIM:=paperless-ngx}"
        globalMounts:
          - path: /usr/src/paperless/media
      export:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /usr/src/paperless/export
      consume:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /usr/src/paperless/consume

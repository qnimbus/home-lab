---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/http.keda.sh/interceptorroute_v1beta1.json
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: pgadmin
spec:
  target:
    service: pgadmin
    port: 5050
  rules:
    - hosts:
        - "pgadmin.${DOMAIN_CLUSTER}"
  # requestRate, not concurrency: Increase() bumps both an in-flight gauge
  # (concurrency) and a separate monotonic request counter (requestRate is
  # a delta of that counter between polls). coldStart.placeholder serves in
  # microseconds, so the concurrency gauge is back at 0 before the scaler's
  # 200ms poll ever samples it — scale-up never fires. requestRate's delta
  # survives that, since the monotonic counter doesn't un-increment when the
  # request finishes. Verified live (2026-07-10): a single placeholder-served
  # request from a fully idle state (503, ~5ms) triggered Active=True within
  # seconds and a Ready pod at ~35s. See docs/QA.md for the full trace.
  scalingMetric:
    requestRate:
      targetValue: 1
  coldStart:
    placeholder:
      response:
        statusCode: 503
        headers:
          Content-Type: text/html; charset=utf-8
        body: |
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Starting pgAdmin…</title>
            <meta http-equiv="refresh" content="3">
            <style>
              body { font-family: system-ui, sans-serif; display: flex; align-items: center;
                     justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
              .card { text-align: center; }
              h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
              p { color: #94a3b8; margin: 0; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Starting pgAdmin…</h1>
              <p>Scaled down while idle — this page refreshes automatically.</p>
            </div>
          </body>
          </html>

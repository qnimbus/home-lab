---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pgadmin
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/keda/http-scaler
    - ../../../../components/volsync
  interval: 1h
  path: ./kubernetes/apps/database/pgadmin/app
  postBuild:
    substitute:
      APP: *app
      APP_UID: "5050"
      APP_GID: "5050"
      VOLSYNC_CAPACITY: 2Gi
      # Deterministic stagger, not hand-picked — generated by scripts/volsync-schedule.py
      # (task volsync:schedule APP=pgadmin), which hashes the app name to avoid the
      # component's :00 default (see docs/ROADMAP.md's e1000e packet-drops entry,
      # 2026-09-01, for why unstaggered hourly backups are a real risk). Run
      # `task volsync:check-schedules` after adding/renaming any volsync-backed app.
      VOLSYNC_SCHEDULE: "54 * * * *"
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
    - name: onepassword-store
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # InterceptorRoute/ScaledObject CRDs don't exist until the add-on's
    # operator installs them — see bootstrap-ordering rule in CLAUDE.md.
    - name: keda-add-ons-http
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  # renovate: datasource=docker depName=ghcr.io/dragonflydb/dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0@sha256:7426fdb31ddcf7bd9499b4205f36ebaa83b26149ba1609a0d5f8f474b3631233
  replicas: 3
  # Explicit thread count, paired with resources.limits.cpu below: without a CPU
  # limit, Dragonfly auto-detects the proactor thread count from the host's full
  # core count (sched_getaffinity), not the container's cgroup quota. On cp-01
  # (32-core AMD) this produced "32 threads, so 8.00GiB are required. Exiting"
  # (Dragonfly hard-requires ~256MiB per thread) against a 768Mi memory limit —
  # a CrashLoopBackOff observed live after the first deploy. Pinning both the
  # thread count and a matching CPU limit makes startup memory requirements
  # deterministic regardless of which node a replica lands on.
  args:
    - --proactor_threads=2
  authentication:
    passwordFromSecret:
      name: dragonfly-secret
      key: password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 768Mi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: dragonfly
  # Disabled: the operator's default (true) auto-creates a NetworkPolicy that
  # restricts the redis port (6379) to same-namespace pods only. This instance is
  # meant to be a cluster-wide/multi-tenant service (future consumers land in other
  # namespaces, e.g. a paused paperless-ngx plan in `documents`) — leaving the
  # operator's namespace-scoped default enabled would silently block every
  # cross-namespace consumer. This repo has no NetworkPolicy resources elsewhere by
  # design; revisit if that changes, replacing this with an explicit allow-list of
  # consumer namespaces instead of leaving ingress fully open.
  networkPolicyEnabled: false

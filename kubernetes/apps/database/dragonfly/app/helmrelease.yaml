---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  interval: 1h
  values:
    manager:
      image:
        repository: ghcr.io/dragonflydb/operator
    grafanaDashboard:
      enabled: true
      grafanaOperator:
        enabled: true
        # Chart default selects `dashboards: grafana` (bykaj's Grafana label), not ours.
        matchLabels:
          grafana.internal/instance: grafana
      folder: database

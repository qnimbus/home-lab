---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-v17-scheduledbackup-rules
spec:
  groups:
    - name: postgres-v17-scheduledbackup.rules
      rules:
        - alert: PostgresScheduledBackupMissed
          # Dead man's switch for the barman-cloud plugin backup path (ScheduledBackup/postgres-v17
          # -> S3/B2), independent of the postgres-backup-local pg_dumpall->NFS CronJob and its own
          # PostgresBackupMissed alert. Deliberately NOT using cnpg_collector_last_available_backup_timestamp:
          # that legacy collector metric is never populated when backups run via a CNPG-I plugin
          # (stuck at 0 - see cloudnative-pg/plugin-barman-cloud#380), which would make this fire
          # permanently. barman_cloud_cloudnative_pg_io_last_available_backup_timestamp is the
          # plugin's own exporter metric and tracks real backup state. Aggregated with max() since
          # every instance pod (primary + replicas) exports an identical cluster-wide value - without
          # it a lagging replica's exporter would fire a spurious duplicate alert.
          expr: |
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", job="database/postgres-v17"})
            or (time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", job="database/postgres-v17"})) > 90000
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: CNPG barman-cloud S3/B2 backup for postgres-v17 has not succeeded in over 25 hours.
        - alert: PostgresScheduledBackupFailed
          # Fires when the most recent failed backup attempt is newer than the most recent successful
          # one - i.e. a backup has failed since the last good backup. Self-resolves once the next
          # scheduled run succeeds. Pattern per CNPG barman-cloud plugin docs:
          # https://cloudnative-pg.io/plugin-barman-cloud/docs/next/observability/
          expr: |
            max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="database", job="database/postgres-v17"})
            > max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", job="database/postgres-v17"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A CNPG barman-cloud S3/B2 backup attempt for postgres-v17 has failed.

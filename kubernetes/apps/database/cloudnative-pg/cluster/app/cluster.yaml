---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-v17
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  ## --- DISASTER RECOVERY ---
  ## spec.bootstrap is only consulted by CNPG once, the moment this Cluster object is
  ## first created. It's omitted today, so a from-scratch reset (Talos wipe + fresh
  ## `just bootstrap`) creates an EMPTY database via the implicit `initdb` default —
  ## the WAL archive + base backups in `cloudnative-pg-backup` exist but are never
  ## consulted unless this is set BEFORE the Cluster object is (re)created.
  ##
  ## To recover from the most recent S3 backup after a full reset:
  ##   1. Find the last serverName this cluster archived under: `git log -p --
  ##      kubernetes/apps/database/cloudnative-pg/ks.yaml` and read the last
  ##      `CNPG_V17_CURRENT_CLUSTER` value (e.g. "postgres-v17-20260618") —
  ##      or run `just cnpg restore-from-backup`, which finds it automatically.
  ##   2. Uncomment `bootstrap.recovery` and `externalClusters` below, setting
  ##      `serverName` to that value.
  ##   3. Commit and let Flux (re)create the Cluster with this config — barman-cloud
  ##      restore runs automatically: pulls the base backup, replays WAL to latest.
  ##   4. Once healthy, re-comment both blocks (harmless to leave live, but keeps this
  ##      file matching steady-state so the next reset doesn't need archaeology).
  ##
  ## A new serverName is minted every time CNPG_V17_CURRENT_CLUSTER changes (see
  ## ks.yaml), so the recovered cluster's own WAL archiver never collides with the
  ## prefix it just restored from — no S3 folder renaming needed.
  # bootstrap:
  #   recovery:
  #     source: postgres-v17-source
  # externalClusters:
  #   - name: postgres-v17-source
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: cloudnative-pg-backup
  #         serverName: postgres-v17-20260618 # REPLACE with last-known CNPG_V17_CURRENT_CLUSTER
  affinity:
    podAntiAffinityType: required
  # Ref: https://github.com/cloudnative-pg/cloudnative-pg/issues/2570
  enablePDB: false
  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-secret
  managed:
    roles:
      - name: firefly
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: firefly-db-secret
  monitoring:
    enablePodMonitor: true
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: cloudnative-pg-backup
        serverName: ${CNPG_V17_CURRENT_CLUSTER}
  postgresql:
    parameters:
      # Forces a WAL switch every 5m even on light write volume, bounding the
      # barman-cloud archiving gap. Default is 0 (disabled) - segments only
      # archive once full (16MB), which on a quiet cluster could leave far
      # more than 5m of data unprotected between uploads.
      archive_timeout: 5min
      max_connections: "300"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      shared_buffers: 512MB
    synchronous:
      method: any
      number: 1
  primaryUpdateStrategy: unsupervised
  replicationSlots:
    highAvailability:
      enabled: true
    updateInterval: 30
  resources:
    requests:
      cpu: 80m
      memory: 768Mi
    limits:
      memory: 2Gi
  storage:
    size: 20Gi
    storageClass: openebs-hostpath

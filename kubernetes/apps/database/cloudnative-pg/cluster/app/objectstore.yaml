---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cloudnative-pg-backup
spec:
  configuration:
    destinationPath: "s3://vwn-io-cluster-cnpg"
    endpointURL: "https://s3.us-west-001.backblazeb2.com"
    # Server-side only: tells B2 to encrypt at rest with its own managed keys.
    # barman-cloud has no client-side encryption path, so this does not restore
    # the no-custodian-can-decrypt property Storj had - Backblaze can still
    # technically decrypt these backups.
    data:
      compression: bzip2
      encryption: AES256
    wal:
      compression: bzip2
      maxParallel: 8
      encryption: AES256
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg-secret
        key: CNPG_S3_ACCESS_KEY
      secretAccessKey:
        name: cloudnative-pg-secret
        key: CNPG_S3_SECRET_KEY
  instanceSidecarConfiguration:
    # Several non-AWS S3-compatible providers reject PutObject requests using
    # botocore's newer chunked-trailer checksum encoding (no Content-Length
    # header) with "MissingContentLength" - revert to the legacy header-based
    # behaviour. Kept as a safe default across providers (Storj needed this).
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  retentionPolicy: 30d

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cloudnative-pg-backup
spec:
  configuration:
    destinationPath: "s3://vwn.io-cluster-cnpg/"
    endpointURL: "https://s3.us-west-001.backblazeb2.com"
    # Server-side only: tells B2 to encrypt at rest with its own managed keys.
    # barman-cloud has no client-side encryption path, so this does not restore
    # the no-custodian-can-decrypt property Storj had - Backblaze can still
    # technically decrypt these backups.
    data:
      compression: bzip2
      encryption: AES256
    wal:
      compression: bzip2
      maxParallel: 1
      encryption: AES256
    s3Credentials:
      # Set for when cloudnative-pg/cloudnative-pg#9724 is fixed upstream - this
      # key is currently silently ignored, see AWS_DEFAULT_REGION below for the
      # actual fix.
      region: us-west-001
      accessKeyId:
        name: cloudnative-pg-secret
        key: CNPG_S3_ACCESS_KEY
      secretAccessKey:
        name: cloudnative-pg-secret
        key: CNPG_S3_SECRET_KEY
  instanceSidecarConfiguration:
    # Several non-AWS S3-compatible providers reject PutObject requests using
    # botocore's newer chunked-trailer checksum encoding with "MissingContentLength"
    # (Storj) or "IncompleteBody: request body was too small" (B2) - revert to
    # the legacy header-based behaviour. Confirmed required for both providers;
    # see cloudnative-pg/cloudnative-pg#7105 for the B2 case (maxParallel: 1 +
    # trailing-slash destinationPath were also needed there).
    #
    # AWS_DEFAULT_REGION works around cloudnative-pg/cloudnative-pg#9724:
    # s3Credentials.region above is not actually wired to the barman sidecar's
    # env, so requests sign with the us-east-1 default and B2 rejects them with
    # SignatureDoesNotMatch.
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_DEFAULT_REGION
        value: us-west-001
  retentionPolicy: 30d

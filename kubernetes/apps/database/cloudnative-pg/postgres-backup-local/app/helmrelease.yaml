---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postgres-backup-local
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      postgres-backup-local:
        type: cronjob
        cronjob:
          schedule: "@daily"
          timeZone: "${CLUSTER_TIMEZONE}"
          concurrencyPolicy: Forbid
          # NAS temporarily offline 2026-06-24 — pauses the daily pg_dumpall
          # job from hanging on the NFS mount.
          suspend: false
          ttlSecondsAfterFinished: 43200
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: docker.io/prodrigestivill/postgres-backup-local
              # renovate: datasource=docker depName=docker.io/prodrigestivill/postgres-backup-local
              tag: "17"
            command: ["/backup.sh"]
            env:
              POSTGRES_HOST: "${PG_HOST}"
              POSTGRES_PORT: "5432"
              POSTGRES_CLUSTER: "TRUE"
              POSTGRES_DB: postgres
              SCHEDULE: "@daily"
              BACKUP_DIR: /backups
              BACKUP_KEEP_DAYS: "7"
              BACKUP_KEEP_WEEKS: "4"
              BACKUP_KEEP_MONTHS: "6"
              BACKUP_KEEP_MINS: "7200"
              BACKUP_LATEST_TYPE: symlink
              POSTGRES_EXTRA_OPTS: "-c --if-exists"
              HEALTHCHECK_PORT: "8080"
              TZ: "${CLUSTER_TIMEZONE}"
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: password
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 7200
                  periodSeconds: 60
                  failureThreshold: 1
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsUser: 4000
        runAsGroup: 4000
        runAsNonRoot: true
        fsGroup: 4000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      backups:
        type: nfs
        server: "${NAS_HOST}"
        path: /mnt/tank/Cluster/cloudnative-pg
        globalMounts:
          - path: /backups

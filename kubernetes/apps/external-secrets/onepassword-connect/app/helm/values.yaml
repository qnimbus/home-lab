---
connect:
  serviceType: ClusterIP
  credentialsName: onepassword-connect-secrets
  credentialsKey: 1password-credentials.json
  api:
    resources:
      requests:
        cpu: 30m
        memory: 100Mi
      limits:
        memory: 100Mi
    # Default "info" logs every request, including the readiness (10s) and
    # liveness (30s) probes hitting both replicas — the dominant source of this
    # namespace's log volume. "warn" keeps real failures (auth errors, upstream
    # errors) visible while dropping routine successful-request access logs.
    logLevel: warn
  sync:
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
    logLevel: warn

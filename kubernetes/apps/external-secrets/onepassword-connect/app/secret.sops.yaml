---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.1-standalone-strict/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-connect-secrets
# IMPORTANT: fill in the two values below, then encrypt this file before committing:
#   sops --encrypt --in-place kubernetes/apps/external-secrets/onepassword-connect/app/secret.sops.yaml
#
# 1password-credentials.json: paste the raw JSON content from the 1Password Connect
#   server credentials file (downloaded when creating the Connect server at
#   https://start.1password.com/integrations/active or via the Connect SDK).
#
# token: the Connect API access token created for this cluster
#   (scoped to the Kubernetes vault).
stringData:
  1password-credentials.json: PLACEHOLDER_PASTE_RAW_JSON_CONTENT_HERE
  token: PLACEHOLDER_CONNECT_API_TOKEN

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tuppr
spec:
  targetNamespace: system-upgrade
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system-upgrade/tuppr/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: system-upgrade
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tuppr-upgrade
spec:
  targetNamespace: system-upgrade
  dependsOn:
    - name: tuppr
      namespace: system-upgrade
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system-upgrade/tuppr/upgrade
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-upgrade
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: tuppr
  # Wait for the tuppr HelmRelease to be healthy before applying CRD instances.
  # TalosUpgrade and KubernetesUpgrade don't exist in the API until the chart installs them.
  dependsOn:
    - name: tuppr
      namespace: flux-system
  wait: true
  prune: true
  interval: 1h
  timeout: 5m
  retryInterval: 2m
  path: ./kubernetes/apps/system-upgrade/tuppr/upgrade
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

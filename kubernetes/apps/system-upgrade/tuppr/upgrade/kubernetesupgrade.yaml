---
# Only one KubernetesUpgrade resource is allowed per cluster (enforced by tuppr's admission webhook).
# Edit spec.kubernetes.version to trigger an upgrade; do not create a second resource.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
  namespace: system-upgrade
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.36.4
  # Backup gate: tuppr re-checks these every 10s before the upgrade and only proceeds once
  # all pass. Empty namespace = every namespace. No kopiur backup may be mid-run (a
  # Snapshot without a status yet counts as not passed, so a just-started one blocks
  # too) and no Restore may be filling a volume. The run gives up after the longest
  # check timeout (default 10m); 30m leaves room for a large first backup.
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      description: no kopiur backup is running
      expr: status.phase != 'Running'
      timeout: 30m
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      description: no kopiur restore is running
      expr: "!(status.phase in ['Resolving', 'Restoring'])"

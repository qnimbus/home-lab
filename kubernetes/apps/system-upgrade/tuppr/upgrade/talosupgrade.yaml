---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
  namespace: system-upgrade
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.10.9
  policy:
    rebootMode: default
  # Upgrade one node at a time; safe default for a 3-node control-plane-only cluster
  # where losing two nodes simultaneously would break etcd quorum
  parallelism: 1

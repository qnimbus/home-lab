---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tuppr-pending-rules
  namespace: system-upgrade
spec:
  groups:
    - name: tuppr-pending.rules
      rules:
        - alert: TalosUpgradePending
          expr: |-
            tuppr_talos_upgrade_phase{phase="Pending"} == 1
              unless on() (tuppr_kubernetes_upgrade_phase{phase=~"Upgrading|HealthChecking"} == 1)
          for: 15m
          annotations:
            summary: >-
              TalosUpgrade has been Pending for 15m — the run is not progressing.
              Check `kubectl get talosupgrade cluster -n system-upgrade -o jsonpath='{.status.message}'`;
              a schematic or install-image mismatch parks the run here before any node is touched.
          labels:
            severity: warning

        - alert: KubernetesUpgradePending
          expr: |-
            tuppr_kubernetes_upgrade_phase{phase="Pending"} == 1
              unless on() (tuppr_talos_upgrade_phase{phase=~"Pending|Draining|Upgrading|Rebooting|HealthChecking"} == 1)
          for: 15m
          annotations:
            summary: >-
              KubernetesUpgrade has been Pending for 15m — the run is not progressing.
              Check `kubectl get kubernetesupgrade kubernetes -n system-upgrade -o jsonpath='{.status.message}'`.
          labels:
            severity: warning

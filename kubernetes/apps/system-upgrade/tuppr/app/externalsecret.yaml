---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuppr-notification
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tuppr-notification-secret
    template:
      engineVersion: v2
      data:
        # apprise-go's Pushover scheme is pover://<user-key>@<api-token> — verified against
        # internal/notify/pushover.go, which reads the user key from the URL userinfo and the
        # token from the host (secure_protocols: ["pover"]).
        #
        # Deliberately reuses the same 1Password `alertmanager` item that Alertmanager itself
        # consumes, so enabling tuppr notifications needed no new vault entry. The coupling is the
        # cost: rotating those Pushover credentials re-renders this Secret too, and tuppr can only
        # ever notify wherever Alertmanager does. Split into a dedicated item if that changes.
        url: "pover://{{ .ALERTMANAGER_PUSHOVER_USER_KEY }}@{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
  dataFrom:
    - extract:
        key: alertmanager
      rewrite:
        - regexp:
            source: (.*)
            target: ALERTMANAGER_$1

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-prometheus-stack-prometheus
  annotations:
    gethomepage.dev/description: "Metrics & alerting rules"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "mdi-fire"
    gethomepage.dev/name: "Prometheus"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=prometheus"
spec:
  hostnames:
    - "prometheus.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-prometheus-stack-alertmanager
  annotations:
    gethomepage.dev/description: "Alert routing & silences"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "mdi-bell-alert"
    gethomepage.dev/name: "Alertmanager"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=alertmanager"
spec:
  hostnames:
    - "alertmanager.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093

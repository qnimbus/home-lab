---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: doco-cd
spec:
  groups:
    - name: doco-cd.reconciliation
      rules:
        - alert: DocoCdPollFailing
          annotations:
            description: >-
              doco-cd has recorded {{ $value | printf "%.0f" }} failed poll(s) in the last
              30m for {{ $labels.repository }}. The docker/nas/ compose stacks are not being
              reconciled from Git. A recurring cause is a corrupted cached clone
              ("ref file is empty"): stop doco-cd, delete the cached clone under /data in the
              doco-cd_data volume, and start it again; the next poll re-clones.

            summary: doco-cd polling is failing for {{ $labels.repository }}
          expr: |
            increase(doco_cd_poll_errors_total[30m]) > 0
          for: 15m
          labels:
            severity: warning
        - alert: DocoCdNotReconciling
          annotations:
            description: >-
              No successful doco-cd poll for {{ $labels.repository }} in the last hour
              (expected roughly every 8m20s). Compose stacks on TrueNAS are drifting from
              Git with no agent applying changes.

            summary: doco-cd has not completed a successful poll in an hour
          expr: |
            increase(doco_cd_polls_total[1h]) == 0
          for: 15m
          labels:
            severity: warning
        - alert: DocoCdRestartLoop
          annotations:
            description: >-
              doco-cd restarted {{ $value | printf "%.0f" }} times in the last hour.
              Check `docker logs doco-cd` for a Go runtime fault — a crash landing
              mid-git-fetch is what corrupts its clone cache and wedges reconciliation.
            summary: doco-cd is restarting repeatedly
          expr: |
            changes(process_start_time_seconds{job="truenas-doco-cd"}[1h]) > 3
          for: 10m
          labels:
            severity: warning

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oom
  namespace: observability
spec:
  groups:
    - name: oom
      rules:
        # A restart in the last 10m whose last termination reason was OOMKilled.
        - alert: OomKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            # warning, not critical: critical routes to pushover-critical (emergency, repeats
            # until acknowledged) — an OOM kill is worth a push, not a page.
            severity: warning

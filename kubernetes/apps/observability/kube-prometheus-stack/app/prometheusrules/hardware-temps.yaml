---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hardware-temperatures
spec:
  groups:
    - name: hardware.temperatures
      rules:
        - alert: NodeCpuTemperatureWarning
          expr: |
            node_hwmon_temp_celsius{chip=~"platform_coretemp_0|pci0000:00_0000:00:18_3", sensor="temp1"} > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            description: >-
              CPU temperature is {{ $value | printf "%.0f" }}°C on {{ $labels.instance }} (chip: {{ $labels.chip }}). Normal range < 80°C. AMD Tctl includes a +10°C offset over actual die temp.
            summary: High CPU temperature on {{ $labels.instance }}
        - alert: NodeCpuTemperatureCritical
          expr: |
            node_hwmon_temp_celsius{chip=~"platform_coretemp_0|pci0000:00_0000:00:18_3", sensor="temp1"} > 90
          for: 2m
          labels:
            severity: critical
          annotations:
            description: >-
              CPU temperature is {{ $value | printf "%.0f" }}°C on {{ $labels.instance }} (chip: {{ $labels.chip }}). Immediate attention required.
            summary: Critical CPU temperature on {{ $labels.instance }}
        - alert: NodeNvmeTemperatureWarning
          expr: |
            (
              node_hwmon_temp_celsius{chip=~"nvme_.+", sensor="temp1"}
              >= on (instance, chip, sensor)
              (node_hwmon_temp_max_celsius{chip=~"nvme_.+", sensor="temp1"} - 2)
            )
            * on (instance, chip) group_left (model, serial)
              label_replace(node_nvme_info, "chip", "nvme_$1", "device", "(.+)")
            * on (instance) group_left (nodename) node_uname_info
          for: 5m
          labels:
            severity: warning
          annotations:
            description: >-
              {{ $labels.model }} ({{ $labels.chip }}) on {{ $labels.nodename }} is at {{ $value | printf "%.0f" }}°C, within 2°C of the drive's own warning threshold.
            summary: High NVMe temperature on {{ $labels.nodename }}
        - alert: NodeNvmeTemperatureCritical
          expr: |
            (
              node_hwmon_temp_celsius{chip=~"nvme_.+", sensor="temp1"}
              >= on (instance, chip, sensor)
              node_hwmon_temp_max_celsius{chip=~"nvme_.+", sensor="temp1"}
            )
            * on (instance, chip) group_left (model, serial)
              label_replace(node_nvme_info, "chip", "nvme_$1", "device", "(.+)")
            * on (instance) group_left (nodename) node_uname_info
          for: 1m
          labels:
            severity: critical
          annotations:
            description: >-
              {{ $labels.model }} ({{ $labels.chip }}) on {{ $labels.nodename }} is at {{ $value | printf "%.0f" }}°C, at or above the drive's own warning threshold. The drive may throttle or refuse I/O.
            summary: Critical NVMe temperature on {{ $labels.nodename }}

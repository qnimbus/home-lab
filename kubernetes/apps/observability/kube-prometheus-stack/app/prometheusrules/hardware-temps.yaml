---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hardware-temperatures
spec:
  groups:
    - name: hardware.temperatures
      rules:
        - alert: NodeCpuTemperatureWarning
          annotations:
            description: >-
              CPU temperature is {{ $value | printf "%.0f" }}°C on {{ $labels.instance }} (chip: {{ $labels.chip }}). Normal range < 80°C. AMD Tctl includes a +10°C offset over actual die temp.
            summary: High CPU temperature on {{ $labels.instance }}
          expr: |
            node_hwmon_temp_celsius{chip=~"platform_coretemp_0|pci0000:00_0000:00:18_3", sensor="temp1"} > 80
          for: 5m
          labels:
            severity: warning
        - alert: NodeCpuTemperatureCritical
          annotations:
            description: >-
              CPU temperature is {{ $value | printf "%.0f" }}°C on {{ $labels.instance }} (chip: {{ $labels.chip }}). Immediate attention required.
            summary: Critical CPU temperature on {{ $labels.instance }}
          expr: |
            node_hwmon_temp_celsius{chip=~"platform_coretemp_0|pci0000:00_0000:00:18_3", sensor="temp1"} > 90
          for: 2m
          labels:
            severity: critical
        - alert: NodeNvmeTemperatureWarning
          annotations:
            description: >-
              NVMe composite temperature is {{ $value | printf "%.0f" }}°C on {{ $labels.instance }} (chip: {{ $labels.chip }}).
            summary: High NVMe temperature on {{ $labels.instance }}
          expr: |
            node_hwmon_temp_celsius{chip=~"nvme.*", sensor="temp1"} > 65
          for: 5m
          labels:
            severity: warning
        - alert: NodeNvmeTemperatureCritical
          annotations:
            description: >-
              NVMe composite temperature is {{ $value | printf "%.0f" }}°C on {{ $labels.instance }} (chip: {{ $labels.chip }}).
            summary: Critical NVMe temperature on {{ $labels.instance }}
          expr: |
            node_hwmon_temp_celsius{chip=~"nvme.*", sensor="temp1"} > 75
          for: 2m
          labels:
            severity: critical
        - alert: NodeHwmonTextfileStale
          annotations:
            description: >-
              node-exporter hasn't seen a fresh hwmon.prom from the sensors-textfile sidecar in over 90s on {{ $labels.instance }} — the CPU/NVMe temperature alerts above are now evaluating against frozen data. Check the sensors-textfile container.
            summary: hwmon textfile-collector data is stale on {{ $labels.instance }}
          expr: |
            time() - node_textfile_mtime_seconds{file="/textfile/hwmon.prom"} > 90
          for: 1m
          labels:
            severity: warning

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  # Suspended for the Longhorn→Rook-Ceph storage migration: Longhorn PVC(s) backed
  # up + deleted, no replicated storageClass exists yet. Phase 5 un-suspends this
  # and switches persistence to ceph-block.
  suspend: true
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: flux-system
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values

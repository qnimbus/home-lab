---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  # Overrides the cluster-apps global default of 10m: chart installs ~40 CRDs, two StatefulSets
  # with Longhorn PVC provisioning, and a node-exporter DaemonSet — Helm --wait needs extra time.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: flux-system
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          matchType: "="
          value: critical
      targetMatch:
        - name: severity
          matchType: "="
          value: warning
  receivers:
    - name: "null"
    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- if gt (len .Alerts) 3 }}
            Showing 3 of {{ len .Alerts }} alerts in this group:
            {{- end }}
            {{- range $i, $alert := .Alerts }}
              {{- if lt $i 3 }}
                {{- if ne $alert.Annotations.description "" }}
            {{ $alert.Annotations.description }}
                {{- else if ne $alert.Annotations.summary "" }}
            {{ $alert.Annotations.summary }}
                {{- else if ne $alert.Annotations.message "" }}
            {{ $alert.Annotations.message }}
                {{- else }}
            Alert description not available
                {{- end }}
                {{- if gt (len $alert.Labels.SortedPairs) 0 }}
            <small>{{ range $alert.Labels.SortedPairs }}<b>{{ .Name }}:</b> {{ .Value }} {{ end }}</small>
                {{- end }}
              {{- end }}
            {{- end }}
          priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
          sendResolved: true
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          token:
            key: PUSHOVER_TOKEN
            name: alertmanager-secret
          url: "https://alertmanager.${DOMAIN_CLUSTER}"
          urlTitle: View in Alertmanager
          userKey:
            key: PUSHOVER_USER_KEY
            name: alertmanager-secret
    - name: pushover-critical
      pushoverConfigs:
        - expire: 1h
          html: true
          message: |-
            {{- if gt (len .Alerts) 3 }}
            Showing 3 of {{ len .Alerts }} alerts in this group:
            {{- end }}
            {{- range $i, $alert := .Alerts }}
              {{- if lt $i 3 }}
                {{- if ne $alert.Annotations.description "" }}
            {{ $alert.Annotations.description }}
                {{- else if ne $alert.Annotations.summary "" }}
            {{ $alert.Annotations.summary }}
                {{- else if ne $alert.Annotations.message "" }}
            {{ $alert.Annotations.message }}
                {{- else }}
            Alert description not available
                {{- end }}
                {{- if gt (len $alert.Labels.SortedPairs) 0 }}
            <small>{{ range $alert.Labels.SortedPairs }}<b>{{ .Name }}:</b> {{ .Value }} {{ end }}</small>
                {{- end }}
              {{- end }}
            {{- end }}
          priority: '{{ if eq .Status "firing" }}2{{ else }}0{{ end }}'
          retry: 60s
          sendResolved: true
          sound: persistent
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          token:
            key: PUSHOVER_TOKEN
            name: alertmanager-secret
          url: "https://alertmanager.${DOMAIN_CLUSTER}"
          urlTitle: View in Alertmanager
          userKey:
            key: PUSHOVER_USER_KEY
            name: alertmanager-secret
  route:
    groupBy: ["alertname", "job"]
    groupInterval: 10m
    groupWait: 1m
    receiver: "null"
    repeatInterval: 24h
    routes:
      - matchers:
          - name: severity
            matchType: "="
            value: critical
        receiver: pushover-critical
      - matchers:
          - name: severity
            matchType: "!~"
            value: "info|none"
        receiver: pushover

---
# see: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

crds:
  enabled: true
  upgradeJob:
    # Runs kubectl apply --server-side on all CRDs before the operator pod rolls out.
    # Required for multi-version jumps where CRD schemas change between each prometheus-operator minor release.
    enabled: true

alertmanager:
  alertmanagerSpec:
    # All nodes are control-plane only — no workers. Every pod needs this toleration or it won't schedule.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    storage:
      volumeClaimTemplate:
        spec:
          # Longhorn provides replicated storage (survives a node loss); openebs-hostpath would not.
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              # Alertmanager stores only silences + notification state — 1 Gi is ample.
              storage: 1Gi

grafana:
  enabled: true
  # Deploy pre-built dashboards for kube-prometheus-stack, node-exporter, and Longhorn
  # even if Grafana were deployed separately; with Grafana enabled these are picked up automatically.
  forceDeployDashboards: true
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  # Recreate required: the Longhorn PVC is RWO and cannot be simultaneously attached to two pods
  # during a rolling update. Recreate terminates the old pod before the new one starts.
  deploymentStrategy:
    type: Recreate
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
    size: 5Gi
  sidecar:
    dashboards:
      enabled: true
      # Search all namespaces for ConfigMaps labelled grafana_dashboard: "1"
      # (Longhorn deploys dashboards into longhorn-system)
      searchNamespace: ALL
    datasources:
      enabled: true
  grafana.ini:
    server:
      root_url: "https://grafana.${DOMAIN_CLUSTER}"
  dashboards:
    default:
      node-exporter-full:
        # Full hardware dashboard: CPU/mem/disk/network + hwmon temperatures (node_hwmon_temp_celsius)
        # renovate: depName="Node Exporter Full" dashboardId=1860 revisionId=37
        gnetId: 1860
        revision: 37
        datasource: Prometheus

# Talos runs without kube-proxy (Cilium replaces it with eBPF)
kubeProxy:
  enabled: false

# Talos etcd binds to the management subnet (10.60.0.0/24) only and requires
# client certificates — additional auth configuration needed before this can be scraped.
kubeEtcd:
  enabled: false

kube-state-metrics:
  # All nodes are control-plane only — no workers.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

prometheus:
  prometheusSpec:
    # When nil (unset), Prometheus falls back to filtering by Helm release labels — meaning it
    # would only scrape ServiceMonitors/PodMonitors/etc. deployed by this same Helm release.
    # Setting these to false makes the selector match everything (cluster-wide scraping).
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 14d
    # Hard cap below the 20 Gi PVC size so Prometheus deletes old blocks before the disk fills,
    # rather than running out of space and crashing.
    retentionSize: 18GB
    # All nodes are control-plane only — no workers.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        # No CPU limit intentionally — avoids throttling during scrape fan-out bursts.
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Longhorn provides replicated storage (survives a node loss); openebs-hostpath would not.
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

prometheusOperator:
  # All nodes are control-plane only — no workers.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

prometheus-node-exporter:
  prometheus:
    monitor:
      metricRelabelings:
        # Drop the nct6686 super-I/O chip's unconnected thermistor inputs on the M920Q nodes.
        # Thermistor 7 (temp5) nct6686 sensors reads ~127-128°C when the
        # thermistor pin is floating — a hardware artefact, not a real temperature.
        # Drops at the scrape level so the phantom value never enters the time-series database.
        # Valid nct6686 sensors (temp1-temp4: PECI 0.0, PCH CHIP, Diode 0, Diode 1) are retained.
        - sourceLabels: [chip, sensor]
          regex: "nct6686.*;temp[5]"
          action: drop

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluent-bit
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: fluent-bit
  wait: false
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/fluent-bit/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # ServiceMonitor CRD this HelmRelease relies on. Not depending on victoria-logs
    # itself — the http output plugin retries on its own if it isn't up yet.
    - name: kube-prometheus-stack
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: fluent-bit
      namespace: observability

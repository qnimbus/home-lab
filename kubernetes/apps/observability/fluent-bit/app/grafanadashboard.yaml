---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Dashboard JSON ships in a ConfigMap rendered by the chart (dashboards.enabled).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: fluent-bit
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
  configMapRef:
    name: fluent-bit-dashboard-fluent-bit
    key: fluent-bit-fluent-bit.json

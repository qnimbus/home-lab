---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: fluent-bit
    namespace: flux-system
  values:
    config:
      service: |-
        [SERVICE]
          daemon off
          flush {{ .Values.flush }}
          log_level {{ .Values.logLevel }}
          parsers_file /fluent-bit/etc/parsers.conf
          parsers_file /fluent-bit/etc/conf/custom_parsers.conf
          http_server on
          http_listen 0.0.0.0
          http_port {{ .Values.metricsPort }}
          health_check on

      inputs: |-
        [INPUT]
          name tail
          alias kubernetes
          path /var/log/containers/*.log
          parser containerd
          tag kubernetes.*
          skip_empty_lines on
          skip_long_lines on

      filters: |-
        [FILTER]
          name kubernetes
          match kubernetes.*
          merge_log on
          kube_tag_prefix kubernetes.var.log.containers.
          k8s-logging.parser on
          k8s-logging.exclude on
          namespace_labels off
          annotations off

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under kubernetes
          add_prefix k_

        [FILTER]
          name nest
          match kubernetes.*
          operation lift
          nested_under k_labels
          add_prefix k_labels_

        [FILTER]
          name modify
          match kubernetes.*
          rename k_labels_app.kubernetes.io/name app_name
          rename k_labels_app app_name
          rename k_labels_k8s-app app_name
          # Renamed to app_name (not app) to match VictoriaLogs' own syslog-derived
          # field name — one canonical "what produced this log" field across both
          # the kubernetes and syslog ingestion pipelines. See log_source below for
          # which pipeline a record came from.
          #
          # tailscale-operator sets the "app" pod label to the owning Connector/Ingress/
          # Service's Kubernetes UID (for selector uniqueness), not a readable name — see
          # https://github.com/tailscale/tailscale/blob/main/cmd/k8s-operator/sts.go.
          # Considered overriding it with the operator's own parent-resource label
          # (hard_rename k_labels_tailscale.com/parent-resource app_name) for readability,
          # e.g. "app_name: subnet-router" instead of a UUID. Decided against it:
          #   - Connector is cluster-scoped (`kubectl get crd connectors.tailscale.com
          #     -o jsonpath='{.spec.scope}'` => Cluster), so its name — and thus this
          #     label — is guaranteed globally unique by the API server. No collision risk
          #     for Connector-based proxies (e.g. multiple subnet routers), so this isn't
          #     protecting against anything real today.
          #   - But the operator uses the same parent-resource label for Ingress/Service-
          #     backed proxies too, and those parent types ARE namespaced. An Ingress
          #     named "foo" in ns a and a Service named "foo" in ns b would both render
          #     app_name: foo if we made this change — not a functional break (VictoriaLogs
          #     streams are still keyed on the full _stream_fields set, i.e. also
          #     k_namespace_name + k_pod_name below), just ambiguous for an app_name-only
          #     filter/groupby.
          # Revisit if/when Ingress- or Service-based tailscale proxies are added and
          # collisions become plausible; k_labels_tailscale.com/parent-resource and
          # k_labels_tailscale.com/parent-resource-type remain queryable as-is either way.
          # hard_rename k_labels_tailscale.com/parent-resource app_name

        # tailscaled logs every mutating localapi call unconditionally (not gated by
        # log level) — containerboot polls POST /localapi/v0/debug on every netmap
        # change to keep subnet-router routes in sync. High-volume, zero signal.
        [FILTER]
          name grep
          match kubernetes.*
          exclude log localapi: \[(POST|PATCH|DELETE|PUT)\] /localapi/v0/debug

      # Talos nodes run containerd only — no Docker, so the default cri/docker
      # multiline parser format doesn't match; this is containerd's raw log line format.
      customParsers: |-
        [PARSER]
          name containerd
          format regex
          regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%L%z

      # _stream_fields become VictoriaLogs' indexed/groupable fields (its equivalent
      # of Loki labels); _msg_field/_time_field point at the fields this pipeline produces.
      # extra_fields=log_source=kubernetes mirrors the log_source tag the victoria-logs
      # syslog listener stamps on external senders, so the two pipelines can be told
      # apart by one field instead of by the accidental absence of k_* fields.
      outputs: |-
        [OUTPUT]
          name http
          match kubernetes.*
          host victoria-logs-server.observability.svc.cluster.local
          port 9428
          uri /insert/jsonline?_stream_fields=stream,k_namespace_name,k_pod_name,app_name,log_source&_msg_field=log&_time_field=date&extra_fields=log_source=kubernetes
          format json_lines
          json_date_format iso8601
          compress gzip
          log_response_payload false
    dashboards:
      enabled: true
    logLevel: warn
    serviceMonitor:
      enabled: true

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-operator/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: grafana-operator
      namespace: observability
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator-instance
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  # grafana-operator (wait: true) creates the grafana-secret admin credentials this
  # Grafana's Deployment reads; rook-ceph-cluster provides the ceph-block PVC.
  dependsOn:
    - name: grafana-operator
      namespace: observability
    - name: rook-ceph-cluster
      namespace: rook-ceph
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-operator/instance
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana
spec:
  endpoints:
    - port: grafana
      path: /metrics
      honorLabels: true
  jobLabel: grafana
  namespaceSelector:
    matchNames:
      - observability
  # The operator copies the Grafana CR's labels onto grafana-service.
  selector:
    matchLabels:
      dashboards: grafana

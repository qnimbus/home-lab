---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# DIAGNOSTIC (2026-06-10) — UDP sink for cp-02 netconsole kernel-log streaming.
# Temporary: remove once the cp-02 hard-down root cause is found. See ROADMAP →
# cp-02 Thermal Stability, and memory project-cp02-outage-investigation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netconsole-collector
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: netconsole-collector
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/netconsole-collector/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # ceph-block PVC for the durable log, and the observability namespace (created
    # by kube-prometheus-stack) — both are hard functional dependencies.
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: kube-prometheus-stack
      namespace: flux-system

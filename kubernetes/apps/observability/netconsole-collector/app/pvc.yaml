---
# yaml-language-server: $schema=https://schemas.clustrs.dev/v1/persistentvolumeclaim_v1.json
# Durable sink for cp-02's netconsole stream. ceph-block (replicated, size=3) so the
# captured kernel log survives a cp-02 hard-down — the whole point is that the record
# does NOT live on the node that crashes. 2Gi is ample: netconsole only mirrors printk,
# which is low-volume on an idle Talos node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netconsole-logs
  namespace: observability
spec:
  storageClassName: ceph-block
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi

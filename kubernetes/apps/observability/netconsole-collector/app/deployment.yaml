---
# yaml-language-server: $schema=https://schemas.clustrs.dev/apps/deployment_v1.json
# netconsole UDP collector — listens on the cp-01 management NIC (eno1, 10.60.0.201)
# for kernel-log datagrams streamed by cp-02 (machine.install.extraKernelArgs:
# netconsole=6666@10.60.0.202/eno1,6666@10.60.0.201/<cp-01 eno1 MAC>). socat appends
# every datagram to a ceph-block-backed file so a panic/oops/MCE string survives the
# crash + reboot. Pinned to cp-01 (the collector must NOT live on the node it is
# watching). Watch live during an incident with:
#   kubectl -n observability exec deploy/netconsole-collector -- tail -f /data/netconsole.log
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netconsole-collector
  namespace: observability
spec:
  replicas: 1
  # Recreate: RWO ceph-block PVC + a fixed hostNetwork UDP port — two pods can never
  # run at once, so terminate the old one before starting the new.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netconsole-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netconsole-collector
    spec:
      # hostNetwork so the pod binds the node's eno1 (10.60.0.201) and receives the
      # raw UDP frames netconsole emits at the management IP — there is no Service.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # The collector must stay on a DIFFERENT node from the one it watches (cp-02):
      # if it ran on the crashing node its log would die with the node.
      nodeSelector:
        kubernetes.io/hostname: talos-cp-01
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: socat
          # renovate: datasource=docker
          image: alpine/socat:1.8.0.3
          # -u: unidirectional (socket -> file). UDP-RECV listens on 6666 for datagrams
          # from any source and streams them to the appended log file.
          args:
            - -u
            - UDP-RECV:6666
            - OPEN:/data/netconsole.log,creat,append
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: logs
              mountPath: /data
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: netconsole-logs

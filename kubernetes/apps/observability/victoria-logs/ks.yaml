---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: victoria-logs
  wait: false
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/victoria-logs/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # PVC for the server StatefulSet.
    - name: rook-ceph-cluster
      namespace: flux-system
    # ServiceMonitor/dashboard-sidecar CRDs and labels this HelmRelease relies on.
    - name: kube-prometheus-stack
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: victoria-logs
      namespace: observability

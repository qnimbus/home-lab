---
# yaml-language-server: $schema=https://schemas.clustrs.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victoria-logs
  datasource:
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs-server.observability.svc.cluster.local:9428
    jsonData:
      maxLines: 1000
  # Installed into Grafana by the operator. Bump manually: releases are v-prefixed
  # (VictoriaMetrics/victorialogs-datasource), this field must not be.
  plugins:
    - name: victoriametrics-logs-datasource
      version: 0.32.0

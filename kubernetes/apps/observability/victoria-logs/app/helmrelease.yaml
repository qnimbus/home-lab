---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
    namespace: flux-system
  values:
    # Avoids the double "victoria-logs-victoria-logs-single" name; server Service
    # ends up named victoria-logs-server (referenced by fluent-bit's output config).
    fullnameOverride: victoria-logs
    server:
      retentionPeriod: "14d"
      persistentVolume:
        storageClassName: ceph-block
        size: 20Gi
      serviceMonitor:
        enabled: true
    # Picked up by the kube-prometheus-stack Grafana sidecar once labelled —
    # chart leaves the label unset by default even with dashboards.enabled.
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"

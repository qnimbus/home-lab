---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  values:
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    fullnameOverride: victoria-logs
    server:
      persistentVolume:
        size: 20Gi
        storageClassName: ceph-block
      retentionPeriod: "14d"
      serviceMonitor:
        enabled: true
      syslog:
        tcp:
          - extraFields: '{"log_source":"syslog"}'
            name: syslog-tcp
            streamFields: '["hostname","app_name","log_source"]'
            useRemoteIP: true
            value: :1514

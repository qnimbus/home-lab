---
# Picked up by the kube-prometheus-stack Grafana sidecar (sidecar.datasources.enabled,
# label grafana_datasource: "1") — no manual wiring into the Grafana HelmRelease needed.
# Requires the victoriametrics-logs-datasource plugin (installed via
# kube-prometheus-stack's grafana.plugins value).
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-logs-datasource
  labels:
    grafana_datasource: "1"
data:
  victoria-logs-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-server.observability.svc.cluster.local:9428
        jsonData:
          maxLines: 1000

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "VictoriaLogs"
    gethomepage.dev/description: "Cluster & syslog log storage"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "mdi-text-box-search"
    # Chart names the pod app.kubernetes.io/name=victoria-logs-single, not victoria-logs
    # (this route's own name) — override the default guess.
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=victoria-logs-single"
    gethomepage.dev/href: "https://victorialogs.${DOMAIN_CLUSTER}/select/vmui/"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "victorialogs.${DOMAIN_CLUSTER}"
  rules:
    - backendRefs:
        - name: victoria-logs-server
          port: 9428

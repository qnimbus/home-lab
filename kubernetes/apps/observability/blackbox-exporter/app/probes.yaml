---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nas-nfs
spec:
  # tcp_connect, not icmp: a host can answer ping while nfsd itself is wedged or
  # the export is unmounted. A TCP handshake on 2049 reflects the service, not
  # just the box. This is also the exact metric a future KEDA nfs-scaler
  # ScaledObject would poll (probe_success{instance="${NAS_HOST}:2049"}) — see
  # docs/keda-nfs-scaler-plan.md.
  module: tcp_connect
  interval: 30s
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - "${NAS_HOST}:2049"
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nas-smb
spec:
  module: tcp_connect
  interval: 30s
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - "${NAS_HOST}:445"
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dragonfly
spec:
  # tcp_connect: Dragonfly is the cluster-wide shared Redis-compatible store
  # (kubernetes/apps/database/dragonfly); this is also the exact metric the
  # KEDA redis-scaler ScaledObject polls (probe_success{instance="${DRAGONFLY_HOST}:6379"}).
  module: tcp_connect
  interval: 30s
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - "${DRAGONFLY_HOST}:6379"

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/observability.giantswarm.io/silence_v1alpha2.json
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: ceph-node-network-packet-drops-x520-fallback
spec:
  # TEMPORARY -- same root cause as bond-storage-degraded-x520-fallback-ceph / -node-exporter.
  # Remove once X520 replacement cards are installed and storage traffic moves back off the
  # management NIC (talos/talconfig.yaml's inline VLAN-200 patch reverted).
  # Context and revert steps:
  # .claude/agent-memory/cluster-doctor/project_cp02_storage_bond_ixgbe_failure.md
  #
  # Why it fires: with the X520 cards absent/failed, Ceph storage traffic (10.200.0.0/24) is
  # carried over each node's onboard 1 GbE management NIC via a VLAN 200 sub-interface.
  # The resulting congestion causes periodic packet drops on that interface, triggering
  # CephNodeNetworkPacketDrops roughly once per hour. This is a known, intentional
  # fallback with no data-loss risk; Ceph remains HEALTH_OK throughout.
  matchers:
    - name: alertname
      value: CephNodeNetworkPacketDrops

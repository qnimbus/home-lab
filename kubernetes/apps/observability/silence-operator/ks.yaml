---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silence-operator
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: silence-operator
  wait: false
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/silence-operator/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: silence-operator
      namespace: observability
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silence-operator-silences
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: silence-operator
  # Silence CRD (observability.giantswarm.io/v1alpha2) doesn't exist until the operator's
  # HelmRelease installs it -- dependsOn blocks this Kustomization's dry-run until then.
  dependsOn:
    - name: silence-operator
      namespace: flux-system
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/silence-operator/silences
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Tracks the ceph-csi-operator release line, not Rook's — keep it at (or
    # below) the `ceph-csi-operator` subchart version bundled in the rook-ceph
    # chart in use (v1.20.x bundles 1.0.4), since the operator owns the CRDs.
    tag: 1.1.0
  # Upstream only publishes this chart to a classic Helm repo
  # (https://ceph.github.io/ceph-csi-operator); the home-operations mirror
  # exposes it as OCI so it fits the OCIRepository pattern used everywhere here.
  url: oci://ghcr.io/home-operations/charts-mirror/ceph-csi-drivers
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: https://token.actions.githubusercontent.com
        subject: ^https://github.com/home-operations/

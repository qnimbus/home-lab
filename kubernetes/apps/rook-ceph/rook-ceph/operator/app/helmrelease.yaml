---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
    namespace: flux-system
  interval: 1h
  values:
    # Let the chart manage Rook's CRDs (CephCluster, CephBlockPool, …).
    crds:
      enabled: true
    # Pull the Ceph/Rook image from GHCR to avoid Docker Hub rate limits.
    image:
      repository: ghcr.io/rook/ceph
    # Since v1.20 this chart only carries the ceph-csi-operator subchart, the
    # CSI image set and the ServiceMonitor below. Which drivers run and how
    # (RBD only, snapshotter, resources, …) is configured in the ceph-csi-drivers
    # HelmRelease (../../csi-drivers/app) — the old csi.enable*/csi.* switches
    # are gone from the chart and silently ignored if set.
    csi:
      # kube-prometheus-stack installs before rook-ceph-operator (see dependsOn
      # chain), so the ServiceMonitor CRD is guaranteed present at install time.
      # Currently scrapes nothing: it selects `app: csi-metrics` Services that
      # the ceph-csi-operator never creates (no liveness sidecar since the CSI
      # operator switch in v1.19). Kept until CSI metrics are wired via the
      # drivers chart or dropped — see docs/ROADMAP.md.
      serviceMonitor:
        enabled: true
    # Fail Ceph CLI calls fast rather than hanging the operator reconcile.
    cephCommandsTimeoutSeconds: "20"
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 80m
        memory: 256Mi
      limits:
        memory: 512Mi

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
    namespace: flux-system
  interval: 1h
  values:
    # Let the chart manage Rook's CRDs (CephCluster, CephBlockPool, …).
    crds:
      enabled: true
    # Pull the Ceph/Rook image from GHCR to avoid Docker Hub rate limits.
    image:
      repository: ghcr.io/rook/ceph
    # Since v1.20 this chart only carries the ceph-csi-operator subchart, the
    # CSI image set and an optional CSI ServiceMonitor (off, see below). Which
    # drivers run and how
    # (RBD only, snapshotter, resources, …) is configured in the ceph-csi-drivers
    # HelmRelease (../../csi-drivers/app) — the old csi.enable*/csi.* switches
    # are gone from the chart and silently ignored if set.
    csi:
      # Disabled 2026-09-04 — dead by construction with the ceph-csi-operator
      # (Rook ≥ v1.19). The chart's ServiceMonitor selects `app: csi-metrics`
      # Services on port `csi-http-metrics`; the only thing that could provide
      # one is the CSI liveness sidecar, which needs Driver.spec.liveness.
      # metricsPort — not exposed by the ceph-csi-drivers chart (1.0.4 nor
      # upstream main) — and even then the operator's liveness Service is
      # created with ports only, no labels and no selector, so nothing could
      # ever match. Revisit if ceph-csi-operator adds labels/selector to
      # reconcileLivenessService and the drivers chart grows a liveness value.
      serviceMonitor:
        enabled: false
    # Fail Ceph CLI calls fast rather than hanging the operator reconcile.
    cephCommandsTimeoutSeconds: "20"
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 80m
        memory: 256Mi
      limits:
        memory: 512Mi

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  annotations:
    # The Rook chart line this release is meant to run against — see the
    # dependsOn readyExpr below. Renovate bumps it in the same grouped PR as
    # the rook-ceph/rook-ceph-cluster OCIRepository tags (same depName).
    # renovate: datasource=docker depName=ghcr.io/rook/rook-ceph
    rook.io/chart-version: v1.20.7
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
    namespace: flux-system
  interval: 1h
  # HelmRelease-level ordering. This HR uses chartRef, so a rook-ceph-cluster
  # OCI tag bump upgrades the release as soon as source-controller sees it —
  # the Kustomization ordering in ks.yaml only sequences the HR *object*, which
  # does not change on a tag bump. Rook requires rook-ceph → ceph-csi-drivers →
  # rook-ceph-cluster on every upgrade.
  dependsOn:
    - name: rook-ceph-operator
      # Lockstep gate, identical to the one in the ceph-csi-drivers HR (keep
      # them in sync): wait until the operator release is on the chart line in
      # the annotation above. readyExpr replaces the default Ready check, so
      # Ready/generation are restated. Recovery after a rolled-back operator
      # upgrade: revert the commit (tags + annotations) and the gate reopens.
      readyExpr: >-
        has(dep.status.history) && dep.status.history.size() > 0 &&
        dep.status.history[0].chartVersion == self.metadata.annotations['rook.io/chart-version'] &&
        dep.status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True') &&
        dep.metadata.generation == dep.status.observedGeneration
    - name: ceph-csi-drivers
  # The chart's CephCluster name + the operator namespace.
  values:
    operatorNamespace: rook-ceph
    # Pinned on purpose. The chart's default Ceph image follows the Rook release
    # line (v1.19.x → Squid 19.2.3, v1.20.x → Tentacle 20.2.4), so leaving this
    # unset turns a Rook chart bump into an unreviewed Ceph *major* upgrade —
    # which is exactly what Renovate's rook-ceph-cluster v1.20 PR would have
    # done. Ceph upgrades are their own Renovate PRs now; before merging one,
    # read Rook's ceph-upgrade guide for that release (Tentacle wants the `rook`
    # mgr module disabled first, and v20.2.0 is off-limits with readAffinity).
    # The chart renders this into cephClusterSpec.cephVersion.image (and the
    # toolbox image) — do not also set cephVersion inside cephClusterSpec.
    cephImage:
      repository: quay.io/ceph/ceph
      # renovate: datasource=docker depName=quay.io/ceph/ceph
      tag: v19.2.3
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        # Stock ceph-mixin rule has no `for:`, so a single noisy 30s evaluation
        # fires it — confirmed via two false positives (2026-07-02, 2026-07-09)
        # that both landed within an hour of a fleet-wide node reboot: with only
        # ~1h of post-boot node-exporter history feeding the 2-day trailing
        # regression window, a normal small post-boot free-space dip extrapolates
        # into a wildly steep (and wrong) predicted-fill slope. All 5 nodes sit at
        # 12-27% disk usage with no real fill trend. `for: 5m` requires ~10
        # consecutive bad evaluations (rule group evals every 30s), which neither
        # incident would have cleared. The `node_boot_time_seconds` clause
        # suppresses the alert directly for a node's first 30 minutes post-boot,
        # targeting the actual root mechanism rather than just debouncing it.
        CephNodeDiskspaceWarning:
          for: 5m
          expr: |
            predict_linear(node_filesystem_free_bytes{device=~"/.*"}[2d], 3600 * 24 * 5)
              * on(cluster, instance) group_left(nodename) node_uname_info < 0
            and on(instance) (time() - node_boot_time_seconds > 1800)
        # Same root problem as CephNodeDiskspaceWarning above: the stock rule has no
        # `for:`, so a single noisy 30s evaluation fires it. This rule has no
        # network-scoping either (device!="lo" only) — it fires on any NIC on any
        # node.exporter host, including the plain 1GbE eno1 management NICs on
        # cp-02/cp-03/worker-01/worker-02, not just Ceph's own storage bond.
        # 5 occurrences over 2026-07-11..07-18, confirmed via the ALERTS{} series at
        # the rule group's native 30s resolution: every single one was exactly one
        # evaluation tick (never 2 consecutive), i.e. drops lasted <30-60s. Baseline
        # on eno1 is ~200-1000 pkts/s with 0 drops; the bursts genuinely crossed the
        # existing thresholds (up to ~2963 pkts/s / 24 drops/s, ~0.6-1.2% ratio) --
        # this isn't a threshold-too-strict problem, it's a missing-debounce problem.
        # `for: 1m` requires 3 consecutive bad evals (interval: 30s) and would have
        # suppressed all 5 historical false-fires while still catching a genuinely
        # sustained drop event (failing NIC, persistent congestion) within 60s.
        CephNodeNetworkPacketDrops:
          for: 1m
    # Built-in toolbox pod — gives us the `ceph` CLI in-cluster for status,
    # `ceph osd tree`, `ceph -s`, etc. Reach it with:
    #   kubectl -n rook-ceph exec -it deploy/rook-ceph-tools -- ceph status
    toolbox:
      enabled: true
    cephClusterSpec:
      cephConfig:
        global:
          # All three OSD drives are NVMe SSDs — enable background discard/TRIM
          # so freed blocks are released back to the device.
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          # Warn earlier on low mon-store space (percent free).
          mon_data_avail_warn: "10"
          # (Removed 2026-06-24) This suppressed POOL_NO_REDUNDANCY for the retired
          # size=1 ceph-block-single pool — see the cephBlockPools note below. Default
          # redundancy warning behaviour now applies; with no size=1 pool it never
          # fires, so HEALTH_OK stays meaningful without the override.
        mon:
          # Ceph's default: every mon mirrors every OTHER mon's Paxos-replicated
          # cluster/audit-log event to its own stderr, so each event is logged
          # 2-3x across the 3-mon fleet instead of once. Confirmed live via
          # `ceph config show-with-defaults mon.a` (mon_cluster_log_to_stderr=true,
          # source=default — not something Rook sets, Ceph's own compiled default).
          # Disabling cuts mon container log volume ~2-3x. Cluster/audit history
          # remains available via `ceph log last` / `ceph crash ls` / the dashboard
          # (those read the Paxos-backed cluster log service, not stderr) — this
          # only removes it from `kubectl logs` / VictoriaLogs.
          mon_cluster_log_to_stderr: "false"
        osd:
          # Default is 3; bump to 5 for NVMe workloads where the disk is not
          # the bottleneck and messenger threads can otherwise become the ceiling.
          ms_async_op_threads: "5"
          # Default 600s: RocksDB dumps a full "DUMPING STATS" block (cumulative +
          # interval write/WAL/compaction stats) to each OSD's log every 10 minutes.
          # With 10 OSDs that's a multi-line block every ~minute cluster-wide, pure
          # noise for day-to-day operation. The underlying counters are still
          # exposed via the OSD perf/prometheus exporter either way.
          #
          # `rocksdb_stats_dump_period_sec` is NOT a real Ceph config key (confirmed
          # via `ceph config get osd rocksdb_stats_dump_period_sec` -> ENOENT). It's
          # a RocksDB-internal option and must be embedded inside
          # bluestore_rocksdb_options — set via the _annex key so the base
          # bluestore_rocksdb_options string (chart/Ceph default) is left untouched.
          # The invalid key above was live for a while and put rook-ceph-operator in
          # a failed-reconcile retry loop (~every 25-30s: set -> ENOENT -> delete ->
          # retry) — worth fixing regardless, but re-measured mon/mgr log volume
          # after this landed and the operator went idle: it wasn't a major
          # contributor to steady-state volume. See mon_cluster_log_to_stderr below
          # for the actual driver of mon container log volume.
          bluestore_rocksdb_options_annex: "stats_dump_period_sec=0"
        mgr:
          # pg_autoscaler logs its _maybe_adjust/effective_target_ratio decision
          # trace at INFO on every scheduler pass (~every 2s) — pure chatter with
          # the cluster this small. "error" keeps actual pg_autoscaler warnings.
          mgr/pg_autoscaler/log_level: "error"
      crashCollector:
        disable: false
      csi:
        # Prefer reading from a local OSD replica when one exists on the node —
        # avoids a network hop for reads on host-networked OSDs.
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        ssl: false
      mgr:
        modules:
          # Required for Rook to drive the mgr.
          - name: rook
            enabled: true
          # Auto-tunes placement-group counts per pool — removes the classic
          # "how many PGs?" guesswork. Strongly recommended for new clusters.
          - name: pg_autoscaler
            enabled: true
      # --- public_network migrated onto the storage bond (2026-09-03) --------
      # Both public_network (clients/CSI <-> mons,OSDs) and cluster_network
      # (OSD<->OSD replication, heartbeat, backfill) now ride the same 2x10G
      # LACP storage bond (bond-storage, 9000 MTU, 10.200.0.0/24), unifying
      # all Ceph traffic off the management subnet. Was split (public on
      # 10.60.0.0/24, cluster on 10.200.0.0/24) at greenfield; moved after
      # CephNodeNetworkPacketDrops was root-caused to mgmt-NIC RX-ring
      # exhaustion — see docs/QA.md and docs/ROADMAP.md.
      #
      # This value alone does not move already-running mons/OSDs — Rook only
      # applies a network change to a daemon on that daemon's next restart.
      # Existing mons are failed over one at a time (imperative, not GitOps —
      # see the session that landed this), and OSD pods are restarted per
      # node, both tracked outside this file.
      #
      # The CSI controller plugin reaches the mons here via the Cilium pod
      # network — bond-storage is an explicit device in kube-system/cilium's
      # `devices:` config (added as the prerequisite for this change). The CSI
      # node plugins are host-networked (always, under the ceph-csi-operator)
      # and reach 10.200.0.0/24 straight from the host. Both are configured in
      # the ceph-csi-drivers HelmRelease since Rook v1.20.
      network:
        provider: host
        addressRanges:
          public:
            - 10.200.0.0/24
          cluster:
            - 10.200.0.0/24
      security:
        cephx:
          csi:
            # AES256K CSI keys (the CVE-2025-30156 fix, Ceph ≥ 19.2.6/20.2.4)
            # need Linux ≥ 7.0 on the nodes; Talos v1.13 ships 6.18, so CSI keys
            # must stay AES. Chart default since v1.20, made explicit so a later
            # key rotation cannot silently pick AES256K and break PVC mounts.
            keyType: aes
      resources:
        mgr:
          requests:
            cpu: 60m
            memory: 512Mi
          limits:
            memory: 1280Mi
        mon:
          requests:
            cpu: 60m
            memory: 512Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 150m
            memory: 2Gi
          limits:
            memory: 4Gi
      storage:
        # Never auto-consume disks — we name exactly one spare per node so the
        # OS/system NVMe can never be picked up as an OSD by mistake.
        useAllNodes: false
        useAllDevices: false
        config:
          # 2 OSDs per NVMe creates independent TCP flows between node pairs,
          # allowing the LACP bond to distribute replication traffic across
          # both 10GbE links instead of pinning to one.
          osdsPerDevice: "2"
        # Devices are pinned by /dev/disk/by-id (stable across reboots). This
        # matters because NVMe kernel enumeration is NOT consistent: on cp-01
        # (MS-A2) the system disk is nvme0n1 and the OSD spare is nvme1n1 — the
        # reverse of worker-01/worker-02. A kernel-name selector would be a data-loss footgun.
        nodes:
          - name: talos-cp-01                          # MS-A2 — Crucial T500 2TB (CT2000T500SSD8, S/N 2545543A2190)
            devices:
              - name: /dev/disk/by-id/nvme-CT2000T500SSD8_2545543A2190
          - name: talos-cp-02                          # M90q #1 — Crucial T500 2TB (CT2000T500SSD8, S/N 25405348D601)
            devices:
              - name: /dev/disk/by-id/nvme-CT2000T500SSD8_25405348D601
          - name: talos-cp-03                          # M90q #2 — Crucial T500 2TB (CT2000T500SSD8, S/N 254053487747)
            devices:
              - name: /dev/disk/by-id/nvme-CT2000T500SSD8_254053487747
          - name: talos-worker-01                      # M920q #1 — Crucial P310 2TB (CT2000P310SSD8, S/N 252450B1A33B; DRAM-less)
            devices:
              - name: /dev/disk/by-id/nvme-CT2000P310SSD8_252450B1A33B
          - name: talos-worker-02                      # M920q #2 — Crucial T500 2TB (CT2000T500SSD8, S/N 2545542DA3BA); replaced Kingston NV3 1TB 2026-06-25, now matches the other 4 nodes' OSD disk
            devices:
              - name: /dev/disk/by-id/nvme-CT2000T500SSD8_2545542DA3BA
    # Replicated RBD pool + its StorageClass. size=3 / failureDomain=host means
    # one replica per node — full host-level redundancy (usable capacity is
    # gated by the smallest host, ~1TB, until the cluster grows).
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          # No default StorageClass exists today; make replicated block the
          # cluster default so unqualified PVCs land on redundant storage.
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
      # ─────────────────────────────────────────────────────────────────────────
      # RETIRED 2026-06-24 — the size=1 `ceph-block-single` pool + StorageClass were
      # removed permanently (prior config preserved in git history). Do not
      # reintroduce a size=1 Ceph pool here.
      #
      # Why it's gone: a size=1 RBD pool is the worst of both worlds. It still pays
      # Ceph's full cost — RADOS/network round-trip latency AND operational coupling
      # — while discarding Ceph's only real benefit, redundancy. That coupling bit
      # us: single-copy PGs made `ceph osd ok-to-stop <id>` return false for EVERY
      # OSD, which jammed Rook's one-at-a-time OSD rolling updates (operator looped
      # "aborting OSD provisioning after 20 minutes" every ~21min) and would have
      # blocked all future OSD/Ceph upgrades on the same gate. The pool was empty
      # (0 PVCs/PVs), so removal was lossless and restored ok-to-stop=true.
      #
      # What to use instead:
      #   • Disposable / trivially-regenerable data → `openebs-hostpath` (LocalPV).
      #     Node-local NVMe, no Ceph coupling, lower latency, and structurally
      #     incapable of the ok-to-stop pathology above. This is the canonical
      #     choice for throwaway single-node data.
      #   • Data worth protecting → the size=3 `ceph-block` pool above.
      #   • Best of all where the app can replicate itself → openebs-hostpath plus
      #     app-layer redundancy (the CNPG pattern: Postgres streaming replication
      #     + barman PITR on local disk).
    # Backed by the rook-ceph.rbd.csi.ceph.com driver via the external-snapshotter
    # (kubernetes/apps/system/snapshot-controller). Named explicitly rather than
    # the chart's own default ("ceph-block" — identical to the ceph-block
    # StorageClass name; distinct API kinds so no functional collision, but
    # confusing in `kubectl get` output). Not the cluster-default snapshot
    # class — consumers (e.g. VolSync) reference it by name explicitly.
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: ceph-block-snapshot
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    cephObjectStores: []

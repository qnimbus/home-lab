---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-cluster
spec:
  # Grafana lives in observability, this dashboard in rook-ceph's own namespace —
  # cross-namespace matching is opt-in, defaults false.
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  grafanaCom:
    id: 2842
    # renovate: datasource=custom.grafana-dashboard depName=2842
    revision: 18
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Prometheus
---

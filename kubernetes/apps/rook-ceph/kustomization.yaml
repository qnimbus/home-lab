---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../components/namespace
namespace: rook-ceph
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          # Rook's mon/mgr/OSD daemons run as privileged pods (raw block-device and,
          # in our case, host-network access). Pin the PodSecurity enforce level so
          # these workloads are admitted regardless of any future cluster-wide PSA
          # tightening — every other namespace here relies on the permissive default.
          pod-security.kubernetes.io/enforce: privileged
resources:
  - ./rook-ceph

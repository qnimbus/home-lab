---
# yaml-language-server: $schema=https://schemas.clustrs.dev/core/namespace_v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Rook's mon/mgr/OSD daemons run as privileged pods (raw block-device and,
    # in our case, host-network access). Pin the PodSecurity enforce level so
    # these workloads are admitted regardless of any future cluster-wide PSA
    # tightening — every other namespace here relies on the permissive default.
    pod-security.kubernetes.io/enforce: privileged

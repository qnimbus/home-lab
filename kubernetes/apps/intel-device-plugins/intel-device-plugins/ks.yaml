---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app intel-device-plugins-operator
  namespace: flux-system
spec:
  targetNamespace: intel-device-plugins
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/intel-device-plugins/intel-device-plugins/operator/app
  prune: true
  # wait until the operator HelmRelease is fully installed before the gpu
  # Kustomization's dry-run runs — otherwise the GpuDevicePlugin CRD type
  # won't exist yet and the dry-run fails (operator+CRD-instance split).
  wait: true
  dependsOn:
    # The operator's admission webhook needs cert-manager-issued certs.
    - name: cert-manager
      namespace: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: intel-device-plugins-operator
      namespace: intel-device-plugins
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app intel-device-plugins-gpu
  namespace: flux-system
spec:
  targetNamespace: intel-device-plugins
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/intel-device-plugins/intel-device-plugins/gpu/app
  prune: true
  wait: true
  dependsOn:
    # Provides the GpuDevicePlugin CRD.
    - name: intel-device-plugins-operator
    # Provides the NodeFeatureRule CRD + the intel.feature.node.kubernetes.io/gpu
    # node label this chart's nodeSelector relies on.
    - name: node-feature-discovery
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: intel-device-plugins-gpu
      namespace: intel-device-plugins

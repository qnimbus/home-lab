---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless
  dependsOn: []
  driftDetection:
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
            env:
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
              PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: "https://embeddings.${DOMAIN_APP}/v1"
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: harrier-oss-v1-0.6b
              PAPERLESS_AI_LLM_ENDPOINT: "https://llama.${DOMAIN_APP}/v1"
              PAPERLESS_AI_LLM_MODEL: Qwen3.6-35B-A3B
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "15"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_CONSUMPTION_DIR: &consumePath /mnt/archive/consume
              PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://paperless.${DOMAIN_CLUSTER}"
              PAPERLESS_DATA_DIR: &dataPath /usr/src/paperless/data
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST: "${APP}-postgres-rw"
              PAPERLESS_DBNAME: paperless
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: paperless-postgres-app
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    key: username
                    name: paperless-postgres-app
              PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
              PAPERLESS_EXPORT_DIR: &exportPath /mnt/archive/export
              PAPERLESS_FILENAME_FORMAT: >-
                {{"{{"}} created_year {{"}}"}}/{{"{{"}} correspondent {{"}}"}}/{{"{{"}} created {{"}}"}} - {{"{{"}} title {{"}}"}} - {{"{{"}} doc_pk {{"}}"}}
              PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
              PAPERLESS_MEDIA_ROOT: &mediaPath /mnt/archive/media
              PAPERLESS_OCR_LANGUAGE: nld+eng
              PAPERLESS_OCR_LANGUAGES: nld
              PAPERLESS_PORT: &port 8000
              PAPERLESS_REDIRECT_LOGIN_TO_SSO: "false"
              PAPERLESS_REDIS: "redis://${APP}-dragonfly:6379"
              PAPERLESS_TASK_WORKERS: "2"
              PAPERLESS_TIKA_ENABLED: "1"
              PAPERLESS_TIKA_ENDPOINT: http://localhost:9998
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://localhost:3000
              PAPERLESS_TIME_ZONE: ${CLUSTER_TIMEZONE}
              PAPERLESS_TRUSTED_PROXIES: "**"
              PAPERLESS_URL: "https://paperless.${DOMAIN_CLUSTER}"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_WORKER_TIMEOUT: "14400"
              USERMAP_GID: "1000"
              USERMAP_UID: "1000"
            envFrom:
              - secretRef:
                  name: paperless-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                memory: 4Gi
            securityContext:
              runAsGroup: 0
              runAsUser: 0
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: 8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
            args:
              - "gotenberg"
              - "--chromium-disable-javascript=true"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          tika:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
    persistence:
      config:
        existingClaim: "${KOPIUR_CLAIM:=${APP}}"
        globalMounts:
          - path: *dataPath
      archive:
        existingClaim: "paperless-smb-archive"
        globalMounts:
          - path: *consumePath
            subPath: consume
          - path: *exportPath
            subPath: export
          - path: *mediaPath
            subPath: media
      backups:
        existingClaim: "paperless-smb-backup"
        globalMounts:
          - path: /mnt/backups
            subPath: Apps/Paperless
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /usr/src/paperless/data/log
            subPath: log
    service:
      app:
        ports:
          http:
            port: *port

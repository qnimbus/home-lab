---
# yaml-language-server: $schema=https://schemas.clustrs.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}-scaler
spec:
  scaleTargetRef:
    name: ${APP}
  minReplicaCount: 0
  maxReplicaCount: 1
  advanced:
    restoreToOriginalReplicaCount: true
  # 30s, same rationale as components/keda/postgres-scaler: one extra confirmation
  # window beyond each blackbox probe's own 30s scrape interval before committing to
  # scale-down, so a single transient failed scrape doesn't cold-restart the app.
  cooldownPeriod: 30
  # Scales to zero while the SMB share backing the archive/backup PVCs (app/pv.yaml) is
  # unreachable. Dragonfly and Postgres are co-located and gated by ks.yaml's health checks.
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        query: probe_success{instance="${NAS_HOST}:445"}
        threshold: "1"
        ignoreNullValues: "0"

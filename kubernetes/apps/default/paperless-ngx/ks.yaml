---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-ngx
  labels:
    decryption.flux.home.arpa/disabled: "true"
    # components.postgres/cnpg: init # <-- remove once the first backup lands
spec:
  # No keda/postgres-scaler Component: KEDA allows one ScaledObject per workload, so
  # app/scaledobject.yaml carries paperless-ngx's own trigger (the SMB share).
  components:
    - ../../../../components/dragonfly
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres
  interval: 1h
  path: ./kubernetes/apps/default/paperless-ngx/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: paperless-ngx-config
      POSTGRES_DATABASE: paperless
      POSTGRES_USERNAME: paperless
      POSTGRES_BACKUP_SCHEDULE: "0 7 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # pv.yaml's nodeStageSecretRef points at the smb-credentials Secret ESO creates
    # asynchronously in the system namespace — wait: true there guarantees it's
    # Ready before this Kustomization's Pod tries to mount the SMB PVCs.
    - name: csi-driver-smb
      namespace: system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: default
  healthCheckExprs:
    # Operator v1.6.1 reports `Ready` (the lowercase `ready` is its deprecated legacy value).
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      current: status.phase == 'Ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')

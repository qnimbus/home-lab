---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless-ngx
  labels:
    decryption.flux.home.arpa/disabled: "true"
    # components.postgres/cnpg: init # <-- remove once the first backup lands
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No keda/postgres-scaler or keda/redis-scaler Component here: KEDA's admission
  # webhook (vscaledobject.kb.io) forbids more than one ScaledObject managing the
  # same workload ("already managed by the hpa ...") — hit this live when both were
  # wired in at once. paperless-ngx depends on Postgres, Dragonfly, AND SMB (see
  # app/pv.yaml), so it needs all three folded into ONE ScaledObject's single
  # trigger instead — see app/scaledobject.yaml.
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres
  interval: 1h
  path: ./kubernetes/apps/default/paperless-ngx/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CLAIM: paperless-ngx-config
      POSTGRES_DATABASE: paperless
      POSTGRES_USERNAME: paperless
      POSTGRES_BACKUP_SCHEDULE: "0 7 * * * *"
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
      namespace: external-secrets
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: dragonfly
      namespace: database
    # pv.yaml's nodeStageSecretRef points at the smb-credentials Secret ESO creates
    # asynchronously in the system namespace — wait: true there guarantees it's
    # Ready before this Kustomization's Pod tries to mount the SMB PVCs.
    - name: csi-driver-smb
      namespace: system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: default
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')

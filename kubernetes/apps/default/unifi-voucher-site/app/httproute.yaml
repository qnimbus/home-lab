---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-voucher-site
  annotations:
    gethomepage.dev/description: "Guest WiFi voucher generation"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: "Unifi"
    gethomepage.dev/icon: "mdi-ticket-confirmation-#0559C9"
    gethomepage.dev/name: "UniFi Vouchers"
spec:
  hostnames:
    - "voucher.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: system
          port: 8080

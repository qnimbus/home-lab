---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-voucher-site
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "UniFi Vouchers"
    gethomepage.dev/description: "Guest WiFi voucher generation"
    gethomepage.dev/group: "Network"
    gethomepage.dev/icon: "mdi-ticket-confirmation"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "voucher.${DOMAIN_CLUSTER}"
  rules:
    # Routed through the KEDA HTTP Add-on interceptor (not the app's Service
    # directly) so it can hold first-request traffic while it scales up from 0
    # — see interceptorroute.yaml/scaledobject.yaml in this directory.
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080

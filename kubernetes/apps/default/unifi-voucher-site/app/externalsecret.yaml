---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-voucher-site
spec:
  dataFrom:
    - extract:
        key: unifi
      rewrite:
        - regexp:
            source: (.*)
            target: UNIFI_$1
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-voucher-site-secret
    template:
      data:
        # unifi-voucher-site wants a bare host + port instead of unpoller/external-dns-unifi's
        # full base-URL UNIFI_HOST, and calls the API key UNIFI_TOKEN — reshape rather than
        # storing a second copy of the credential under a new 1Password item.
        UNIFI_IP: '{{ .UNIFI_HOST | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}'
        UNIFI_PORT: "443"
        UNIFI_TOKEN: "{{ .UNIFI_API_KEY }}"

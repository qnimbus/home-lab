---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app unifi-voucher-site
spec:
  components:
    - ../../../../components/keda/http-scaler
  dependsOn:
    # InterceptorRoute/ScaledObject CRDs don't exist until the add-on's
    # operator installs them — see bootstrap-ordering rule in CLAUDE.md.
    - name: keda-add-ons-http
      namespace: system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/unifi-voucher-site/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

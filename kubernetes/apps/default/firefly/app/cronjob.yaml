---
# yaml-language-server: $schema=https://schemas.clustrs.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: cron
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              command:
                - /bin/sh
                - -c
                - 'curl -fsS "http://firefly.default.svc.cluster.local:8080/api/v1/cron/$CRON_TOKEN"'
              env:
                - name: CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: STATIC_CRON_TOKEN
                      name: firefly-secret
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 1

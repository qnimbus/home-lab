---
# yaml-language-server: $schema=https://schemas.clustrs.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: cron
              image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              command:
                - /bin/sh
                - -c
                - 'curl -fsS "http://firefly.default.svc.cluster.local:8080/api/v1/cron/$CRON_TOKEN"'
              env:
                - name: CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: STATIC_CRON_TOKEN
                      name: firefly-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 1

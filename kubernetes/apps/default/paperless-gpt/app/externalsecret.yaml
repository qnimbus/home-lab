---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperless-gpt-secret
    template:
      data:
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_GPT_API_TOKEN }}"
  dataFrom:
    - extract:
        key: paperless-gpt
      rewrite:
        - regexp:
            source: (.*)
            target: PAPERLESS_GPT_$1

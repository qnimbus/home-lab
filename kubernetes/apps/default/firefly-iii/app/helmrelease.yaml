---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii
spec:
  interval: 1h
  # Placeholder so components/postgres's JSON6902 patch has an existing array to append to.
  # (appends to /spec/dependsOn/-) — see kubernetes/components/postgres/kustomization.yaml.
  dependsOn: []
  chartRef:
    kind: OCIRepository
    name: firefly-iii
  values:
    controllers:
      firefly-iii:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: fireflyiii/core
              # renovate: datasource=docker depName=fireflyiii/core
              tag: "version-6.6.6"
            env:
              APP_ENV: production
              APP_DEBUG: "false"
              DB_CONNECTION: pgsql
              # --- Database: dedicated CNPG cluster (components/postgres), same namespace
              # as this Deployment — USERNAME/PASSWORD read from the generated
              # firefly-iii-postgres-app Secret rather than duplicated via ExternalSecret.
              DB_HOST: "${APP}-postgres-rw"
              DB_PORT: "5432"
              DB_DATABASE: firefly
              APP_URL: "https://firefly.${DOMAIN_CLUSTER}"
              TRUSTED_PROXIES: "**"
              TZ: ${CLUSTER_TIMEZONE}
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: firefly-iii-postgres-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: firefly-iii-postgres-app
                    key: password
            envFrom:
              - secretRef:
                  name: firefly-iii-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # Laravel runs DB migrations on first boot, which can take a while -
                  # generous budget so the pod isn't killed mid-migration.
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: firefly-iii
        ports:
          http:
            port: *port
    persistence:
      upload:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /var/www/html/storage/upload

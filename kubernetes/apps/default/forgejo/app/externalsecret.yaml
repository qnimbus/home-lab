---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-admin-secret
    template:
      data:
        password: "{{ .FORGEJO_ADMIN_PASSWORD }}"
        username: "{{ .FORGEJO_ADMIN_USERNAME }}"
      engineVersion: v2
  dataFrom:
    - extract:
        key: forgejo
      rewrite:
        - regexp:
            source: (.*)
            target: FORGEJO_$1

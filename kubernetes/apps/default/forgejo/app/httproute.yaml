---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Forgejo"
    gethomepage.dev/description: "Self-hosted git"
    gethomepage.dev/group: "Development"
    gethomepage.dev/icon: "forgejo"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "forgejo.${DOMAIN_CLUSTER}"
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000

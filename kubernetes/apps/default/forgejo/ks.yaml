---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
    - ../../../../components/postgres
  dependsOn:
    - name: onepassword-store
      namespace: flux-system
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: envoy-gateway-config
      namespace: flux-system
    # ReplicationSource/ReplicationDestination CRDs don't exist until the operator installs
    # them — see bootstrap-ordering rule in CLAUDE.md.
    - name: volsync
      namespace: flux-system
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/forgejo/app
  postBuild:
    substitute:
      APP: *app
      APP_UID: "1000"
      APP_GID: "1000"
      APP_NAME: "Forgejo"
      APP_SUBDOMAIN: forgejo
      POSTGRES_BACKUP_SCHEDULE: "33 0 * * *"
      # The chart's own default persistence claim name — NOT "forgejo" (the
      # component's ${APP} default) — this PVC already exists and is bound
      # with real data; see the retrofit comment in components/volsync/pvc.yaml.
      VOLSYNC_CLAIM: gitea-shared-storage
      VOLSYNC_CAPACITY: 10Gi
      # Deterministic stagger, not hand-picked — generated by scripts/volsync-schedule.py
      # (task volsync:schedule APP=forgejo), which hashes the app name to avoid the
      # component's :00 default (see docs/ROADMAP.md's e1000e packet-drops entry,
      # 2026-09-01, for why unstaggered hourly backups are a real risk). Run
      # `task volsync:check-schedules` after adding/renaming any volsync-backed app.
      VOLSYNC_SCHEDULE: "17 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

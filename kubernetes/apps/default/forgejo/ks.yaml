---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
  labels:
    decryption.flux.home.arpa/disabled: "true"
    # components.postgres/cnpg: init # <-- add this for initialization only
spec:
  components:
    - ../../../../components/postgres
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: envoy-gateway-config
      namespace: network
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: default
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      kind: Cluster
  interval: 1h
  path: ./kubernetes/apps/default/forgejo/app
  postBuild:
    substitute:
      APP: *app
      APP_GID: "1000"
      APP_NAME: "Forgejo"
      APP_SUBDOMAIN: forgejo
      APP_UID: "1000"
      POSTGRES_BACKUP_SCHEDULE: "0 33 0 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

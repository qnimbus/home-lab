---
# yaml-language-server: $schema=https://schemas.clustrs.dev/http.keda.sh/interceptorroute_v1beta1.json
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: firefly-importer
spec:
  coldStart:
    placeholder:
      response:
        body: |
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Starting Firefly III Data Importer…</title>
            <meta http-equiv="refresh" content="3">
            <style>
              body { font-family: system-ui, sans-serif; display: flex; align-items: center;
                     justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
              .card { text-align: center; }
              h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
              p { color: #94a3b8; margin: 0; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Starting Firefly III Data Importer…</h1>
              <p>Scaled down while idle — this page refreshes automatically.</p>
            </div>
          </body>
          </html>
        headers:
          Content-Type: text/html; charset=utf-8
        statusCode: 503
  rules:
    - hosts:
        - "firefly-importer.${DOMAIN_CLUSTER}"
  scalingMetric:
    requestRate:
      targetValue: 1
  target:
    port: 8080
    service: firefly-importer

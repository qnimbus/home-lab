---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wastebin
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wastebin-secret
    template:
      data:
        WASTEBIN_PASSWORD_SALT: "{{ .WASTEBIN_PASSWORD_SALT }}"
        WASTEBIN_SIGNING_KEY: "{{ .WASTEBIN_SIGNING_KEY }}"
  dataFrom:
    - extract:
        key: wastebin
      rewrite:
        - regexp:
            source: (.*)
            target: WASTEBIN_$1

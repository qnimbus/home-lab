---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wastebin
  annotations:
    gethomepage.dev/description: "Pastebin"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Development"
    gethomepage.dev/icon: "sh-wastebin.svg"
    gethomepage.dev/name: "Wastebin"
spec:
  hostnames:
    - "wastebin.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: wastebin
          port: 8088

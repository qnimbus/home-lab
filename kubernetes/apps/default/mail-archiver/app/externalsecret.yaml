---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-archiver
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mail-archiver-secret
    template:
      data:
        Authentication__Password: "{{ .MAIL_ARCHIVER_ADMIN_PASSWORD }}"
        Authentication__Username: "{{ .MAIL_ARCHIVER_ADMIN_USERNAME }}"
        Security__CredentialEncryptionKey: "{{ .MAIL_ARCHIVER_CREDENTIAL_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: mail-archiver
      rewrite:
        - regexp:
            source: (.*)
            target: MAIL_ARCHIVER_$1

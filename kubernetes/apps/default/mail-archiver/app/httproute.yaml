---
# yaml-language-server: $schema=https://schemas.clustrs.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mail-archiver
  annotations:
    gethomepage.dev/description: "Mail archive and search"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Documents"
    gethomepage.dev/icon: "mail-archiver"
    gethomepage.dev/name: "Mail Archiver"
spec:
  hostnames:
    - "mail-archiver.${DOMAIN_CLUSTER}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: mail-archiver
          port: 5000

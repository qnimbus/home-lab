---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-archiver-metrics
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mail-archiver-metrics-secret
  data:
    - secretKey: METRICS_API_KEY
      remoteRef:
        key: mail-archiver
        property: METRICS_API_KEY

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii-importer
  labels:
    decryption.flux.home.arpa/disabled: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/keda/http-scaler
  interval: 1h
  path: ./kubernetes/apps/default/firefly-iii-importer/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: firefly-iii
    - name: onepassword-store
      namespace: external-secrets
    # InterceptorRoute/ScaledObject CRDs don't exist until the add-on's
    # operator installs them — see bootstrap-ordering rule in CLAUDE.md.
    - name: keda-add-ons-http
      namespace: system

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app firefly-iii-importer
spec:
  targetNamespace: default
  components:
    - ../../../../components/keda/http-scaler
  dependsOn:
    - name: keda-add-ons-http
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/default/firefly-iii-importer/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

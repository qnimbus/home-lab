---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-iii-importer
spec:
  interval: 1h
  # KEDA (scaledobject.yaml) scales this Deployment's replicas directly; without
  # this, Flux's drift detection reverts it back to the chart's desired replica
  # count on the next reconcile/drift check, undoing scale-to-zero within the hour.
  driftDetection:
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  chartRef:
    kind: OCIRepository
    name: firefly-iii-importer
  values:
    controllers:
      firefly-iii-importer:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: fireflyiii/data-importer
              # renovate: datasource=docker depName=fireflyiii/data-importer
              tag: "version-2.3.4"
            env:
              FIREFLY_III_URL: "http://firefly-iii.default.svc.cluster.local:8080"
              # Server-to-server calls use the internal URL above; anything sent to the
              # user's browser (OAuth authorize redirect, generated links) must use a
              # browser-reachable URL instead — see Firefly III Data Importer docs.
              VANITY_URL: "https://firefly.${DOMAIN_CLUSTER}"
              TRUSTED_PROXIES: "**"
            envFrom:
              - secretRef:
                  name: firefly-iii-importer-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: firefly-iii-importer
        ports:
          http:
            port: *port

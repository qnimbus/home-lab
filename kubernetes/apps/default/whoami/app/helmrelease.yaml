---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
spec:
  chartRef:
    kind: OCIRepository
    name: whoami
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
    controllers:
      whoami:
        containers:
          app:
            image:
              repository: traefik/whoami
              # renovate: datasource=docker depName=traefik/whoami
              tag: "v1.12.0"
            env:
              # Moves the app off the privileged port 80 default so it can run as non-root
              # without needing NET_BIND_SERVICE. Service port stays 80 via targetPort below.
              WHOAMI_PORT_NUMBER: "8080"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    service:
      app:
        controller: whoami
        ports:
          http:
            port: 80
            targetPort: 8080

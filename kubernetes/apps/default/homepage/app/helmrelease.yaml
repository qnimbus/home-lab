---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homepage
spec:
  chartRef:
    kind: OCIRepository
    name: homepage
  interval: 1h
  values:
    defaultPodOptions:
      # Homepage's "kubernetes" widget and Gateway API service auto-discovery need the
      # cluster-wide read access granted below — v5 defaults this to false.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: *app
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              # renovate: datasource=docker depName=ghcr.io/gethomepage/homepage
              tag: v2.0.0@sha256:638dacf5c844e908dc06c1fd57a2b5694f8efd91f91f152829ea0c2f547458f2
            env:
              HOMEPAGE_ALLOWED_HOSTS: "homepage.${DOMAIN_CLUSTER}"
              # https://gethomepage.dev/configs/mcp/ — read-only; HOMEPAGE_MCP_ALLOW_WRITE is
              # skipped since /app/config is a ConfigMap mount (always read-only in-cluster).
              # No HOMEPAGE_AUTH_ENABLED session auth is configured, so the endpoint relies on
              # HOMEPAGE_MCP_TOKEN (from homepage-secret via envFrom below) for auth instead.
              HOMEPAGE_MCP_ENABLED: "true"
              LOG_LEVEL: "info"
              TZ: "${CLUSTER_TIMEZONE}"
            envFrom:
              - secretRef:
                  name: &secret homepage-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true

    persistence:
      config:
        type: configMap
        name: homepage-config
        globalMounts:
          - path: /app/config
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /app/config/logs
            subPath: logs

    # Read-only, cluster-wide: lets homepage auto-discover services from the
    # gethomepage.dev/* annotations on other apps' HTTPRoutes instead of a hand-maintained
    # services.yaml, and populate the kubernetes cluster/node resource widget.
    rbac:
      bindings:
        *app :
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app
          type: ClusterRoleBinding
      roles:
        *app :
          rules:
            - apiGroups: [""]
              resources: [namespaces, pods, nodes]
              verbs: [get, list]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [httproutes, gateways]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
          type: ClusterRole

    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000

    serviceAccount:
      *app : {}

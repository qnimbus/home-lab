---
# TrueNAS and WAN Failover aren't Kubernetes workloads (no backing pod), so they're listed here
# with siteMonitor (HTTP check) rather than via gethomepage.dev/* annotations + pod-selector,
# which would never resolve. Everything else on the dashboard is auto-discovered — see the
# gethomepage.dev/* annotations on each app's own HTTPRoute.
- RowB:
    - Storage:
        - TrueNAS:
            icon: "mdi-nas"
            href: "https://nas.lan.home.vwn.io"
            description: "NAS storage & NFS/iSCSI targets"
            # Plain HTTP straight to the NAS, not the https:// href above: TrueNAS's UI answers a
            # plain-HTTP request with an absolute http:// redirect, and homepage's server-side fetch
            # (undici) refuses to follow a https->http downgrade — browsers tolerate it fine on the
            # href, so only siteMonitor needs routing around it.
            siteMonitor: "https://nas.lan.home.vwn.io"
- Home Automation:
    - ColA:
        - Home Assistant:
            icon: home-assistant.png
            href: "https://ha.${DOMAIN_CLUSTER}"
            description: Home automation & smart home control
            # url points straight at the device, not the https:// href above — same reasoning as
            # TrueNAS's siteMonitor: a direct hop avoids routing the widget's polling traffic
            # through Envoy for no benefit. No in-cluster Service to target either way — the route
            # uses an Envoy Gateway Backend (network/home-assistant/app/backend.yaml),
            # which has no ClusterIP.
            # widget:
            #   type: homeassistant
            #   url: "http://${HOME_ASSISTANT_LAN_HOST}:8123"
            #   key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"
    - ColB:
        - Gateway:
            icon: "mdi-thermostat"
            href: "http://gw-adam.iot.home.${DOMAIN_IO}"
            description: "Plugwise Adam gateway"
        - Thermostat:
            icon: "mdi-thermostat"
            href: "https://gw-anna.iot.home.${DOMAIN_IO}"
            description: "Plugwise Anna thermostat & heating control"
- RowA:
    - Infrastructure:
        - Cloudflared:
            href: https://dash.cloudflare.com/
            icon: cloudflare-zero-trust.png
            description: Cloudflared Tunnel
            widget:
              type: cloudflared
              accountid: "{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}"
              tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}"
              key: "{{HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN}}"
        - WAN Failover:
            icon: "mdi-router-network"
            # Plain http, not https: this hostname bypasses Envoy Gateway entirely (DNS points
            # straight at the router's LAN IP — see network/external-services/wan-failover), and the
            # router only serves plain HTTP with no TLS termination in front of it.
            href: "http://router.wan-failover.home.${DOMAIN_IO}"
            description: "Failover link status"
            siteMonitor: "http://router.wan-failover.home.${DOMAIN_IO}"
    - Unifi:
        - UniFi Network:
            href: https://gateway.lan.home.${DOMAIN_IO}/network
            icon: si-ubiquiti.svg-#0559C9
            description: UniFi SkyNet Site
            siteMonitor: "https://gateway.lan.home.${DOMAIN_IO}"
        - UniFi Protect:
            href: https://gateway.lan.home.${DOMAIN_IO}/protect
            icon: si-ubiquiti.svg-#DDDDDD
            description: UniFi Protect
            siteMonitor: "https://gateway.lan.home.${DOMAIN_IO}"

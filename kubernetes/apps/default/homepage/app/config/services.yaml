---
# TrueNAS and WAN Failover aren't Kubernetes workloads (no backing pod), so they're listed here
# with siteMonitor (HTTP check) rather than via gethomepage.dev/* annotations + pod-selector,
# which would never resolve. Everything else on the dashboard is auto-discovered — see the
# gethomepage.dev/* annotations on each app's own HTTPRoute.
- RowB:
    - Storage:
        - TrueNAS:
            icon: "mdi-nas"
            href: "https://truenas.${DOMAIN_CLUSTER}"
            description: "NAS storage & NFS/iSCSI targets"
            # Plain HTTP, straight to the in-cluster Service, not the https:// href above: Envoy
            # terminates TLS and forwards plain HTTP to TrueNAS's backend (see
            # network/external-services/truenas/httproute.yaml), and TrueNAS's UI replies to that
            # plain-HTTP leg with an absolute http:// redirect. Homepage's server-side fetch (undici)
            # refuses to follow a https->http downgrade redirect and errors — browsers tolerate it
            # fine on the href above, so only siteMonitor needs to route around it.
            siteMonitor: "http://truenas.network.svc.cluster.local:8080"
- Home Automation:
    - ColA:
        - Home Assistant:
            icon: home-assistant.png
            href: "https://ha.${DOMAIN_CLUSTER}"
            description: Home automation & smart home control
            # url points at the in-cluster Service (network/external-services/home-assistant), not
            # HOME_ASSISTANT_LAN_HOST directly or the https:// href above — same reasoning as
            # TrueNAS's siteMonitor: a direct hop to the already-proxied Service avoids routing the
            # widget's polling traffic through Envoy for no benefit.
            # widget:
            #   type: homeassistant
            #   url: "http://home-assistant.network.svc.cluster.local:8123"
            #   key: {{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}
    - ColB:
        - Gateway:
            icon: "mdi-thermostat"
            href: "http://gw-adam.iot.vwn.io"
            description: "Plugwise Adam gateway"
        - Thermostat:
            icon: "mdi-thermostat"
            href: "https://gw-anna.iot.vwn.io"
            description: "Plugwise Anna thermostat & heating control"
- RowA:
    - Infrastructure:
        - Cloudflared:
            href: https://dash.cloudflare.com/
            icon: cloudflare-zero-trust.png
            description: Cloudflared Tunnel
            widget:
                type: cloudflared
                accountid: {{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}
                tunnelid: {{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}
                key: {{HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN}}
        - WAN Failover:
            icon: "mdi-router-network"
            # Plain http, not https: this hostname bypasses Envoy Gateway entirely (DNS points
            # straight at the router's LAN IP — see network/external-services/wan-failover), and the
            # router only serves plain HTTP with no TLS termination in front of it.
            href: "http://wan-failover.${DOMAIN_CLUSTER}"
            description: "Failover link status"
            siteMonitor: "http://wan-failover.${DOMAIN_CLUSTER}"
    - Unifi:
        - UniFi Network:
            href: https://udm.${DOMAIN_APP}/network
            icon: si-ubiquiti.svg-#0559C9
            description: UniFi SkyNet Site
            siteMonitor: "https://udm.${DOMAIN_APP}"
        - UniFi Protect:
            href: https://udm.${DOMAIN_APP}/protect
            icon: si-ubiquiti.svg-#DDDDDD
            description: UniFi Protect
            siteMonitor: "https://udm.${DOMAIN_APP}"

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
    namespace: flux-system
  values:
    worker:
      # Run on every node, including control-plane — cp-02/cp-03 carry Intel
      # iGPUs and must be labeled too. Mirrors the CoreDNS control-plane
      # toleration (kubernetes/apps/kube-system/coredns/app/helm/values.yaml).
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app node-feature-discovery
  namespace: flux-system
spec:
  targetNamespace: node-feature-discovery
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # wait: true — the intel-device-plugins-gpu Kustomization depends on this one
  # for the NodeFeatureRule CRD and the intel.feature.node.kubernetes.io/gpu
  # node label (see kubernetes/apps/intel-device-plugins/).
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/node-feature-discovery/node-feature-discovery/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: node-feature-discovery

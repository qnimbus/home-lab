---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

repositories:
  - name: cilium
    url: https://helm.cilium.io

releases:
  - name: cilium
    namespace: kube-system
    atomic: true
    chart: cilium/cilium
    # renovate: registryUrl=https://helm.cilium.io chart=cilium
    version: 1.17.6
    values: ['../apps/kube-system/cilium/app/helm/values.yaml']

  - name: coredns
    namespace: kube-system
    atomic: true
    chart: oci://ghcr.io/coredns/charts/coredns
    # renovate: registryUrl=https://ghcr.io/coredns/charts chart=coredns
    version: 1.43.0
    values: ['../apps/kube-system/coredns/app/helm/values.yaml']
    needs: ['kube-system/cilium']

  - name: spegel
    namespace: kube-system
    atomic: true
    chart: oci://ghcr.io/spegel-org/helm-charts/spegel
    # renovate: registryUrl=https://ghcr.io/spegel-org/helm-charts chart=spegel
    version: 0.4.0
    values: ['../apps/kube-system/spegel/app/helm/values.yaml']
    needs: ['kube-system/coredns']

  - name: cert-manager
    namespace: cert-manager
    atomic: true
    createNamespace: true
    chart: oci://quay.io/jetstack/charts/cert-manager
    # renovate: registryUrl=https://quay.io/jetstack/charts chart=cert-manager
    version: v1.17.2
    values: ['../apps/cert-manager/cert-manager/app/helm/values.yaml']
    needs: ['kube-system/spegel']

  - name: flux-operator
    namespace: flux-system
    atomic: true
    createNamespace: true
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    # renovate: registryUrl=https://ghcr.io/controlplaneio-fluxcd/charts chart=flux-operator
    version: 0.23.0
    values: ['../apps/flux-system/flux-operator/app/helm/values.yaml']
    needs: ['cert-manager/cert-manager']

  - name: flux-instance
    namespace: flux-system
    atomic: true
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    # renovate: registryUrl=https://ghcr.io/controlplaneio-fluxcd/charts chart=flux-instance
    version: 0.23.0
    values: ['../apps/flux-system/flux-instance/app/helm/values.yaml']
    needs: ['flux-system/flux-operator']

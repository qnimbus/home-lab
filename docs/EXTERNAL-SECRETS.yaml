# Living inventory of every 1Password vault item this repository depends on.
#
# Two independent mechanisms pull from 1Password — both are tracked below:
#
#   1. eso   — External Secrets Operator, via the `onepassword` ClusterSecretStore.
#              Reconciles continuously (see each item's `refresh_interval`). This is
#              how almost every application secret reaches the cluster.
#   2. boot  — One-shot `op read` calls in `ops/bootstrap/mod.just`'s `resources`
#              recipe. These run BEFORE ESO exists (they create the Secret that lets
#              ESO's own onepassword-connect pod authenticate), so they cannot go
#              through ESO themselves — chicken-and-egg.
#
# `import_mode` per item:
#   - wildcard: ExternalSecret uses `dataFrom: [{extract: {key: <item>}}]` — ALL
#     fields on the item are pulled in, then optionally renamed via `rewrite`
#     regexps. `known_fields` lists the RAW 1Password field names (reverse-mapped
#     through any `rewrite`) for fields actually referenced downstream in the
#     ExternalSecret's `target.template` — the item may hold additional fields
#     nobody consumes yet. These are inferred from the rewrite regexps, not
#     verified against the live vault — see step 7 below to verify against `op`.
#   - explicit: ExternalSecret uses `data: [{secretKey, remoteRef: {key, property}}]`
#     — only the named fields are pulled, 1:1, no rewrite.
#
# See "How to keep this up to date" at the bottom before editing by hand.
#
# vault: homelab
# last_verified: 2026-08-03
# last_verified_commit: 42bf350

secret_store:
  kind: ClusterSecretStore
  name: onepassword
  vault: homelab # mapped to internal 1Password Connect vault ID 1
  manifest: kubernetes/apps/external-secrets/external-secrets/stores/onepassword/clustersecretstore.yaml

items:
  # ── Bootstrap-tier (op read, pre-ESO) ──────────────────────────────────────
  - name: sops
    mechanism: boot
    import_mode: explicit
    fields: [SOPS_PRIVATE_KEY]
    consumers:
      - kind: Secret
        name: sops-age
        namespace: flux-system
        manifest: ops/bootstrap/mod.just
        note: age private key Flux/SOPS uses to decrypt *.sops.yaml in-cluster

  - name: HomeLab Credentials File
    mechanism: boot
    import_mode: explicit
    fields: ["1password-credentials.json"]
    consumers:
      - kind: Secret
        name: onepassword-connect-secrets
        namespace: external-secrets
        manifest: ops/bootstrap/mod.just
        note: 1Password Connect server credentials file

  - name: HomeLab Access Token
    mechanism: boot
    import_mode: explicit
    fields: [credential]
    consumers:
      - kind: Secret
        name: onepassword-connect-secrets
        namespace: external-secrets
        manifest: ops/bootstrap/mod.just
        note: "token key in same Secret as above; 1Password Connect API token"

  - name: GitHub App
    mechanism: boot+eso # dual path — see note
    import_mode: explicit
    fields: [githubAppID, githubAppInstallationID, githubAppPrivateKey]
    consumers:
      - kind: Secret
        name: flux-github-app
        namespace: flux-system
        manifest: ops/bootstrap/mod.just
        note: >-
          bootstrap-time creation so Flux can authenticate to GitHub before ESO
          exists; once ESO is up, the ExternalSecret below reconciles the SAME
          Secret going forward (bootstrap value is a one-time seed)
      - kind: ExternalSecret
        name: flux-github-app
        namespace: flux-system
        manifest: kubernetes/apps/flux-system/flux-instance/app/externalsecret.yaml
        refresh_interval: 1h

  # ── ESO-tier (ClusterSecretStore: onepassword) ─────────────────────────────
  - name: actions-runner
    mechanism: eso
    import_mode: wildcard
    known_fields: [APP_ID, INSTALLATION_ID, PRIVATE_KEY]
    consumers:
      - kind: ExternalSecret
        name: home-lab-runner
        namespace: actions-runner-system
        manifest: kubernetes/apps/actions-runner-system/actions-runner-controller/runners/home-lab/externalsecret.yaml
      - kind: ExternalSecret
        name: home-lab-readonly-runner
        namespace: actions-runner-system
        manifest: kubernetes/apps/actions-runner-system/actions-runner-controller/runners/home-lab-readonly/externalsecret.yaml

  - name: waha
    mechanism: eso
    import_mode: wildcard
    known_fields: [username, password, API_KEY_HASH, API_KEY_PLAIN, HOOK_HMAC_KEY]
    consumers:
      - kind: ExternalSecret
        name: waha
        namespace: automation
        manifest: kubernetes/apps/automation/waha/app/externalsecret.yaml

  - name: cloudflared
    mechanism: eso
    import_mode: wildcard
    known_fields: [ACCOUNT_TAG, API_TOKEN, TUNNEL_ID, TUNNEL_TOKEN]
    consumers:
      - kind: ExternalSecret
        name: cert-manager-cloudflare
        namespace: cert-manager
        manifest: kubernetes/apps/cert-manager/cluster-issuers/app/externalsecret.yaml
        fields_used: [API_TOKEN]
      - kind: ExternalSecret
        name: cloudflare-tunnel
        namespace: network
        manifest: kubernetes/apps/network/cloudflared/app/externalsecret.yaml
        fields_used: [TUNNEL_TOKEN]
      - kind: ExternalSecret
        name: external-dns-cloudflare
        namespace: network
        manifest: kubernetes/apps/network/external-dns/cloudflare/externalsecret.yaml
        fields_used: [API_TOKEN]
      - kind: ExternalSecret
        name: homepage
        namespace: default
        manifest: kubernetes/apps/default/homepage/app/externalsecret.yaml
        fields_used: [ACCOUNT_TAG, API_TOKEN, TUNNEL_ID]

  - name: cloudnative-pg
    mechanism: eso
    import_mode: wildcard
    known_fields: [SUPER_USER, SUPER_PASS, S3_ACCESS_KEY, S3_SECRET_KEY]
    consumers:
      - kind: ExternalSecret
        name: cloudnative-pg
        namespace: database
        manifest: kubernetes/apps/database/cloudnative-pg/cluster/app/externalsecret.yaml
        fields_used: [SUPER_USER, SUPER_PASS, S3_ACCESS_KEY, S3_SECRET_KEY]
      - kind: ExternalSecret
        name: pgadmin
        namespace: database
        manifest: kubernetes/apps/database/pgadmin/app/externalsecret.yaml
        fields_used: [SUPER_USER, SUPER_PASS]
        note: pgadmin reuses this item to pre-register the CNPG server + pgpass file

  - name: pgadmin
    mechanism: eso
    import_mode: wildcard
    known_fields: [DEFAULT_EMAIL, DEFAULT_PASSWORD]
    consumers:
      - kind: ExternalSecret
        name: pgadmin
        namespace: database
        manifest: kubernetes/apps/database/pgadmin/app/externalsecret.yaml

  - name: homepage
    mechanism: eso
    import_mode: wildcard
    known_fields:
      [
        HOMEASSISTANT_TOKEN,
        KAGI_SESSION_TOKEN,
        LATITUDE,
        LONGITUDE,
        MCP_TOKEN,
        OPENWEATHERMAP_API_KEY,
        TRUENAS_API_KEY,
        UNIFI_API_KEY,
      ]
    consumers:
      - kind: ExternalSecret
        name: homepage
        namespace: default
        manifest: kubernetes/apps/default/homepage/app/externalsecret.yaml

  - name: firefly-III
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> FIREFLY_$1
    known_fields:
      [APP_KEY, STATIC_CRON_TOKEN, SITE_OWNER, DB_USERNAME, DB_PASSWORD, ACCESS_TOKEN]
    consumers:
      - kind: ExternalSecret
        name: firefly-iii
        namespace: finance
        manifest: kubernetes/apps/finance/firefly-iii/app/externalsecret.yaml
        fields_used: [APP_KEY, STATIC_CRON_TOKEN, SITE_OWNER, DB_USERNAME, DB_PASSWORD]
      - kind: ExternalSecret
        name: firefly-iii-db
        namespace: database
        manifest: kubernetes/apps/finance/firefly-iii/db/externalsecret.yaml
        fields_used: [DB_USERNAME, DB_PASSWORD]
      - kind: ExternalSecret
        name: firefly-iii-importer
        namespace: finance
        manifest: kubernetes/apps/finance/firefly-iii-importer/app/externalsecret.yaml
        fields_used: [ACCESS_TOKEN]
        note: >-
          Previously referenced the template as .FIREFLY_III_ACCESS_TOKEN with no rewrite
          in place — a stale key that never matched the raw ACCESS_TOKEN field, so this
          value silently rendered empty. Fixed alongside adding the FIREFLY_$1 rewrite.

  - name: forgejo
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> FORGEJO_$1
    known_fields: [ADMIN_USERNAME, ADMIN_PASSWORD, DB_USERNAME, DB_PASSWORD]
    consumers:
      - kind: ExternalSecret
        name: forgejo
        namespace: development
        manifest: kubernetes/apps/development/forgejo/app/externalsecret.yaml
        fields_used: [ADMIN_USERNAME, ADMIN_PASSWORD, DB_PASSWORD]
        note: >-
          DB_PASSWORD duplicated here (also pulled by the forgejo-db consumer below) —
          the Forgejo pod runs in `development` and can't reference the `database`-namespace
          forgejo-db-secret across namespaces, so GITEA__DATABASE__PASSWD reads from this
          same-namespace copy instead (mirrors firefly-III's identical two-secret split).
      - kind: ExternalSecret
        name: forgejo-db
        namespace: database
        manifest: kubernetes/apps/development/forgejo/db/externalsecret.yaml
        fields_used: [DB_USERNAME, DB_PASSWORD]

  - name: flux
    mechanism: eso
    import_mode: wildcard
    known_fields: [GITHUB_WEBHOOK_TOKEN]
    consumers:
      - kind: ExternalSecret
        name: github-webhook-token
        namespace: flux-system
        manifest: kubernetes/apps/flux-system/flux-receiver/app/externalsecret.yaml

  - name: unifi
    mechanism: eso
    import_mode: wildcard
    known_fields: [HOST, API_KEY]
    consumers:
      - kind: ExternalSecret
        name: external-dns-unifi
        namespace: network
        manifest: kubernetes/apps/network/external-dns/unifi/externalsecret.yaml
      - kind: ExternalSecret
        name: unpoller
        namespace: observability
        manifest: kubernetes/apps/observability/unpoller/app/externalsecret.yaml
      - kind: ExternalSecret
        name: unifi-voucher-site
        namespace: default
        manifest: kubernetes/apps/default/unifi-voucher-site/app/externalsecret.yaml
        fields_used: [HOST, API_KEY]
        note: >-
          Unlike the other two consumers, this one reshapes the raw fields via
          target.template instead of a flat rewrite: HOST (a full base URL, e.g.
          https://10.60.0.1) is split into UNIFI_IP (scheme/trailing-slash stripped)
          + a hardcoded UNIFI_PORT: "443", and API_KEY is renamed to UNIFI_TOKEN —
          the field names unifi-voucher-site's own env vars expect.

  - name: grafana
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> GRAFANA_$1
    known_fields: [ADMIN_PASSWORD]
    consumers:
      - kind: ExternalSecret
        name: grafana-admin
        namespace: observability
        manifest: kubernetes/apps/observability/kube-prometheus-stack/app/externalsecret.yaml

  - name: alertmanager
    mechanism: eso
    import_mode: wildcard
    known_fields: [PUSHOVER_TOKEN, PUSHOVER_USER_KEY]
    consumers:
      - kind: ExternalSecret
        name: alertmanager
        namespace: observability
        manifest: kubernetes/apps/observability/kube-prometheus-stack/app/externalsecret.yaml

  - name: rook-ceph
    mechanism: eso
    import_mode: wildcard
    known_fields: [password]
    consumers:
      - kind: ExternalSecret
        name: rook-ceph-dashboard
        namespace: rook-ceph
        manifest: kubernetes/apps/rook-ceph/rook-ceph/operator/app/externalsecret.yaml

  - name: dragonfly
    mechanism: eso
    import_mode: wildcard
    known_fields: [password]
    consumers:
      - kind: ExternalSecret
        name: dragonfly
        namespace: database
        manifest: kubernetes/apps/database/dragonfly/cluster/app/externalsecret.yaml
        fields_used: [password]
        note: >-
          Feeds spec.authentication.passwordFromSecret on the database-namespace
          Dragonfly CR. Cluster-wide shared instance — future consumers in other
          namespaces (e.g. a paused paperless-ngx plan targeting `documents`) will
          need their own same-namespace ExternalSecret pulling this same item (no
          cross-namespace secretKeyRef mechanism exists in this repo — same
          per-namespace duplication pattern as firefly-III/forgejo).
      - kind: ExternalSecret
        name: paperless-ngx
        namespace: documents
        manifest: kubernetes/apps/documents/paperless-ngx/app/externalsecret.yaml
        fields_used: [password]
        note: >-
          First cross-namespace Dragonfly consumer. Extracted alongside the `paperless`
          item in the same ExternalSecret and rewritten to DRAGONFLY_$1 (matching the
          dragonfly consumer above) so PAPERLESS_REDIS can be templated inline as
          redis://:{{ .DRAGONFLY_PASSWORD | urlquery }}@dragonfly.database.svc.cluster.local:6379/0
          — piped through Sprig's `urlquery` since 2026-08 (see open-webui's note below for
          why: an un-encoded "#" in this password broke URL parsing for an async client).
      - kind: ExternalSecret
        name: open-webui
        namespace: ai
        manifest: kubernetes/apps/ai/open-webui/app/externalsecret.yaml
        fields_used: [password]
        note: >-
          Second cross-namespace Dragonfly consumer, db index 1 (paperless-ngx above owns
          index 0). WEBSOCKET_REDIS_URL templated inline the same way as PAPERLESS_REDIS,
          also piped through `urlquery` — see the open-webui item below for the full
          incident this pattern was introduced to fix.

  - name: paperless
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> PAPERLESS_$1
    known_fields:
      [DB_USER, DB_PASSWORD, SECRET_KEY, ADMIN_USER, ADMIN_MAIL, ADMIN_PASSWORD]
    consumers:
      - kind: ExternalSecret
        name: paperless-ngx
        namespace: documents
        manifest: kubernetes/apps/documents/paperless-ngx/app/externalsecret.yaml
        fields_used:
          [DB_USER, DB_PASSWORD, SECRET_KEY, ADMIN_USER, ADMIN_MAIL, ADMIN_PASSWORD]
        note: >-
          DB_USER/DB_PASSWORD duplicated here (also pulled by the paperless-ngx-db
          consumer below) — the paperless-ngx pod runs in `documents` and can't reference
          the `database`-namespace paperless-db-secret across namespaces, so
          PAPERLESS_DBUSER/PAPERLESS_DBPASS read from this same-namespace copy instead
          (mirrors firefly-III/forgejo's identical two-secret split). Two-stage renaming:
          the rewrite prefixes raw fields (DB_USER -> PAPERLESS_DB_USER, ...), then
          target.template remaps those to the app-specific env var names the container
          actually expects (PAPERLESS_DBUSER, PAPERLESS_SECRET_KEY, ...).
      - kind: ExternalSecret
        name: paperless-ngx-db
        namespace: database
        manifest: kubernetes/apps/documents/paperless-ngx/db/externalsecret.yaml
        fields_used: [DB_USER, DB_PASSWORD]

  - name: tailscale
    mechanism: eso
    import_mode: wildcard
    known_fields: [CLIENT_ID, CLIENT_SECRET]
    consumers:
      - kind: ExternalSecret
        name: tailscale-operator
        namespace: tailscale
        manifest: kubernetes/apps/tailscale/tailscale-operator/app/externalsecret.yaml

  - name: volsync-restic
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> RESTIC_$1
    known_fields: [PASSWORD] # 1Password field renamed from RESTIC_PASSWORD to PASSWORD
    note: >-
      Shared by every app onboarded onto the reusable components/volsync Kustomize
      component (postBuild.substitute APP=<app>) — one 1Password item backs a
      per-app-named ExternalSecret/Secret instance in each consumer's own namespace.
      Field was originally named RESTIC_PASSWORD (baking the mnemonic in at the
      1Password layer, bypassing rewrite); renamed to PASSWORD so it follows the
      same "unprefixed field, rewrite adds the prefix" convention as every other
      item — the resulting Secret key (RESTIC_PASSWORD) is unchanged.
    manifest: kubernetes/components/volsync/externalsecret.yaml
    consumers:
      - kind: ExternalSecret
        name: waha-volsync
        namespace: automation
        via_component: kubernetes/apps/automation/waha/ks.yaml
      - kind: ExternalSecret
        name: pgadmin-volsync
        namespace: database
        via_component: kubernetes/apps/database/pgadmin/ks.yaml
      - kind: ExternalSecret
        name: firefly-iii-volsync
        namespace: finance
        via_component: kubernetes/apps/finance/firefly-iii/ks.yaml
      - kind: ExternalSecret
        name: forgejo-volsync
        namespace: development
        via_component: kubernetes/apps/development/forgejo/ks.yaml
      - kind: ExternalSecret
        name: paperless-ngx-volsync
        namespace: documents
        via_component: kubernetes/apps/documents/paperless-ngx/ks.yaml
      - kind: ExternalSecret
        name: open-webui-volsync
        namespace: ai
        via_component: kubernetes/apps/ai/open-webui/ks.yaml
      - kind: ExternalSecret
        name: prowlarr-volsync
        namespace: downloads
        via_component: kubernetes/apps/downloads/prowlarr/ks.yaml
      - kind: ExternalSecret
        name: sonarr-volsync
        namespace: downloads
        via_component: kubernetes/apps/downloads/sonarr/ks.yaml
      - kind: ExternalSecret
        name: radarr-volsync
        namespace: downloads
        via_component: kubernetes/apps/downloads/radarr/ks.yaml
      - kind: ExternalSecret
        name: sabnzbd-volsync
        namespace: downloads
        via_component: kubernetes/apps/downloads/sabnzbd/ks.yaml

  - name: smb-credentials
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> SMB_$1
    known_fields: [USERNAME, PASSWORD]
    note: >-
      Username/password csi-driver-smb's consumers use via nodeStageSecretRef when
      mounting SMB shares (csi-driver-smb itself is still driver-only — no dynamic
      StorageClass, see docs/ROADMAP.md "Future Storage Options"). First real consumer:
      paperless-ngx's hand-authored static PersistentVolumes.
    consumers:
      - kind: ExternalSecret
        name: smb-credentials
        namespace: csi-driver-smb
        manifest: kubernetes/apps/system/csi-driver-smb/app/externalsecret.yaml
        fields_used: [USERNAME, PASSWORD]
      - kind: PersistentVolume
        name: paperless-ngx-smb-archive
        manifest: kubernetes/apps/documents/paperless-ngx/app/pv.yaml
        note: >-
          nodeStageSecretRef cross-namespace reference to csi-driver-smb's
          smb-credentials Secret; PV itself is cluster-scoped (no namespace)
      - kind: PersistentVolume
        name: paperless-ngx-smb-backup
        manifest: kubernetes/apps/documents/paperless-ngx/app/pv.yaml
        note: nodeStageSecretRef cross-namespace reference, same as above

  - name: smtp-relay
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> RELAYHOST_$1
    known_fields: [HOST, PORT, USERNAME, PASSWORD]
    note: >-
      Upstream authenticated relay credentials for the maddy SMTP relay used by
      the home printer (and future LAN appliances).
    consumers:
      - kind: ExternalSecret
        name: smtp-relay
        namespace: mail
        manifest: kubernetes/apps/mail/smtp-relay/app/externalsecret.yaml
        fields_used: [HOST, PORT, USERNAME, PASSWORD]

  - name: open-webui
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> OPENWEBUI_$1
    known_fields:
      [DB_USER, DB_PASSWORD, SECRET_KEY, ADMIN_NAME, ADMIN_EMAIL, ADMIN_PASSWORD]
    consumers:
      - kind: ExternalSecret
        name: open-webui
        namespace: ai
        manifest: kubernetes/apps/ai/open-webui/app/externalsecret.yaml
        fields_used:
          [DB_USER, DB_PASSWORD, SECRET_KEY, ADMIN_NAME, ADMIN_EMAIL, ADMIN_PASSWORD]
        note: >-
          DB_USER/DB_PASSWORD duplicated here (also pulled by the open-webui-db consumer
          below) — same cross-namespace split as paperless/firefly-III/forgejo, since the
          open-webui pod runs in `ai` and can't reference the `database`-namespace
          open-webui-db-secret directly. DATABASE_URL and WEBSOCKET_REDIS_URL are both
          built inline in target.template, passwords piped through Sprig's `urlquery`:
          confirmed live that a raw "#" in the Dragonfly password broke URL parsing for
          open-webui's eager-imported async redis client (module-import-time connection,
          not lazy), crashing the pod outright on every boot — CrashLoopBackOff, not a
          runtime error. ADMIN_NAME/ADMIN_EMAIL/ADMIN_PASSWORD are consumed only by
          job-bootstrap-admin.yaml's one-shot signup call, not the app container itself.
      - kind: ExternalSecret
        name: open-webui-db
        namespace: database
        manifest: kubernetes/apps/ai/open-webui/db/externalsecret.yaml
        fields_used: [DB_USER, DB_PASSWORD]

  # ── downloads/*arr stack (not yet live — see docs/POTENTIAL-DEPLOYMENTS.md) ─
  # API keys are pre-seeded rather than left to auto-generate on first boot, so they're
  # known in advance for Prowlarr's Applications config and Sonarr/Radarr's download-client
  # config. None of these four 1Password items exist yet as of this writing — the
  # ExternalSecrets/Kustomizations will stay un-Ready until they're created.
  - name: prowlarr
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> PROWLARR_$1
    known_fields: [API_KEY]
    consumers:
      - kind: ExternalSecret
        name: prowlarr
        namespace: downloads
        manifest: kubernetes/apps/downloads/prowlarr/app/externalsecret.yaml

  - name: sonarr
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> SONARR_$1
    known_fields: [API_KEY]
    consumers:
      - kind: ExternalSecret
        name: sonarr
        namespace: downloads
        manifest: kubernetes/apps/downloads/sonarr/app/externalsecret.yaml

  - name: radarr
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> RADARR_$1
    known_fields: [API_KEY]
    consumers:
      - kind: ExternalSecret
        name: radarr
        namespace: downloads
        manifest: kubernetes/apps/downloads/radarr/app/externalsecret.yaml

  - name: sabnzbd
    mechanism: eso
    import_mode: wildcard # rewrite: (.*) -> SABNZBD_$1
    known_fields: [API_KEY, NZB_KEY]
    consumers:
      - kind: ExternalSecret
        name: sabnzbd
        namespace: downloads
        manifest: kubernetes/apps/downloads/sabnzbd/app/externalsecret.yaml

  # ── Both-direction items (network/certificates) ────────────────────────────
  # Unlike every item above, these 5 are not just read by an ExternalSecret — they
  # are WRITTEN by a PushSecret (certificates-export) from the live cert-manager
  # Secret, and READ by an ExternalSecret (certificates-import, refreshPolicy:
  # CreatedOnce) to restore that Secret on a from-scratch rebuild, before
  # cert-manager ever reconciles. See docs/ROADMAP.md > "Multi-Domain Certificate
  # Pipeline" for the full design. Each item's `consumers` list includes both the
  # reading ExternalSecret and the writing PushSecret; PushSecret entries are
  # marked "(producer, not consumer)" in their note.
  - name: vwn-app-tls
    mechanism: eso
    import_mode: explicit
    fields: [tls.crt, tls.key]
    consumers:
      - kind: ExternalSecret
        name: vwn-app-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/import/externalsecrets.yaml
        note: restores the TLS Secret from 1Password before cert-manager reconciles (refreshPolicy CreatedOnce, creationPolicy Orphan)
      - kind: PushSecret
        name: vwn-app-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/export/pushsecrets.yaml
        note: "(producer, not consumer) writes the live cert-manager-issued tls.crt/tls.key into this item on every renewal"

  - name: vwn-casa-tls
    mechanism: eso
    import_mode: explicit
    fields: [tls.crt, tls.key]
    consumers:
      - kind: ExternalSecret
        name: vwn-casa-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/import/externalsecrets.yaml
        note: restores the TLS Secret from 1Password before cert-manager reconciles (refreshPolicy CreatedOnce, creationPolicy Orphan)
      - kind: PushSecret
        name: vwn-casa-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/export/pushsecrets.yaml
        note: "(producer, not consumer) writes the live cert-manager-issued tls.crt/tls.key into this item on every renewal"

  - name: cluster-vwn-io-tls
    mechanism: eso
    import_mode: explicit
    fields: [tls.crt, tls.key]
    consumers:
      - kind: ExternalSecret
        name: cluster-vwn-io-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/import/externalsecrets.yaml
        note: restores the TLS Secret from 1Password before cert-manager reconciles (refreshPolicy CreatedOnce, creationPolicy Orphan)
      - kind: PushSecret
        name: cluster-vwn-io-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/export/pushsecrets.yaml
        note: "(producer, not consumer) writes the live cert-manager-issued tls.crt/tls.key into this item on every renewal"

  - name: apps-vwn-io-tls
    mechanism: eso
    import_mode: explicit
    fields: [tls.crt, tls.key]
    consumers:
      - kind: ExternalSecret
        name: apps-vwn-io-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/import/externalsecrets.yaml
        note: restores the TLS Secret from 1Password before cert-manager reconciles (refreshPolicy CreatedOnce, creationPolicy Orphan)
      - kind: PushSecret
        name: apps-vwn-io-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/export/pushsecrets.yaml
        note: "(producer, not consumer) writes the live cert-manager-issued tls.crt/tls.key into this item on every renewal"

  - name: vwn-io-tls
    mechanism: eso
    import_mode: explicit
    fields: [tls.crt, tls.key]
    consumers:
      - kind: ExternalSecret
        name: vwn-io-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/import/externalsecrets.yaml
        note: restores the TLS Secret from 1Password before cert-manager reconciles (refreshPolicy CreatedOnce, creationPolicy Orphan)
      - kind: PushSecret
        name: vwn-io-tls
        namespace: network
        manifest: kubernetes/apps/network/certificates/export/pushsecrets.yaml
        note: "(producer, not consumer) writes the live cert-manager-issued tls.crt/tls.key into this item on every renewal"

# ─────────────────────────────────────────────────────────────────────────────
# How to keep this up to date
# ─────────────────────────────────────────────────────────────────────────────
#
# Re-run after adding/removing an ExternalSecret, changing a dataFrom/data block,
# or touching ops/bootstrap/mod.just's `resources` recipe. There is no automated
# generator (yet) — this file is hand-maintained from the commands below.
#
# 1. Find every ExternalSecret manifest in the GitOps tree:
#      grep -rl "kind: ExternalSecret" kubernetes/
#
# 2. Confirm the ClusterSecretStore (vault name + provider) hasn't changed:
#      cat kubernetes/apps/external-secrets/external-secrets/stores/onepassword/clustersecretstore.yaml
#
# 3. For each ExternalSecret file, read spec.dataFrom (wildcard — note the `extract.key`
#    item name and any `rewrite` regexps) or spec.data (explicit — note each
#    `remoteRef.key` / `remoteRef.property` pair). Cross-reference spec.target.template
#    to see which imported fields are actually consumed downstream.
#
# 4. Find the Kustomize component consumers (shared items like volsync-restic) —
#    the component itself only defines the ExternalSecret template once:
#      grep -rl "components/volsync" kubernetes/apps/
#    then check each consumer's ks.yaml `postBuild.substitute.APP` for the
#    per-app Secret name.
#
# 5. Check for the second (non-ESO) mechanism — bootstrap-time `op read`/`op inject`
#    calls that run before ESO exists:
#      grep -rn "op read\|op inject\|op://" ops/ .taskfiles/ scripts/
#    (as of this writing: ops/bootstrap/mod.just's `resources` recipe is
#    authoritative; ops/bootstrap/resources.yaml.j2 is a superseded/unused
#    declarative draft of the same 3 secrets — kept for reference, not invoked
#    by any task)
#
# 6. Get each ExternalSecret's target namespace from its owning ks.yaml
#    (spec.targetNamespace), not from directory conventions alone — some apps
#    split across namespaces (e.g. firefly-iii's `app` Kustomization targets
#    `finance` while its `db` Kustomization targets `database`).
#
# 7. To see actual field names/values live (requires 1Password CLI + vault
#    access — see CLAUDE.md → Secrets Management for OP_SERVICE_ACCOUNT_TOKEN):
#      op item get "<item name>" --vault homelab
#      op item get "<item name>" --vault homelab --format json | jq '.fields[].label'
#
# Update `last_verified` / `last_verified_commit` at the top after each pass.

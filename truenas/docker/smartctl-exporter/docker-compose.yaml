---
services:
  smartctl-exporter:
    image: quay.io/prometheuscommunity/smartctl-exporter:${SMARTCTL_EXPORTER_VERSION}
    restart: always
    # Needs raw SMART ioctl access across all block devices (runs `smartctl --scan`
    # itself) — privileged+root is upstream's documented requirement.
    privileged: true
    user: root
    ports:
      - "9633:9633"

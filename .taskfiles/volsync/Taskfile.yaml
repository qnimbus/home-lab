# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: '3'

tasks:

  schedule:
    desc: Print the deterministic VOLSYNC_SCHEDULE cron string for an app [APP=...]
    summary: |
      Resolves APP together with every app currently using the volsync component
      (kubernetes/components/volsync) and prints the collision-free minute assigned
      to APP — paste the result into that app's ks.yaml as VOLSYNC_SCHEDULE.

      Example:
        task volsync:schedule APP=jellyfin
    dir: '{{.ROOT_DIR}}'
    vars:
      APP: '{{.APP | default ""}}'
    preconditions:
      - sh: test -n "{{.APP}}"
        msg: "Usage: task volsync:schedule APP=<app-name>"
      - which python3
    cmd: python3 scripts/volsync-schedule.py compute "{{.APP}}"

  check-schedules:
    desc: Audit every volsync-component app for a missing, diverged, or colliding VOLSYNC_SCHEDULE
    summary: |
      Run after adding, removing, or renaming any app that uses the volsync
      component — verifies every app's committed VOLSYNC_SCHEDULE still matches
      the deterministic assignment and that no two apps share a minute. Exits
      non-zero if it finds a problem.
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - which python3
    cmd: python3 scripts/volsync-schedule.py check

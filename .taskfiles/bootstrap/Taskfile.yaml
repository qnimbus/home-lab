# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: '3'

tasks:

  cluster:
    desc: Full cluster bootstrap sequence (gensecret, genconfig, apply-all, bootstrap, kubeconfig)
    cmds:
      - '[ -f {{.TALOS_DIR}}/talsecret.sops.yaml ] || talhelper gensecret -c {{.TALOS_DIR}}/talconfig.yaml | sops --filename-override {{.TALOS_DIR}}/talsecret.sops.yaml --encrypt /dev/stdin > {{.TALOS_DIR}}/talsecret.sops.yaml'
      - task: :talos:genconfig
      # Wipe OSD disks before applying config — nodes are in maintenance mode here.
      # Clears stale LVM metadata from a prior cluster so Rook can claim the disks.
      # No-ops gracefully when disks are already clean or no nodes are in maintenance.
      - task: :talos:wipe-ceph-osds
      - task: :talos:apply-all
      - task: :talos:bootstrap
      - task: :talos:kubeconfig
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - test -f {{.TALOS_DIR}}/talenv.yaml
      - which talhelper
      - which talosctl
      - which sops

  secrets:
    desc: Seed all Flux bootstrap secrets (SOPS age key, 1Password Connect creds, GitHub App) — idempotent
    cmds:
      - task: sops-age
      - task: onepassword-connect-secret
      - task: flux-github-app

  flux-github-app:
    internal: true
    vars:
      VAULT: '{{.VAULT | default "homelab"}}'
      ITEM:  '{{.ITEM  | default "GitHub App"}}'
    cmds:
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply --server-side -f -
      - |
        kubectl create secret generic flux-github-app \
          --namespace flux-system \
          --from-literal="githubAppID=$(op read 'op://{{.VAULT}}/{{.ITEM}}/githubAppID')" \
          --from-literal="githubAppInstallationID=$(op read 'op://{{.VAULT}}/{{.ITEM}}/githubAppInstallationID')" \
          --from-literal="githubAppPrivateKey=$(op read 'op://{{.VAULT}}/{{.ITEM}}/githubAppPrivateKey')" \
          --dry-run=client -o yaml | kubectl apply -f -
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which op
      - sh: test -n "$OP_SERVICE_ACCOUNT_TOKEN"
        msg: "OP_SERVICE_ACCOUNT_TOKEN not set — export it in your WSL2 host shell before starting devcontainer"
      - which kubectl

  age-key:
    desc: Fetch SOPS age private key from 1Password and write to age.key [VAULT=homelab ITEM="SOPS age key" FIELD=text]
    vars:
      VAULT: '{{.VAULT | default "homelab"}}'
      ITEM:  '{{.ITEM  | default "SOPS age key"}}'
      FIELD: '{{.FIELD | default "text"}}'
    cmds:
      - |
        KEY=$(op read "op://{{.VAULT}}/{{.ITEM}}/{{.FIELD}}")
        [[ -n "${KEY}" ]] || { echo "ERROR: 1Password returned empty value" >&2; exit 1; }
        [[ "${KEY}" == AGE-SECRET-KEY-1* ]] || { echo "ERROR: value does not look like an age private key" >&2; exit 1; }
        printf '%s\n' "${KEY}" > "${SOPS_AGE_KEY_FILE}"
        chmod 600 "${SOPS_AGE_KEY_FILE}"
        echo "Age key written to ${SOPS_AGE_KEY_FILE}"
    preconditions:
      - which op
      - sh: test -n "$OP_SERVICE_ACCOUNT_TOKEN"
        msg: "OP_SERVICE_ACCOUNT_TOKEN not set — export it in your WSL2 host shell before starting devcontainer"

  onepassword-connect-secret:
    internal: true
    vars:
      VAULT: '{{.VAULT | default "homelab"}}'
    cmds:
      - kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply --server-side -f -
      - |
        kubectl create secret generic onepassword-connect-secrets \
          --namespace external-secrets \
          --from-literal="1password-credentials.json=$(op read 'op://{{.VAULT}}/HomeLab Credentials File/1password-credentials.json')" \
          --from-literal="token=$(op read 'op://{{.VAULT}}/HomeLab Access Token/credential')" \
          --dry-run=client -o yaml | kubectl apply -f -
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which op
      - sh: test -n "$OP_SERVICE_ACCOUNT_TOKEN"
        msg: "OP_SERVICE_ACCOUNT_TOKEN not set — export it in your WSL2 host shell before starting devcontainer"
      - which kubectl

  sops-age:
    internal: true
    cmds:
      - kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply --server-side -f -
      - |
        kubectl create secret generic sops-age \
          --namespace=flux-system \
          --from-file=age.agekey=$SOPS_AGE_KEY_FILE \
          --dry-run=client -o yaml | kubectl apply -f -
    preconditions:
      - test -f $KUBECONFIG
      - test -f $SOPS_AGE_KEY_FILE
      - which kubectl

  apps:
    desc: Bootstrap apps into the cluster via helmfile (CRDs → Cilium → CoreDNS → Spegel → cert-manager → Flux) — FIRST BOOT ONLY; day-2 upgrades are handled by Flux via Renovate PRs
    cmds:
      # Phase 0: pre-install CRDs from charts managed by Flux (not the bootstrap
      # apps) so that Flux Kustomizations containing raw ServiceMonitor/HTTPRoute
      # manifests can pass dry-run validation immediately on first reconcile.
      # Uses `helmfile template | kubectl apply --server-side` — no Helm release
      # Secret is written, no namespace needs to exist yet.
      # See kubernetes/bootstrap/helmfile.d/00-crds.yaml for full explanation.
      - helmfile -f {{.KUBERNETES_DIR}}/bootstrap/helmfile.d/00-crds.yaml template --quiet | yq ea 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side -f -
      # Phase 1: install the minimal controllers Flux needs to start reconciling.
      - helmfile sync -f {{.KUBERNETES_DIR}}/bootstrap/helmfile.d/01-apps.yaml
    preconditions:
      - test -f {{.KUBECONFIG}}
      - test -d {{.KUBERNETES_DIR}}/bootstrap/helmfile.d
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which helmfile
      - which yq

# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: '3'

tasks:

  cluster:
    desc: Full cluster bootstrap sequence (gensecret, genconfig, apply-all, bootstrap, kubeconfig)
    cmds:
      - '[ -f {{.TALOS_DIR}}/talsecret.sops.yaml ] || talhelper gensecret -c {{.TALOS_DIR}}/talconfig.yaml | sops --filename-override {{.TALOS_DIR}}/talsecret.sops.yaml --encrypt /dev/stdin > {{.TALOS_DIR}}/talsecret.sops.yaml'
      - task: talos:genconfig
      - task: talos:apply-all
      - task: talos:bootstrap
      - task: talos:kubeconfig
    preconditions:
      - {msg: ".sops.yaml not found", sh: "test -f {{.ROOT_DIR}}/.sops.yaml"}
      - {msg: "age key not found", sh: "test -f {{.SOPS_AGE_KEY_FILE}}"}
      - {msg: "talconfig.yaml not found", sh: "test -f {{.TALOS_DIR}}/talconfig.yaml"}
      - {msg: "talenv.yaml not found", sh: "test -f {{.TALOS_DIR}}/talenv.yaml"}
      - {msg: "talhelper not found", sh: "which talhelper"}
      - {msg: "talosctl not found", sh: "which talosctl"}
      - {msg: "sops not found", sh: "which sops"}

  flux-secret:
    desc: Fetch Flux SSH deploy key from 1Password, create flux-system secret, reconcile [VAULT=homelab ITEM=flux-deploy-key]
    vars:
      VAULT: '{{.VAULT | default "homelab"}}'
      ITEM:  '{{.ITEM  | default "flux-deploy-key"}}'
    env:
      OP_VAULT: '{{.VAULT}}'
      OP_ITEM:  '{{.ITEM}}'
    cmds:
      - '{{.ROOT_DIR}}/scripts/flux-secret.sh setup'
      - flux reconcile source git flux-system -n flux-system --timeout=2m
    preconditions:
      - {msg: "kubeconfig not found",                                                                              sh: "test -f {{.KUBECONFIG}}"}
      - {msg: "op not found — install 1Password CLI",                                                             sh: "which op"}
      - {msg: "OP_SERVICE_ACCOUNT_TOKEN not set — export it in your WSL2 host shell before starting devcontainer", sh: "test -n \"$OP_SERVICE_ACCOUNT_TOKEN\""}
      - {msg: "kubectl not found",                                                                                 sh: "which kubectl"}
      - {msg: "flux not found",                                                                                    sh: "which flux"}

  age-key:
    desc: Fetch SOPS age private key from 1Password and write to age.key [VAULT=homelab ITEM="SOPS age key" FIELD=text]
    vars:
      VAULT: '{{.VAULT | default "homelab"}}'
      ITEM:  '{{.ITEM  | default "SOPS age key"}}'
      FIELD: '{{.FIELD | default "text"}}'
    env:
      OP_VAULT: '{{.VAULT}}'
      OP_ITEM:  '{{.ITEM}}'
      OP_FIELD: '{{.FIELD}}'
    cmds:
      - '{{.ROOT_DIR}}/scripts/age-key.sh fetch'
    preconditions:
      - {msg: "op not found — install 1Password CLI",                                                              sh: "which op"}
      - {msg: "OP_SERVICE_ACCOUNT_TOKEN not set — export it in your WSL2 host shell before starting devcontainer", sh: "test -n \"$OP_SERVICE_ACCOUNT_TOKEN\""}

  onepassword-connect-secret:
    desc: Create 1Password Connect bootstrap secret in external-secrets namespace via op read (idempotent) [VAULT=Kubernetes]
    vars:
      VAULT: '{{.VAULT | default "homelab"}}'
    cmds:
      - kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply -f -
      - |
        kubectl create secret generic onepassword-connect-secrets \
          --namespace external-secrets \
          --from-literal="1password-credentials.json=$(op read 'op://{{.VAULT}}/HomeLab Credentials File/1password-credentials.json')" \
          --from-literal="token=$(op read 'op://{{.VAULT}}/HomeLab Access Token/credential')" \
          --dry-run=client -o yaml | kubectl apply -f -
    preconditions:
      - {msg: "kubeconfig not found",                                                                               sh: "test -f {{.KUBECONFIG}}"}
      - {msg: "op not found — install 1Password CLI",                                                              sh: "which op"}
      - {msg: "OP_SERVICE_ACCOUNT_TOKEN not set — export it in your WSL2 host shell before starting devcontainer", sh: "test -n \"$OP_SERVICE_ACCOUNT_TOKEN\""}
      - {msg: "kubectl not found",                                                                                  sh: "which kubectl"}

  apps:
    desc: Bootstrap apps into the cluster via helmfile (Cilium → CoreDNS → Spegel → cert-manager → Flux) — FIRST BOOT ONLY; day-2 upgrades are handled by Flux via Renovate PRs
    cmd: helmfile sync -f {{.KUBERNETES_DIR}}/bootstrap/helmfile.yaml
    preconditions:
      - {msg: "kubeconfig not found", sh: "test -f {{.KUBECONFIG}}"}
      - {msg: "helmfile.yaml not found", sh: "test -f {{.KUBERNETES_DIR}}/bootstrap/helmfile.yaml"}
      - {msg: ".sops.yaml not found", sh: "test -f {{.ROOT_DIR}}/.sops.yaml"}
      - {msg: "age key not found", sh: "test -f {{.SOPS_AGE_KEY_FILE}}"}
      - {msg: "helmfile not found", sh: "which helmfile"}

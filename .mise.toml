[env]
JUST_UNSTABLE = "1"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"

[tools]
just = "1.58.0"
gum = "2.0.0"
"aqua:mitsuhiko/minijinja" = "2.24.0"
kubectl = "1.37.0"
talosctl = "1.13.0"
# etcd version must match the etcd bundled with the running Talos version — check with: talosctl etcd status
etcd = "3.5.21"
talhelper = "3.1.17"
sops = "3.13.3"
age = "1.3.2"
yq = "4.53.6"
jq = "1.8.2"
helmfile = "1.7.4"
helm = "4.2.4"
flux2 = "2.9.4"
task = "3.53.1"
gh = "2.98.0"
1password = "2.34.0"
flux-operator = "0.58.1"
# renovate: datasource=github-releases depName=controlplaneio-fluxcd/flux-operator
flux-operator-mcp = "0.58.1"
kustomize = "5.8.1"
kubeconform = "0.8.0"
crane = "0.22.0"
